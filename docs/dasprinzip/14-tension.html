:root{
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#16171a;
  --bg-hi:#2a2c30;
  --bg-lo:#0f0f12;
  --ink:#f1ece2;
  --ink-soft:rgba(241,236,226,.62);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
:root:not([data-theme="light"]){--bg:#16171a}
:root[data-theme="dark"]{--bg:#16171a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(120% 90% at 50% 45%,var(--bg-hi) 0%,var(--bg) 55%,var(--bg-lo) 100%)}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}

#title-block{position:fixed;top:calc(28px + env(safe-area-inset-top,0px));left:max(28px,env(safe-area-inset-left,0px));z-index:200;pointer-events:none;display:flex;flex-direction:column;gap:16px}
#title-eyebrow{font:700 14px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
#title-headline{font:500 24px/1 var(--mono);letter-spacing:.02em;color:var(--ink);white-space:nowrap}
#title-headline sup{font-size:.38em;vertical-align:super;line-height:0;margin-left:6px;letter-spacing:.06em}
#title-headline .day{font-size:.55em;vertical-align:baseline;margin-right:.75em;letter-spacing:.04em}
#title-block p{font:400 9px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0}
@media (max-width:968px){#title-eyebrow{font-size:12px}#title-headline{font-size:20px}}

.grain{position:fixed;inset:0;z-index:100;pointer-events:none;opacity:.05;mix-blend-mode:screen;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.tag{position:fixed;z-index:150;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  text-align:center;font:400 11px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);pointer-events:none}
.picker{position:fixed;z-index:150;left:0;right:0;bottom:calc(44px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:center;gap:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.picker button{pointer-events:auto;font:400 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);
  background:transparent;border:1px solid var(--ink-soft);border-radius:999px;padding:7px 12px;cursor:pointer;transition:background .2s,color .2s}
.picker button:hover{background:rgba(241,236,226,.08)}
.picker button[aria-pressed="true"]{background:var(--ink);color:var(--bg-lo);border-color:var(--ink)}
.picker .snd{margin-left:14px}
.picker button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.loading{position:fixed;z-index:150;inset:0;background:var(--bg);display:grid;place-items:center;font:400 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);pointer-events:none;transition:opacity .8s}
.loading.off{opacity:0}
.picker .snd+.snd{margin-left:14px}
body.light{--ink:#26303b;--ink-soft:rgba(38,48,59,.6)}

import * as THREE from 'three/webgpu';

} from 'three/tsl';

const BUILD = 'v0.33-gingham';
console.log('%c' + BUILD, 'color:#d6c48a');

const QS = new URLSearchParams(location.search);
const LOWQ = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

window.addEventListener('unhandledrejection', (e) => fail(e.reason));

////////////////////////////////////////////////////////////////
//// PARAMS
////////////////////////////////////////////////////////////////

const P = {

////////////////////////////////////////////////////////////////

  const corner = !loose && (ix === 0 || ix === CW - 1) && (iy === 0 || iy === CH - 1);
  const edge = !corner && (ix === CW - 1 || iy === 0);
  init[k] = X0 + ix * CDX;
  init[k + 1] = P.height + (edge ? 0 : (Math.random() - 0.5) * 1e-4);
  init[k + 2] = Z0 + iy * CDX;
  init[k + 3] = corner ? 1 : edge ? 2 : 0;
}

const MAXO = 14;

const PHI = (1 + Math.sqrt(5)) / 2;
const nz3 = (x, y, z) => { const l = Math.hypot(x, y, z); return vec3(x / l, y / l, z / l); };
const ICO_N = [nz3(1, 1, 1), nz3(0, 1 / PHI, PHI), nz3(1 / PHI, PHI, 0), nz3(PHI, 0, 1 / PHI)];

const sdRBox = (q, b, r) => {
  const e = abs(q).sub(b).add(r);
  return length(max(e, 0.0)).add(min(max(e.x, max(e.y, e.z)), 0.0)).sub(r);
};
const sdRRev = (d2, r) => min(max(d2.x, d2.y), 0.0).add(length(max(d2, 0.0))).sub(r);

const sminF = (a, b, k) => {
  const h = clamp(float(0.5).add(b.sub(a).mul(0.5).div(k)), 0.0, 1.0);
  return mix(b, a, h).sub(h.mul(h.oneMinus()).mul(k));
};
const shapeSDF = Fn(([q, kind, s, ext, b0, b1, b2, b3]) => {
  const d = length(q).sub(s).toVar();
  If(kind.lessThan(0.5), () => {
    d.assign(sdRBox(q, ext.xyz, ext.w));
  }).ElseIf(kind.lessThan(1.5), () => {
    d.assign(min(sdRBox(q, ext.xyz, ext.w), sdRBox(q, ext.yxz, ext.w)));
  }).ElseIf(kind.lessThan(2.5), () => {
    d.assign(sdRRev(vec2(length(q.xy).sub(ext.x).add(ext.w), abs(q.z).sub(ext.z).add(ext.w)), ext.w));
  }).ElseIf(kind.lessThan(3.5), () => {
    d.assign(length(q).sub(s));
  }).ElseIf(kind.lessThan(4.5), () => {
    d.assign(length(vec2(length(q.xy).sub(s.mul(0.7)), q.z)).sub(s.mul(0.3)));
  }).ElseIf(kind.lessThan(5.5), () => {
    const mid = ext.x.add(ext.y).mul(0.5), hw = ext.y.sub(ext.x).mul(0.5);
    d.assign(sdRRev(vec2(abs(length(q.xy).sub(mid)).sub(hw).add(ext.w), abs(q.z).sub(ext.z).add(ext.w)), ext.w));
  }).ElseIf(kind.lessThan(6.5), () => {
    const a = abs(q);
    d.assign(max(max(dot(a, ICO_N[0]), dot(a, ICO_N[1])), max(dot(a, ICO_N[2]), dot(a, ICO_N[3]))).sub(s.mul(0.7947)));
  }).Else(() => {
    const k = ext.x;
    const db = sminF(sminF(length(q.sub(b0.xyz)).sub(b0.w), length(q.sub(b1.xyz)).sub(b1.w), k),
      sminF(length(q.sub(b2.xyz)).sub(b2.w), length(q.sub(b3.xyz)).sub(b3.w), k), k);
    d.assign(db);
  });
  return d;
}).setLayout({ name: 'shapeSDF', type: 'float', inputs: [{ name: 'q', type: 'vec3' }, { name: 'kind', type: 'float' }, { name: 's', type: 'float' }, { name: 'ext', type: 'vec4' }, { name: 'b0', type: 'vec4' }, { name: 'b1', type: 'vec4' }, { name: 'b2', type: 'vec4' }, { name: 'b3', type: 'vec4' }] });

const uObjInv = [], uObjPar = [], uObjPos = [], uObjExt = [], uBall = [];
for (let k = 0; k < MAXO; k++) {
  uObjInv.push(uniform(new THREE.Matrix4()));
  uObjPar.push(uniform(new THREE.Vector4(0, 0.5, 0, 0)));
  uObjPos.push(uniform(new THREE.Vector3(99, 0, 0)));
  uObjExt.push(uniform(new THREE.Vector4(0.3, 0.3, 0.3, 0.05)));
  uBall.push([0, 1, 2, 3].map(() => uniform(new THREE.Vector4(0, 0, 0, -1))));
}

const pushOut = (p) => {
  for (let k = 0; k < MAXO; k++) {
    const par = uObjPar[k];
    If(par.z.greaterThan(0.5).and(length(p.sub(uObjPos[k])).lessThan(par.y.mul(1.05).add(uThick).add(0.03))), () => {
      const sd = (x) => shapeSDF(uObjInv[k].mul(vec4(x, 1.0)).xyz, par.x, par.y, uObjExt[k], ...uBall[k]);
      const f = sd(p);
      If(f.lessThan(uThick), () => {
        const e = 0.004;
        const g = vec3(
          sd(p.add(vec3(e, 0, 0))).sub(sd(p.sub(vec3(e, 0, 0)))),
          sd(p.add(vec3(0, e, 0))).sub(sd(p.sub(vec3(0, e, 0)))),
          sd(p.add(vec3(0, 0, e))).sub(sd(p.sub(vec3(0, 0, e))))
        );
        const gn = normalize(g.add(vec3(0, 1e-5, 0)));
        const dir = normalize(gn.add(vec3(0, uLiftBias, 0)));
        p.addAssign(dir.mul(uThick.sub(f).div(max(dot(dir, gn), 0.25))));
      });
    });
  }
  If(uSuzOn.greaterThan(0.5), () => {
    const d = p.xz.sub(uSuzC.xz);
    const cs = cos(uSuzYaw), sn = sin(uSuzYaw);
    const l = vec2(d.x.mul(cs).sub(d.y.mul(sn)), d.x.mul(sn).add(d.y.mul(cs))).div(SUZ.scale);
    const suv = l.div(SUZ.H * 2).add(0.5);
    If(suv.x.greaterThan(0.0).and(suv.x.lessThan(1.0)).and(suv.y.greaterThan(0.0)).and(suv.y.lessThan(1.0)), () => {
      const hraw = texture(suzTex, suv).level(0).r;
      If(hraw.greaterThan(-5.0), () => {
        const h = uSuzC.y.add(hraw.mul(SUZ.scale)).add(uThick);
        If(p.y.lessThan(h), () => { p.y.assign(h); });
      });
    });
  });
  p.y.assign(max(p.y, uThick.mul(0.6)));
};

const restOf = (i) => {
  const ix = int(i.mod(uint(CW))), iy = int(i.div(uint(CW)));

};

const kIntegrate = Fn(() => {
  const i = instanceIndex;
  const c = cPos.element(i).toVar();
  If(c.w.lessThan(0.5).or(c.w.greaterThan(1.5)), () => {
    const p = c.xyz;
    const v = p.sub(cPrev.element(i).xyz).mul(uDamp);
    cPrev.element(i).assign(c);
    const n = cNrm.element(i).xyz;
    const gust = mx_noise_float(vec3(p.x.mul(0.45).add(uWindT.mul(1.4)), p.z.mul(0.55), uWindT.mul(0.35))).mul(0.6).add(0.75);
    const flutter = mx_noise_float(vec3(p.x.mul(2.2).add(uWindT.mul(3.0)), p.z.mul(2.2), uWindT.mul(1.1))).mul(0.35);
    const wv = uWind.mul(gust.add(flutter));
    const wf = n.mul(dot(n, wv)).add(wv.mul(0.25)).add(vec3(0, flutter.mul(uWind.length()).mul(0.6), 0));
    cPos.element(i).assign(vec4(p.add(v).add(vec3(0, uGravity, 0).add(wf).mul(uDt.mul(uDt))), c.w));
  });
})().compute(CN, [64]);

const SPRINGS = [];
for (const [ox, oy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) SPRINGS.push([ox, oy, CDX, 1.0]);
for (const [ox, oy] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) SPRINGS.push([ox, oy, CDX * Math.SQRT2, 0.6]);
for (const [ox, oy] of [[2, 0], [-2, 0], [0, 2], [0, -2]]) SPRINGS.push([ox, oy, CDX * 2, 0.7]);

const makeRelax = (src, dst) => Fn(() => {
  const i = instanceIndex;
  const ix = int(i.mod(uint(CW))), iy = int(i.div(uint(CW)));
  const c = src.element(i).toVar();
  If(c.w.greaterThan(0.5).and(c.w.lessThan(1.5)), () => {
    dst.element(i).assign(c);
  }).Else(() => {
    const p = c.xyz.toVar();
    const disp = vec3(0.0).toVar();
    const cnt = float(0.0).toVar();
    for (const [ox, oy, rest, wgt] of SPRINGS) {
      const nx = ix.add(int(ox)), ny = iy.add(int(oy));
      const ok = nx.greaterThanEqual(int(0)).and(nx.lessThan(int(CW))).and(ny.greaterThanEqual(int(0))).and(ny.lessThan(int(CH)));
      If(ok, () => {
        const d = src.element(uint(ny.mul(int(CW)).add(nx))).xyz.sub(p);
        const L = length(d);
        If(L.greaterThan(1e-6), () => { disp.addAssign(d.mul(L.sub(uTension.mul(rest)).div(L)).mul(0.5 * wgt)); });
        cnt.addAssign(wgt);
      });

const texDepth = mrtRT.textures[1];
const texNormalSpec = mrtRT.textures[2];
const texAlbedo = mrtRT.textures[3];

const makeSSSBlurMaterial = (inputTexture, direction, resolutionV2) => {
  const uRes = uniform(resolutionV2.clone());
  const uDir = uniform(new THREE.Vector2(direction[0], direction[1]));
  const uFBOScale = uniform(blurScale);
  const mat = new THREE.MeshBasicNodeMaterial();
  mat.colorNode = Fn(() => {
    const kernelSize = 4;
    const texelSize = vec2(1).div(uRes);
    const fSigma = float(kernelSize);
    const gauss = (x) => float(0.15915494).div(fSigma).mul(exp(x.mul(x).negate().div(fSigma.mul(2))));
    const cSample = texture(inputTexture, uv());
    const cDiffuse = cSample.rgb.toVar();
    const cId = cSample.w.mul(255).toVar();
    const cDepth = texture(texDepth, uv()).r.toVar();
    const cNormal = texture(texNormalSpec, uv()).xyz.toVar();
    const scale = uSSSScale.mul(uFBOScale);
    const kernelSample = (uvNode, w) => {
      const dSample = texture(inputTexture, uvNode);
      const res = dSample.rgb;
      const ns = texture(texNormalSpec, uvNode);
      const sid = dSample.w.mul(255);
      const depth = texture(texDepth, uvNode).r;
      const n = length(cNormal.sub(ns.xyz));
      const s = min(cDepth.sub(depth).abs().mul(uSSSDepthFactor).mul(n.add(1)), 1.0);
      const t = length(res.sub(cDiffuse)).mul(w).mul(0.7);
      const modulated = mix(res.mul(uSSSLumFactor.add(t)), cDiffuse, s);
      const sameId = sid.round().sub(cId.round()).abs().lessThan(0.5);
      return select(sameId, modulated, cDiffuse);
    };
    const w0 = gauss(float(0));
    const diffuseSum = cDiffuse.mul(w0).toVar();
    const weightSum = w0.toVar();
    Loop({ start: int(1), end: int(kernelSize), type: 'int', condition: '<' }, ({ i }) => {
      const x = float(i);
      const w = gauss(x);
      const uvOffset = uDir.mul(texelSize).mul(x).mul(scale);
      diffuseSum.addAssign(kernelSample(uv().add(uvOffset), w).mul(w));
      diffuseSum.addAssign(kernelSample(uv().sub(uvOffset), w).mul(w));
      weightSum.addAssign(w.mul(2));
    });
    const result = vec4(diffuseSum.div(weightSum), cSample.w);
    const noSSS = cId.round().lessThan(0.5).or(cId.round().greaterThan(99.5));
    return select(noSSS, vec4(0), result);
  })();
  return { mat, uRes };
};
const sssH1 = makeSSSBlurMaterial(texDiffuseId, [3, 0], viewportSize);
const sssV1 = makeSSSBlurMaterial(sssBlurRTH.texture, [0, 3], blurSize);
const sssH2 = makeSSSBlurMaterial(sssBlurRTV.texture, [1, 0], blurSize);
const sssV2 = makeSSSBlurMaterial(sssBlurRTH.texture, [0, 1], blurSize);

////////////////////////////////////////////////////////////////
//// SSAO
////////////////////////////////////////////////////////////////

const KERNEL_SIZE = 32;
const kernel = [];
for (let i = 0; i < KERNEL_SIZE; i++) {
  const sample = new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random()).normalize();
  let sc = i / KERNEL_SIZE;
  sc = THREE.MathUtils.lerp(0.1, 1, sc * sc);
  kernel.push(sample.multiplyScalar(sc));
}
const uKernel = uniformArray(kernel);
const ssaoNoiseTex = (() => {
  const data = new Float32Array(16 * 4);
  for (let i = 0; i < 16; i++) data[i * 4] = Math.random() * 2 - 1;
  const tex = new THREE.DataTexture(data, 4, 4, THREE.RGBAFormat, THREE.FloatType);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.magFilter = tex.minFilter = THREE.NearestFilter;
  tex.needsUpdate = true;
  return tex;
})();
const uSSAORes = uniform(ssaoSize.clone());
const uProj = uniform(camera.projectionMatrix);
const uProjInv = uniform(camera.projectionMatrixInverse);
const uCamWorld = uniform(camera.matrixWorld);
const perspectiveDepthToViewZ = (d, n, f) => n.mul(f).div(f.sub(n).mul(d).sub(f));
const viewZToOrthographicDepth = (z, n, f) => z.add(n).div(n.sub(f));

const ssaoMaterial = new THREE.MeshBasicNodeMaterial();
ssaoMaterial.colorNode = Fn(() => {
  const depth = texture(texDepth, uv()).x.toVar();
  const viewZ = perspectiveDepthToViewZ(depth, uCamNear, uCamFar).toVar();
  const clipW = uProj.mul(vec4(0, 0, viewZ, 1)).w;
  const clipPosition = vec4(vec3(uv(), depth).sub(0.5).mul(2), 1).mul(clipW);
  const viewPosition = uProjInv.mul(clipPosition).xyz.toVar();
  const viewNormal = texture(texNormalSpec, uv()).xyz.toVar();
  const noiseScale = uSSAORes.div(4);
  const random = vec3(texture(ssaoNoiseTex, uv().mul(noiseScale)).r).toVar();
  const tangent = normalize(random.sub(viewNormal.mul(dot(random, viewNormal))));
  const bitangent = cross(viewNormal, tangent);
  const kernelMatrix = mat3(tangent, bitangent, viewNormal);
  const occlusion = float(0).toVar();
  Loop({ start: int(0), end: int(KERNEL_SIZE), type: 'int', condition: '<' }, ({ i }) => {
    const sampleVector = kernelMatrix.mul(uKernel.element(i));
    const samplePoint = viewPosition.add(sampleVector.mul(uKernelRadius));
    const spNDC = uProj.mul(vec4(samplePoint, 1)).toVar();
    spNDC.divAssign(spNDC.w);
    const spUv = spNDC.xy.mul(0.5).add(0.5);
    const storedDepth = texture(texDepth, spUv).x;
    const realViewZ = perspectiveDepthToViewZ(storedDepth, uCamNear, uCamFar);
    const realDepth = viewZToOrthographicDepth(realViewZ, uCamNear, uCamFar);
    const sampleDepth = viewZToOrthographicDepth(samplePoint.z, uCamNear, uCamFar);
    const delta = sampleDepth.sub(realDepth);
    const occluded = delta.greaterThan(uMinDistance).and(delta.lessThan(uMaxDistance));
    occlusion.addAssign(select(occluded, float(1), float(0)));
  });
  const aoV = float(1).sub(clamp(occlusion.div(KERNEL_SIZE), 0, 1));
  return vec4(vec3(aoV), 1);
})();

const uSSAOBlurRes = uniform(ssaoSize.clone());
const ssaoBlurMaterial = new THREE.MeshBasicNodeMaterial();
ssaoBlurMaterial.colorNode = Fn(() => {
  const texelSize = vec2(1).div(uSSAOBlurRes);
  const result = float(0).toVar();
  Loop(
    { start: int(-2), end: int(2), type: 'int', condition: '<=' },
    { start: int(-2), end: int(2), type: 'int', condition: '<=' },
    ({ i, j }) => {
      result.addAssign(texture(ssaoInternalRT.texture, uv().add(vec2(float(i), float(j)).mul(texelSize))).r);
    }
  );
  return vec4(vec3(result.div(25)), 1);
})();

//// COMPOSITE
////////////////////////////////////////////////////////////////

const rgb2hsv = (rgb) => {
  const K = vec4(0.0, -1.0 / 3.0, 2.0 / 3.0, -1.0);
  const p = mix(vec4(rgb.bg, K.wz), vec4(rgb.gb, K.xy), step(rgb.b, rgb.g)).toVar();
  const q = mix(vec4(p.xyw, rgb.r), vec4(rgb.r, p.yzx), step(p.x, rgb.r)).toVar();
  const d = q.x.sub(min(q.w, q.y));
  const e = 1.0e-10;
  return vec3(abs(q.z.add(q.w.sub(q.y).div(d.mul(6).add(e)))), d.div(q.x.add(e)), q.x);
};
const hsv2rgb = (hsv) => {
  const rgb = clamp(abs(hsv.x.mul(6).add(vec3(0, 4, 2)).mod(6).sub(3)).sub(1), 0, 1);
  return hsv.z.mul(mix(vec3(1), rgb, hsv.y));
};

const compositeMaterial = new THREE.MeshBasicNodeMaterial();
compositeMaterial.colorNode = Fn(() => {
  const diffuseId = texture(texDiffuseId, uv());
  const normalSpecular = texture(texNormalSpec, uv());
  const albedoIn = texture(texAlbedo, uv()).rgb;
  const diffuse = diffuseId.rgb;
  const specular = normalSpecular.w;
  const sss = texture(sssBlurRTV.texture, uv()).toVar();
  const ssao = texture(ssaoRT.texture, uv());
  const hsv = rgb2hsv(albedoIn).toVar();
  hsv.x.subAssign(uHueShift);
  hsv.z.assign(max(uTintVMin, hsv.z));
  const albedoTint = hsv2rgb(hsv);
  const sssTinted = min(vec3(1), sss.rgb.mul(albedoTint));
  const aoFactor = mix(float(1), ssao.r, uSSAOStrength);
  const color = max(diffuse, sssTinted).add(specular).mul(aoFactor).mul(uExposure).toVar();
  const gray = vec3(dot(vec3(.3, .59, .11), color));
  const graded = mix(color, gray, uDesat);

  const covered = step(0.5, length(normalSpecular.xyz));
  const pC = uv().sub(0.5).mul(vec2(uAspect, 1.0));
  const dC = length(pC);
  const bgBase = mix(uBgInner, uBgOuter, smoothstep(0.02, 0.85, dC));
  const pool = smoothstep(0.62, 0.0, length(pC.mul(vec2(0.75, 1.45)).sub(vec2(0.0, -0.16)))).mul(uBgGlow);
  const halo = smoothstep(0.14, 0.0, abs(dC.sub(0.47))).mul(uBgGlow.mul(0.3));
  const bgExp = bgBase.add(pool).add(halo).mul(uExposure);
  const bg = mix(bgExp, vec3(dot(vec3(.3, .59, .11), bgExp)), uDesat);

  const depthN = texture(texDepth, uv()).x;
  const viewZc = uCamNear.add(depthN.mul(uCamFar.sub(uCamNear))).negate();
  const ndcX = uv().x.mul(2).sub(1);
  const ndcY = float(1).sub(uv().y.mul(2));
  const p00 = uProj.mul(vec4(1, 0, 0, 0)).x;
  const p11 = uProj.mul(vec4(0, 1, 0, 0)).y;
  const viewPos = vec3(ndcX.mul(viewZc.negate()).div(p00), ndcY.mul(viewZc.negate()).div(p11), viewZc);
  const worldPos = uCamWorld.mul(vec4(viewPos, 1)).xyz;
  const fadeFloor = float(1).sub(smoothstep(uFloorFadeStart, uFloorFadeEnd, length(worldPos.xz)));
  const idc = diffuseId.a.mul(255);
  const fadeW = mix(fadeFloor, float(1), step(0.5, idc));
  return vec4(mix(bg, graded, covered.mul(fadeW)), 1);
})();

};
if (!QS.has('nowarm')) await warmUp();
document.getElementById('loading').classList.add('off');

let firstFrame = true, stillN = 0;
renderer.setAnimationLoop((ts) => {
  clock.update(ts);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!QS.has('still')) {
    updateWanderers(STEP);
    updatePhase(STEP);
    WIND.t += STEP;
    WIND.level = 0.65 + 0.35 * Math.sin(WIND.t * 0.23) * Math.sin(WIND.t * 0.071 + 1.3);
    uWindT.value = WIND.t;
    uWind.value.set(-WIND.strength * WIND.level, 0.08 * WIND.strength, Math.sin(WIND.t * 0.13) * 0.18 * WIND.strength);
    simStep();
    stepFloorField();
    updateSound(dt * 1000);
  }
  controls.update();
  syncCamera();
  render();
  if (firstFrame) { firstFrame = false; document.getElementById('loading').classList.add('off'); }
  if (QS.has('still') && ++stillN >= 3) { renderer.setAnimationLoop(null); window.__ready = true; }
});
</script>
</body>
</html>
