<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Labyrinth</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>
/* Codevember 2026 overlay: title block top-left, pill button row + tag line at the bottom, HUD panels above it */
:root{
  color-scheme:dark;
  --space:#020c14;
  --ink:#e6f8ff;
  --ink-soft:rgba(230,248,255,.62);
  --glass:rgba(20,70,100,.22);
  --line:rgba(230,248,255,.22);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);background:var(--space);font-family:var(--mono)}
#gl{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#title-block{position:fixed;top:calc(28px + env(safe-area-inset-top,0px));left:max(28px,env(safe-area-inset-left,0px));z-index:200;pointer-events:none;display:flex;flex-direction:column;gap:16px;text-shadow:0 1px 10px rgba(0,30,50,.45)}
#title-eyebrow{font:700 14px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
#title-headline{font:500 24px/1 var(--mono);letter-spacing:.02em;white-space:nowrap}
#title-headline sup{font-size:.38em;vertical-align:super;line-height:0;margin-left:6px;letter-spacing:.06em}
#title-headline .day{font-size:.55em;vertical-align:baseline;margin-right:.75em;letter-spacing:.04em}
#title-block p{font:400 9px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0}
@media (max-width:968px){#title-eyebrow{font-size:12px}#title-headline{font-size:20px}}
.grain{position:fixed;inset:0;z-index:100;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.tag{position:fixed;z-index:150;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  text-align:center;font:400 11px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);pointer-events:none}
.picker{position:fixed;z-index:150;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.picker .grp{display:flex;gap:4px}
.picker button{pointer-events:auto;font:400 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);
  background:var(--glass);border:1px solid var(--ink-soft);border-radius:999px;padding:7px 12px;cursor:pointer;transition:background .2s,color .2s;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.picker button:hover{background:rgba(230,248,255,.14)}
.picker button[aria-pressed="true"]{background:var(--ink);color:var(--space);border-color:var(--ink)}
.picker button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* credit line: subtle grey, under the instructions */
.credit{position:fixed;z-index:150;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font:400 9px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(230,248,255,.14);pointer-events:none}
.credit a{color:inherit;text-decoration:underline;text-decoration-color:rgba(230,248,255,.08);text-underline-offset:2px;pointer-events:auto}
.credit a:hover{color:rgba(230,248,255,.5)}
.credit a:focus-visible{outline:1px solid var(--ink-soft);outline-offset:2px}
.loading{position:fixed;z-index:150;inset:0;display:grid;place-items:center;font:400 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);pointer-events:none;transition:opacity .8s}
.loading.off{opacity:0}
/* HUD panels (same type + glass as the buttons) */
.panel{position:fixed;z-index:140;bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--glass);border:1px solid var(--line);border-radius:10px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);pointer-events:none}
#board{left:max(28px,env(safe-area-inset-left,0px));padding:12px 14px;min-width:180px;font:400 11px/1.6 var(--mono);letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
#board h3{margin:0 0 6px;font:700 11px/1 var(--mono);letter-spacing:.08em}
#board .row{display:grid;grid-template-columns:18px 40px 1fr;gap:6px}
#board .row.hd{color:var(--ink-soft)}
#board .row.dead{opacity:.4}
#board .sw{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
#mapwrap{right:max(28px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:flex-end;padding:10px}
#map{width:180px;height:180px;display:block}
#speed{width:6px;height:180px;background:rgba(230,248,255,.12);border-radius:3px;position:relative;overflow:hidden}
#speed i{position:absolute;left:0;right:0;bottom:0;height:20%;background:linear-gradient(#ff7a1a,#7fe6ff);border-radius:3px}
#notice{position:fixed;z-index:160;left:50%;top:24%;transform:translateX(-50%);font:500 22px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  text-shadow:0 0 16px currentColor;opacity:0;transition:opacity .25s;white-space:nowrap;pointer-events:none}
#dead{position:fixed;z-index:160;inset:0;display:grid;place-content:center;text-align:center;gap:14px;background:radial-gradient(rgba(60,10,0,.45),transparent 65%);pointer-events:none}
#dead b{font:500 clamp(30px,5.5vw,56px)/1 var(--mono);letter-spacing:.02em;color:#c8ff3a;text-shadow:0 0 14px rgba(200,255,58,.75),0 0 38px rgba(200,255,58,.45)}
/* start screen: one pill in the Derezzed spot; HUD + buttons fade in on start */
#start{position:fixed;z-index:170;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;pointer-events:none;transition:opacity .5s}
#start button{pointer-events:auto;font:500 22px/1 var(--mono);letter-spacing:.02em;color:var(--space);background:var(--ink);border:1px solid var(--ink);border-radius:999px;
  padding:14px 34px;cursor:pointer;box-shadow:0 0 24px rgba(127,230,255,.45);transition:transform .2s,box-shadow .2s}
#start button:hover{transform:scale(1.04);box-shadow:0 0 36px rgba(127,230,255,.7)}
#start button:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
#start small{font:400 11px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
body.prestart .panel,body.prestart .picker{opacity:0;pointer-events:none}
body.prestart .picker button{pointer-events:none}
.panel,.picker{transition:opacity .6s}
body:not(.prestart) #start{opacity:0}
#dead small{font:400 11px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
#paused{position:fixed;z-index:160;left:50%;top:45%;transform:translate(-50%,-50%);font:500 22px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;pointer-events:none}
#err{position:fixed;z-index:300;inset:0;display:grid;place-content:center;text-align:center;padding:24px;font:400 12px/1.6 var(--mono);letter-spacing:.06em}
@media (max-width:760px){#board{display:none}#map{width:120px;height:120px}#speed{height:120px}.panel{bottom:calc(130px + env(safe-area-inset-bottom,0px))}}
</style>

</head>
<body>
<canvas id="gl"></canvas>
<div id="title-block">
  <span id="title-eyebrow">Codevember 2026</span>
  <span id="title-headline"><span class="day">Day13</span>Labyrinth<sup>A Grid Run</sup></span>
  <p>WebGPU · three.js · TSL</p>
</div>
<div class="grain"></div>
<div class="loading" id="loading">booting the grid…</div>
<div class="panel" id="board"><h3>Leaderboard</h3><div id="rows"></div></div>
<div class="panel" id="mapwrap"><div id="speed"><i id="spd"></i></div><canvas id="map" width="360" height="360"></canvas></div>
<div id="notice"></div>
<div id="paused" hidden>Paused</div>
<div id="start"><button type="button" id="bStart">Start</button><small>Sound on · arrow keys or tap to steer</small></div>
<div id="dead" hidden><b>Derezzed</b><small>Space or tap to re-enter the grid</small></div>
<nav class="picker" id="picker" aria-label="Controls">
  <div class="grp"><button type="button" data-view="0" aria-pressed="true">Chase</button><button type="button" data-view="1" aria-pressed="false">High</button><button type="button" data-view="2" aria-pressed="false">Top</button></div>
  <div class="grp"><button type="button" id="bMap" aria-pressed="true">Map</button><button type="button" id="bBoard" aria-pressed="true">Board</button></div>
  <div class="grp"><button type="button" id="bPause" aria-pressed="false">Pause</button></div>
  <div class="grp"><button type="button" id="snd" aria-pressed="false">Sound off</button></div>
</nav>
<div class="credit">Tron origin from <a href="https://github.com/srmcgann/TRON2.0/blob/main/index.html" target="_blank" rel="noopener">Scott R McGann</a></div>
<div class="tag">← → steer · ↑ ↓ speed · space respawn · V view · tap left / right to turn</div>
<div id="err" hidden></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
  "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
  "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
  "makio-meshline": "https://cdn.jsdelivr.net/npm/makio-meshline@1.4.0/index.js"
} }
</script>

<script type="module">
import * as THREE from 'three/webgpu';
import { Fn, uniform, uv, vec2, vec3, float, positionWorld, positionLocal, cameraPosition, normalWorld,
  abs, fract, fwidth, normalize, smoothstep, max, mix, exp, pow, clamp, step, sin, time, length, hash, instanceIndex,
  floor, reflector, pass, screenUV, cos, atan, asin, texture, vec4, positionGeometry, mx_fractal_noise_float, mx_noise_float, min } from 'three/tsl';
import { bloom } from 'three/addons/tsl/display/BloomNode.js';
import { MeshLine } from 'makio-meshline';

const BUILD = 'v1.2.2-day13-labyrinth';
console.log('%cGrid Run ' + BUILD, 'color:#3fd8ff');

////////////////////////////////////////////////////////////////////////////////
// Game constants (logic runs at a fixed 60 Hz like the original)
////////////////////////////////////////////////////////////////////////////////
const DT = 1 / 60;
const HALF = 240;               // arena half size (original perG*perSp/2)
const MAX_LEN = 700;            // trail length cap (original maxPlayerLength)
const MIN_SP = .1, MAX_SP = 4.0, START_SP = .8;
const TAPE_H = 2.3;
// three.js: camera behind looking +Z has -X on screen right → clockwise order
const DIRS = [[0, 1], [-1, 0], [0, -1], [1, 0]];
const COLS = [[1.0, .36, .03], [.06, .78, 1.0], [1.0, .1, .5], [.72, 1.0, .08], [.58, .28, 1.0]];
const CSS = ['#ff7a1a', '#2fd4ff', '#ff3b8f', '#c8ff3a', '#9a6bff'];
const NAMES = ['YOU', 'AI-1', 'AI-2', 'AI-3', 'AI-4'];

////////////////////////////////////////////////////////////////////////////////
// Renderer, scene, camera
////////////////////////////////////////////////////////////////////////////////
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGPURenderer({ canvas, antialias: false, forceWebGL: /webgl/.test(location.hash + location.search) });
// render scale: starts at ≤1 and adapts to the measured frame time (see frame())
const QMAX = Math.min(devicePixelRatio, 1);
let quality = QMAX;
renderer.setPixelRatio(quality);
renderer.setSize(Math.max(1, innerWidth), Math.max(1, innerHeight), false);   // no inline px size: CSS keeps the canvas at 100%
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const HAZE = new THREE.Color(0x03182a);   // also what the floor mirror shows where nothing is reflected
scene.background = HAZE;
// black range fog: the field dissolves into darkness past the arena (sky, city and spire glow have fog:false)
scene.fog = new THREE.Fog(0x000000, 120, 540);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 6000);
camera.position.set(0, 4, -100);

////////////////////////////////////////////////////////////////////////////////
// Sky dome — dark teal zenith, bright haze band at the horizon
////////////////////////////////////////////////////////////////////////////////
const SKY_LAYER = 1;                       // sky, city, spire glow: seen by the camera, skipped by the floor mirror
camera.layers.enable(SKY_LAYER);
const skyColor = Fn(([dir]) => {
    const y = dir.y;
    const pl = dir.xz.div(max(y, 0.).add(.09));
    const q = pl.mul(.3).add(vec2(time.mul(.006), time.mul(.0025)));
    const wx = mx_fractal_noise_float(vec3(q, 1.7), 2, 2., .5);
    const wz = mx_fractal_noise_float(vec3(q.add(5.2), 3.1), 2, 2., .5);
    const qw = q.add(vec2(wx, wz).mul(.6));
    const d0 = mx_fractal_noise_float(vec3(qw, time.mul(.004)), 4, 2.03, .55);
    const det = mx_fractal_noise_float(vec3(qw.mul(3.7), 9.), 2, 2., .5);
    const dens = clamp(smoothstep(-.3, .45, d0).add(det.mul(.2)), 0., 1.);
    const fwd = smoothstep(-.3, 1., dir.z);                                      // towards the spire
    const beam = exp(abs(dir.x).mul(-5.5)).mul(fwd);                             // light column behind the spire
    const cityLit = exp(y.mul(-7.)).mul(fwd.mul(.8).add(.2)).add(beam.mul(exp(y.mul(-2.5))).mul(.45));
    const gap = vec3(.001, .004, .01).add(vec3(.01, .05, .09).mul(cityLit));    // sky seen through the gaps
    const top = vec3(.004, .012, .026);
    const under = mix(top, vec3(.04, .19, .32), clamp(cityLit, 0., 1.));
    const rim = smoothstep(.4, .0, abs(dens.sub(.5))).mul(cityLit).mul(.5);      // bright silver-lining edges
    const cloud = under.mul(det.mul(.4).add(.7)).add(vec3(.06, .3, .48).mul(rim));
    const horizon = smoothstep(0., .06, y);
    const haze = vec3(.03, .16, .27).mul(exp(abs(y).mul(-18.))).mul(fwd.mul(.6).add(.4));
    const glow = vec3(.2, .65, 1.).mul(exp(abs(y).mul(-28.))).mul(exp(abs(dir.x).mul(-9.))).mul(fwd).mul(.9);
    const sky = mix(gap, cloud, dens.mul(horizon)).add(haze).add(glow);
    return mix(vec3(.004, .02, .035), sky, smoothstep(-.02, .015, y));
});
// the cloud shader is heavy → bake it into a lat/long texture twice a second, the dome just samples it
const SKY_EL0 = -.25, SKY_EL1 = Math.PI / 2;
const skyRT = new THREE.RenderTarget(1024, 384, { type: THREE.HalfFloatType, depthBuffer: false });
skyRT.texture.wrapS = THREE.RepeatWrapping;
const skyBakeScene = new THREE.Scene(), skyBakeCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
{
  const bm = new THREE.MeshBasicNodeMaterial({ fog: false, depthTest: false, depthWrite: false });
  bm.colorNode = Fn(() => {
    const u = positionLocal.xy.mul(.5).add(.5);                     // quad spans -1..1 → 0..1 (y up)
    const lon = u.x.sub(.5).mul(Math.PI * 2), el = mix(float(SKY_EL0), float(SKY_EL1), u.y), ce = cos(el);
    return skyColor(vec3(ce.mul(sin(lon)), sin(el), ce.mul(cos(lon))));
  })();
  const bq = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bm); bq.position.z = -.5; bq.frustumCulled = false;
  skyBakeScene.add(bq);
  const m = new THREE.MeshBasicNodeMaterial({ side: THREE.BackSide, fog: false, depthWrite: false });
  m.colorNode = Fn(() => {
    const dir = positionLocal.normalize();
    const su = atan(dir.x, dir.z).div(Math.PI * 2).add(.5);
    const sv = clamp(asin(clamp(dir.y, -1., 1.)).sub(SKY_EL0).div(SKY_EL1 - SKY_EL0), 0., 1.);
    return texture(skyRT.texture, vec2(su, float(1).sub(sv))).rgb;     // render targets sample top-down (same on WebGPU + WebGL)
  })();
  const sky = new THREE.Mesh(new THREE.SphereGeometry(4000, 48, 24), m);
  sky.renderOrder = -10;
  sky.layers.set(SKY_LAYER);
  scene.add(sky);
}
let skyBakeT = -1;
function bakeSky(t) {
  if (t - skyBakeT < .5 && skyBakeT >= 0) return;
  skyBakeT = t;
  renderer.setRenderTarget(skyRT); renderer.render(skyBakeScene, skyBakeCam); renderer.setRenderTarget(null);
}

////////////////////////////////////////////////////////////////////////////////
// Floor — wet mirror with procedural grid (TSL reflector)
////////////////////////////////////////////////////////////////////////////////
const refl = reflector({ resolutionScale: .5 });
// tape-head glints on the floor, faked in the shader instead of 4 real point lights
const headU = [0, 1, 2, 3].map(() => ({ pos: uniform(new THREE.Vector3(0, 0, 0)), col: uniform(new THREE.Color()) }));
{
  // glossy dark panels (10×10 rects), per-panel gloss, mirror + faked head glints — unlit, so no light loops at all
  const m = new THREE.MeshBasicNodeMaterial();
  const p = positionWorld.xz;
  const gridAA = (s, w) => {
    const c = p.div(s);
    const ld = abs(fract(c.sub(.5)).sub(.5)).mul(s);
    const aa = fwidth(ld).max(1e-4);
    const g = float(1).sub(smoothstep(vec2(w).sub(aa), vec2(w).add(aa), ld)).mul(clamp(vec2(w).div(aa), 0., 1.));
    return max(g.x, g.y);
  };
  const cell = floor(p.div(10.)).add(2000.);                   // keep hash input positive
  const rnd = hash(cell.x.mul(127.1).add(cell.y.mul(311.7)));
  const rough = rnd.mul(.22).add(.12);
  const camD = length(positionWorld.sub(cameraPosition));
  const box = max(abs(p.x), abs(p.y));
  const inside = mix(float(.3), float(1.), step(box, HALF));
  const fres = pow(float(1).sub(clamp(normalize(cameraPosition.sub(positionWorld)).y, 0., 1.)), 4.).mul(.8).add(.2);
  refl.uvNode = refl.uvNode.add(vec2(rnd.sub(.5), hash(cell.y.mul(17.3).add(cell.x.mul(5.1))).sub(.5)).mul(.0018));
  const baseCol = vec3(.002, .008, .016).mul(rnd.mul(.5).add(.75));
  m.colorNode = Fn(() => {
    const S = 10.;
    const c = p.div(S);
    const ld = abs(fract(c.sub(.5)).sub(.5)).mul(S);                 // dist to cell border (world)
    const aa = fwidth(ld).max(1e-4);
    const lineAt = (o, w) => {
      const dd = abs(ld.sub(o));
      const g = float(1).sub(smoothstep(vec2(w).sub(aa), vec2(w).add(aa), dd)).mul(clamp(vec2(w).div(aa), 0., 1.));
      return g;
    };
    // double line up close; once a pixel covers more than ~0.05 world units the pair merges into one stable line (no moiré/flicker)
    const dbl = lineAt(.16, .028);
    const sgl = lineAt(.0, .2).mul(.45);
    const merge = smoothstep(.035, .1, aa);
    const lpair = mix(dbl, sgl, merge);
    const lines = max(lpair.x, lpair.y);
    const cd = length(ld);                                           // dist to nearest intersection
    const caa = fwidth(cd).max(1e-4);
    const rw = float(.035);
    const ring = float(1).sub(smoothstep(rw.sub(caa), rw.add(caa), abs(cd.sub(.38)))).mul(clamp(rw.div(caa), 0., 1.)).mul(float(1).sub(smoothstep(.03, .09, caa)));
    const hole = max(smoothstep(.31, .36, cd), smoothstep(.03, .09, caa));                           // lines stop inside the node
    const gcol = vec3(.6, .9, 1.0);                                // near-white core
    const glowCol = vec3(.1, .5, .85);
    const lineHalo = exp(min(abs(ld.x.sub(.16)), abs(ld.y.sub(.16))).div(-.28)).mul(hole);
    const ringHalo = exp(abs(cd.sub(.38)).div(-.22));
    const halo = glowCol.mul(lineHalo.add(ringHalo.mul(.8)).mul(.32)).mul(exp(camD.mul(-.009)));
    const grid = gcol.mul(lines.mul(hole).add(ring).mul(1.1)).mul(exp(camD.mul(-.0022))).add(halo).mul(inside);
    const border = vec3(.35, .9, 1.).mul(exp(abs(box.sub(HALF)).mul(-1.1)).mul(1.4));
    const gloss = float(1.25).sub(rough.mul(2.));                       // smoother panels mirror more
    const r = refl.rgb.mul(fres.mul(.6).add(.4)).mul(.85).mul(gloss);
    let glint = vec3(0.);
    for (const h of headU) {
      const dd = length(p.sub(h.pos.xz));
      glint = glint.add(vec3(h.col).mul(exp(dd.mul(dd).mul(-.006)).mul(.07).add(exp(dd.mul(dd).mul(-.08)).mul(.3))).mul(h.pos.y).mul(gloss));
    }
    return baseCol.add(grid).add(border).add(r).add(glint);
  })();
  const floor_ = new THREE.Mesh(new THREE.PlaneGeometry(1500, 1500), m);
  floor_.rotation.x = -Math.PI / 2;
  floor_.add(refl.target);
  scene.add(floor_);
}

////////////////////////////////////////////////////////////////////////////////
// Skyline — far, low, blue-luminous silhouette band on the horizon (own haze, no white fog)
////////////////////////////////////////////////////////////////////////////////
{
  const N = 1600;
  const g = new THREE.BoxGeometry(1, 1, 1); g.translate(0, .5, 0);
  const m = new THREE.MeshBasicNodeMaterial({ fog: false });
  m.colorNode = Fn(() => {
    const wy = positionWorld.y;
    const u = uv();
    const e = min(u, float(1).sub(u)).div(fwidth(u).max(1e-5));     // pixel distance to face edge
    const edge = clamp(float(1.6).sub(min(e.x, e.y)), 0., 1.);
    const r = hash(instanceIndex.toFloat().mul(3.37).add(1.));
    const rib = clamp(float(1.2).sub(abs(fract(u.x.mul(3.).add(r)).sub(.5)).div(fwidth(u.x.mul(3.)).max(1e-5))), 0., 1.).mul(step(.6, r));
    const small = clamp(float(.02).div(fwidth(u).length().max(1e-5)), 0., 1.);   // tame edges on tiny/far faces

////////////////////////////////////////////////////////////////////////////////
// Light tapes — one continuous mitered ribbon: centre wall + white-hot cap + floor light pool
////////////////////////////////////////////////////////////////////////////////
const MAXSEG = 2400;
function tapeMaterials(rgb, intensity = 1) {
  const uCol = uniform(new THREE.Color(...rgb));
  const uLen = uniform(1e9), uFade = uniform(1), uHead = uniform(1), uSeed = uniform(Math.random() * 50);
  const common = { transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false };
  const camDist = length(positionWorld.sub(cameraPosition));
  const distFade = exp(camDist.mul(-.0035)).mul(smoothstep(1.5, 14., camDist).mul(.75).add(.25));
  const along = (d) => {
    const head = exp(d.div(-4.)).mul(uHead.mul(1.6)).add(1.);
    const tail = smoothstep(uLen, uLen.sub(35.), d);
    return head.mul(tail).mul(uFade).mul(distFade).mul(intensity);
  };
  const wall = new THREE.MeshBasicNodeMaterial(common);
  wall.colorNode = Fn(() => {
    const d = uv().x, v = uv().y;
    const c = vec3(uCol);
    const vv = clamp(v, 0., 1.);
    // clean light-ribbon gradient (film look): saturated body, hot yellow top line, thin secondary line, glowing foot
    const hot = vec3(1., .82, .45);
    const body = c.mul(pow(vv, 1.5).mul(.5).add(.1));
    const top = mix(c, hot, .45).mul(smoothstep(.9, .985, vv).mul(2.));
    const second = c.mul(smoothstep(.06, 0., abs(vv.sub(.74))).mul(.45));
    const foot = c.mul(smoothstep(.07, 0., vv).mul(.9));
    const cap = mix(c, hot, .5).mul(1.9);
    const col = mix(body.add(top).add(second).add(foot), cap, step(1.5, v));
    return col.mul(along(d));
  })();
  const pool = new THREE.MeshBasicNodeMaterial(common);
  pool.colorNode = Fn(() => {
    const d = uv().x, a = uv().y;
    return vec3(uCol).mul(exp(a.mul(a).mul(-6.)).mul(.28)).mul(along(d));
  })();
  return { wall, pool, uCol, uLen, uFade, uHead };
}

// MeshLine (makio-meshline): camera-facing thick lines with mitered joins.
// Used for the white-hot top edge and the thin floor line, so they keep their width when seen end-on from the chase cam.
const ML_N = 520;
function makeTapeLine(mats, width, gain, isEdge) {
  const init = new Float32Array(ML_N * 3);
  for (let k = 0; k < ML_N; k++) init[k * 3] = k * 1e-3;
  const ml = new MeshLine().lines(init).lineWidth(width).sizeAttenuation(true).color(0xffffff).dynamic(true)
    // keep at least ~1.5 px on screen far away, so distant tapes don't break up into dashes
    .widthFn((w) => w.mul(max(float(1.), length(cameraPosition.sub(positionGeometry)).div(55.))))
    .fragmentColorFn((color, fuv, progress) => {
      const d = float(1).sub(progress).mul(mats.uLen);                 // distance from head
      const across = abs(fuv.y.mul(2.).sub(1.));                         // 0 centre → 1 rim
      const core = pow(float(1).sub(across), isEdge ? 1.6 : 2.4);
      const c = vec3(mats.uCol);
      const hot = mix(c, vec3(1., .86, .55), isEdge ? .55 : .15);
      const head = exp(d.div(-4.)).mul(mats.uHead.mul(1.4)).add(1.);
      const tail = smoothstep(mats.uLen, mats.uLen.sub(35.), d);
      const camD = length(positionWorld.sub(cameraPosition));
      const fade = exp(camD.mul(-.0035)).mul(smoothstep(1.5, 12., camD).mul(.7).add(.3));
      const k = core.mul(head).mul(tail).mul(mats.uFade).mul(fade).mul(gain * (isEdge ? 2.2 : 1.));

}

// scratch buffers shared by all tapes (no per-frame allocations → no GC hitches)

  U[ui + 6] = ua; U[ui + 7] = va; U[ui + 8] = uc; U[ui + 9] = vc; U[ui + 10] = ue; U[ui + 11] = ve;

class Tape {

// Tape heads — white-hot leading edge, glow sprite, floor pool

  coreM.colorNode = vec3(c.r, c.g, c.b).mul(1.5).add(vec3(1.6));

  core.position.y = TAPE_H * .53;
  const sm = new THREE.SpriteNodeMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false });
  sm.colorNode = Fn(() => {
    const r = length(uv().sub(.5)).mul(2.);
    return vec3(c.r, c.g, c.b).mul(exp(r.mul(r).mul(-9.)).mul(1.3)).add(vec3(1.).mul(exp(r.mul(r).mul(-70.)).mul(1.6)));

  const pm = new THREE.MeshBasicNodeMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false });
  pm.colorNode = Fn(() => {
    const r = length(uv().sub(.5)).mul(2.);

  const pool = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), pm);

////////////////////////////////////////////////////////////////////////////////
// Sparks (derezz burst) — fixed-size InstancedMesh, never rendered at count 0
////////////////////////////////////////////////////////////////////////////////
const SPK = 1400;
const sparkMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(.13, .13, .13),
  new THREE.MeshBasicNodeMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }), SPK);
sparkMesh.frustumCulled = false;
const sparks = [];
const _m = new THREE.Matrix4(), _c = new THREE.Color(), _zero = new THREE.Matrix4().makeScale(0, 0, 0);
for (let i = 0; i < SPK; i++) { sparkMesh.setMatrixAt(i, _zero); sparkMesh.setColorAt(i, _c.setRGB(0, 0, 0)); }
scene.add(sparkMesh);
let sparkHead = 0;
function spawnSparks(x, z, p) {
  const [dx, dz] = DIRS[p.dir];
  for (let i = 0; i < 260; i++) {
    const a = Math.random() * Math.PI * 2, v = Math.pow(Math.random(), 1.5) * 9;
    sparks[sparkHead] = {
      x, y: Math.random() * TAPE_H, z,
      vx: Math.cos(a) * v + dx * p.speed * 18, vy: Math.random() * 6, vz: Math.sin(a) * v + dz * p.speed * 18,
      life: .6 + Math.random() * .9, col: COLS[p.id]
    };
    sparkHead = (sparkHead + 1) % SPK;
  }
}
function updateSparks(dt) {
  for (let i = 0; i < SPK; i++) {
    const s = sparks[i];
    if (!s) continue;
    if (s.life <= 0) { sparkMesh.setMatrixAt(i, _zero); sparks[i] = null; continue; }
    s.vy -= 14 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
    if (s.y < 0) { s.y = 0; s.vy *= -.35; s.vx *= .7; s.vz *= .7; }
    s.life -= dt;
    const k = Math.max(0, s.life);
    _m.makeScale(1 + k, 1 + k, 1 + k).setPosition(s.x, s.y, s.z);
    sparkMesh.setMatrixAt(i, _m);
    const w = Math.min(1, k * 2);
    sparkMesh.setColorAt(i, _c.setRGB((s.col[0] + w) * 3 * k, (s.col[1] + w * .8) * 3 * k, (s.col[2] + w * .6) * 3 * k));
  }
  sparkMesh.instanceMatrix.needsUpdate = true;
  sparkMesh.instanceColor.needsUpdate = true;
}

////////////////////////////////////////////////////////////////////////////////
// Sound — Web Audio synth: engine hum, drone, turn blips, crash, point chime
////////////////////////////////////////////////////////////////////////////////
const Snd = {
  ctx: null, on: false,

    this.bus = A.createGain(); this.bus.gain.value = 0;

    this.bus.connect(this.ambF); this.ambF.connect(this.master);

    // big dark hall

    for (let ch = 0; ch < 2; ch++) { const dd = ir.getChannelData(ch); for (let i = 0; i < dd.length; i++) dd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / dd.length, 2.6); }
    this.rev = A.createConvolver(); this.rev.buffer = ir;
    const revLP = A.createBiquadFilter(); revLP.type = 'lowpass'; revLP.frequency.value = 3500;
    const revG = A.createGain(); revG.gain.value = .55; this.rev.connect(revLP); revLP.connect(revG); revG.connect(this.bus);
    // dotted-eighth ping-pong-ish delay
    this.dly = A.createDelay(2); this.dly.delayTime.value = 60 / 112 * .75;
    const fb = A.createGain(); fb.gain.value = .48; const dF = A.createBiquadFilter(); dF.type = 'lowpass'; dF.frequency.value = 2200;
    this.dly.connect(dF); dF.connect(fb); fb.connect(this.dly);
    const dG = A.createGain(); dG.gain.value = .4; dF.connect(dG); dG.connect(this.mus); dG.connect(this.rev);
    // braam distortion
    this.shaper = A.createWaveShaper();
    const curve = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; curve[i] = Math.tanh(x * 3.2); }
    this.shaper.curve = curve;
    const shG = A.createGain(); shG.gain.value = .5; this.shaper.connect(shG); shG.connect(this.mus); shG.connect(this.rev);
    // low drone: D1 + A1, slowly breathing

  noiseHit(t, dur, o) {

  kick(t, gain) {

////////////////////////////////////////////////////////////////////////////////
// Game logic (ported from the original: segment collisions, AI look-ahead, scoring)
////////////////////////////////////////////////////////////////////////////////
const players = [];
let paused = false, view = 0, showMap = true, showBoard = true, tickN = 0;

function segHit(ax, az, bx, bz, cx, cz, dx, dz) {
  const rx = bx - ax, rz = bz - az, sx = dx - cx, sz = dz - cz, qx = cx - ax, qz = cz - az;
  const den = rx * sz - rz * sx;
  if (Math.abs(den) < 1e-9) {
    if (Math.abs(qx * rz - qz * rx) > 1e-6) return -1;
    const rr = rx * rx + rz * rz; if (rr < 1e-12) return -1;
    const t0 = (qx * rx + qz * rz) / rr, t1 = ((dx - ax) * rx + (dz - az) * rz) / rr;
    const lo = Math.min(t0, t1), hi = Math.max(t0, t1);
    if (hi < 0 || lo > 1) return -1;
    return Math.max(0, lo);
  }
  const t = (qx * sz - qz * sx) / den, u = (qx * rz - qz * rx) / den;
  return (t >= 0 && t <= 1 && u >= 0 && u <= 1) ? t : -1;
}

const WALL = [[HALF, HALF], [-HALF, HALF], [-HALF, -HALF], [HALF, -HALF], [HALF, HALF]];
function collide(p, ax, az, bx, bz) {
  let best = 2, owner = -2;
  for (let i = 0; i < 4; i++) {
    const t = segHit(ax, az, bx, bz, WALL[i][0], WALL[i][1], WALL[i + 1][0], WALL[i + 1][1]);
    if (t >= 0 && t < best) { best = t; owner = -1; }
  }
  for (const q of players) {
    if (!q.alive && q.deadT > .4) continue;
    const path = q.path, n = path.length;     // segments: path[i]→path[i+1], last: path[n-1]→head
    const segs = q === p ? n - 2 : n;          // skip own last two segments
    for (let i = 0; i < segs; i++) {
      const a = path[i], b = i + 1 < n ? path[i + 1] : [q.x, q.z];
      const t = segHit(ax, az, bx, bz, a[0], a[1], b[0], b[1]);
      if (t >= 0 && t < best) { best = t; owner = q.id; }
    }
  }
  return owner === -2 ? null : { t: best, owner };
}
function rayDist(p, dx, dz, D) {
  const h = collide(p, p.x, p.z, p.x + dx * D, p.z + dz * D);
  return h ? h.t * D : D;
}

function spawn(id) {
  const old = players[id];
  let x, z, dir, tries = 0;
  do {
    if (id === 0 && tries < 10) { x = (Math.random() - .5) * 120; z = -HALF * .65; dir = 0; }
    else { x = (Math.random() - .5) * HALF * 1.6; z = (Math.random() - .5) * HALF * 1.6; dir = Math.random() * 4 | 0; }
    tries++;
  } while (tries < 40 && players.length > 1 &&
    rayDist({ x, z, path: [], id: -9 }, DIRS[dir][0], DIRS[dir][1], 45) < 45);
  const p = {
    id, x, z, dir, speed: START_SP, alive: true, deadT: 0, path: [[x, z]], ai: id !== 0, aiCool: 0,
    score: old ? old.score : 0, name: NAMES[id], tape: old ? old.tape : new Tape(COLS[id]),
    head: old ? old.head : makeHead(COLS[id]), respawnAt: 0
  };
  p.tape.mats.uFade.value = 1;
  p.head.visible = true;
  players[id] = p;
  if (id === 0) { camYaw = Math.atan2(DIRS[dir][0], DIRS[dir][1]); camPos.set(x - DIRS[dir][0] * 12, 5, z - DIRS[dir][1] * 12); }
  return p;
}

function turn(p, s) {
  if (!p.alive || paused) return;
  const last = p.path[p.path.length - 1];
  if (Math.hypot(last[0] - p.x, last[1] - p.z) > 1e-6) p.path.push([p.x, p.z]);
  p.dir = (p.dir + (s > 0 ? 1 : 3)) % 4;
  p.px = p.x; p.pz = p.z;                    // snap interpolation at the corner
  if (p.id === 0) Snd.blip(s);
}

function trim(p) {
  let total = 0;
  for (let i = 0; i < p.path.length; i++) {
    const a = p.path[i], b = i + 1 < p.path.length ? p.path[i + 1] : [p.x, p.z];
    total += Math.hypot(b[0] - a[0], b[1] - a[1]);
  }
  while (total > MAX_LEN && p.path.length) {
    const a = p.path[0], b = p.path.length > 1 ? p.path[1] : [p.x, p.z];
    const L = Math.hypot(b[0] - a[0], b[1] - a[1]), ex = total - MAX_LEN;
    if (L <= ex && p.path.length > 1) { p.path.shift(); total -= L; }
    else { const k = Math.min(1, ex / Math.max(L, 1e-9)); a[0] += (b[0] - a[0]) * k; a[1] += (b[1] - a[1]) * k; total -= L * k; break; }
  }
}

let noticeT = 0;
function notice(txt, css) {
  const el = document.getElementById('notice');
  el.textContent = txt; el.style.color = css; el.style.opacity = 1; noticeT = 1.6;
}

function kill(p, x, z, owner) {
  p.alive = false; p.deadT = 0; p.x = x; p.z = z; p.speed = MIN_SP;
  spawnSparks(x, z, p);
  const me = players[0];
  Snd.crash(p.id === 0 ? 1 : Math.max(0, 1 - Math.hypot(x - me.x, z - me.z) / 120) * .7);
  if (owner >= 0 && owner !== p.id && players[owner].alive) {
    players[owner].score++;
    notice('POINT · ' + players[owner].name, CSS[owner]);
    if (owner === 0) Snd.point();
  }
  if (p.ai) p.respawnAt = 2;
}

function ai(p) {
  p.aiCool--;
  if (Math.random() < .01) p.speed = Math.min(1.9, Math.max(.4, p.speed + (Math.random() < .5 ? .25 : -.25)));
  if (p.lapse > 0) { p.lapse--; return; }                       // day-dreaming: no checks at all
  if (Math.random() < .004) { p.lapse = 10 + Math.random() * 35 | 0; return; }
  if (Math.random() < .35) return;                              // slow reactions: skips a third of its checks
  const LA = 2 + p.speed * 8;                                   // short look-ahead
  const [dx, dz] = DIRS[p.dir];
  if (rayDist(p, dx, dz, LA) < LA) {
    const L = DIRS[(p.dir + 3) % 4], R = DIRS[(p.dir + 1) % 4];
    if (Math.random() < .35) turn(p, Math.random() < .5 ? -1 : 1);          // panics, picks a side blindly
    else {
      const l = rayDist(p, L[0], L[1], 40), r = rayDist(p, R[0], R[1], 40);
      turn(p, Math.abs(l - r) < 4 ? (Math.random() < .5 ? -1 : 1) : (l > r ? -1 : 1));
    }
    p.aiCool = 8;
  } else if (p.aiCool <= 0 && Math.random() < .006) {
    const s = Math.random() < .5 ? -1 : 1, D = DIRS[(p.dir + (s > 0 ? 1 : 3)) % 4];
    if (rayDist(p, D[0], D[1], 10) >= 10) { turn(p, s); p.aiCool = 25; }
  }
}

const keys = {};
const AUTO = /auto/.test(location.hash + location.search);
function tick() {
  tickN++;
  const me = players[0];
  if (me.alive) {
    if (keys.up) me.speed = Math.min(MAX_SP, me.speed + .045);
    if (keys.down) me.speed = Math.max(MIN_SP, me.speed - .06);
  }
  for (const p of players) {
    p.px = p.x; p.pz = p.z;
    if (!p.alive) {
      p.deadT += DT;
      if (p.ai && p.deadT > p.respawnAt) spawn(p.id);
      continue;
    }
    if (p.ai || (AUTO && p.id === 0)) ai(p);
    const [dx, dz] = DIRS[p.dir];
    const nx = p.x + dx * p.speed, nz = p.z + dz * p.speed;
    const h = collide(p, p.x, p.z, nx, nz);
    if (h) kill(p, p.x + (nx - p.x) * h.t - dx * .05, p.z + (nz - p.z) * h.t - dz * .05, h.owner);
    else { p.x = nx; p.z = nz; }
    trim(p);
  }
}

////////////////////////////////////////////////////////////////////////////////
// Camera — chase / high chase / 2D top-down (heading up, like the original 2D view)
////////////////////////////////////////////////////////////////////////////////
let camYaw = 0;
const camPos = new THREE.Vector3(0, 5, -110), camLook = new THREE.Vector3(), tmpV = new THREE.Vector3();
const VIEWS = ['3D', 'Hoch', '2D'];
function updateCamera(dt, t) {
  const me = players[0];
  const target = Math.atan2(DIRS[me.dir][0], DIRS[me.dir][1]);
  let dy = target - camYaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  camYaw += dy * Math.min(1, dt * 7);
  const fx = Math.sin(camYaw), fz = Math.cos(camYaw);
  let dist, h, look, fov = 60 + me.speed * 7;
  if (!me.alive) {
    const a = camYaw + t * .25;
    tmpV.set(me.rx - Math.sin(a) * 22, 9, me.rz - Math.cos(a) * 22);
    camPos.lerp(tmpV, Math.min(1, dt * 2)); camLook.lerp(tmpV.set(me.rx, 1, me.rz), Math.min(1, dt * 4));
    camera.up.set(0, 1, 0);
  } else if (view === 2) {
    tmpV.set(me.rx + fx * 25, 210, me.rz + fz * 25);
    camPos.lerp(tmpV, Math.min(1, dt * 6)); camLook.set(camPos.x, 0, camPos.z);
    camera.up.set(fx, 0, fz); fov = 55;
  } else {
    [dist, h, look] = view === 0 ? [11 + me.speed * 2.5, 5 + me.speed * .7, 14 + me.speed * 4] : [30, 21, 18];
    const side = view === 0 ? 1.6 : 0;
    tmpV.set(me.rx - fx * dist - fz * side, h, me.rz - fz * dist + fx * side);
    camPos.lerp(tmpV, Math.min(1, dt * 9));
    camLook.set(me.rx + fx * look, view === 0 ? 1.2 : 0, me.rz + fz * look);
    camera.up.set(0, 1, 0);
  }
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  camera.fov += (fov - camera.fov) * Math.min(1, dt * 3);
  camera.updateProjectionMatrix();
}

////////////////////////////////////////////////////////////////////////////////
// HUD — 2D overview map, leaderboard, speed gauge
////////////////////////////////////////////////////////////////////////////////
const map = document.getElementById('map'), mx = map.getContext('2d');
function drawMap(t) {
  const W = map.width, s = (W - 24) / (HALF * 2);
  const X = x => W / 2 - x * s, Y = z => W / 2 - z * s;   // +Z up, -X right (matches the 3D view)
  mx.clearRect(0, 0, W, W);
  mx.strokeStyle = '#3fd8ff18'; mx.lineWidth = 1;
  for (let g = -HALF; g <= HALF; g += 25) {
    mx.beginPath(); mx.moveTo(X(g), Y(-HALF)); mx.lineTo(X(g), Y(HALF)); mx.stroke();
    mx.beginPath(); mx.moveTo(X(-HALF), Y(g)); mx.lineTo(X(HALF), Y(g)); mx.stroke();
  }
  mx.strokeStyle = '#7fe6ff'; mx.lineWidth = 2; mx.shadowColor = '#3fd8ff'; mx.shadowBlur = 8;
  mx.strokeRect(X(HALF), Y(HALF), HALF * 2 * s, HALF * 2 * s);
  for (const p of players) {
    const a = p.alive ? 1 : Math.max(0, 1 - p.deadT / .8);
    if (a <= 0) continue;
    mx.globalAlpha = a; mx.strokeStyle = CSS[p.id]; mx.shadowColor = CSS[p.id]; mx.lineWidth = 3;
    mx.beginPath();
    p.path.forEach((q, i) => i ? mx.lineTo(X(q[0]), Y(q[1])) : mx.moveTo(X(q[0]), Y(q[1])));
    mx.lineTo(X(p.x), Y(p.z)); mx.stroke();
    if (p.alive) {
      const r = 4 + Math.sin(t * 10 + p.id) * 1.5;
      mx.fillStyle = '#fff'; mx.beginPath(); mx.arc(X(p.x), Y(p.z), r, 0, 7); mx.fill();
    }
  }
  mx.globalAlpha = 1; mx.shadowBlur = 0;
}
const rowsEl = document.getElementById('rows');
let boardKey = '';
function drawBoard() {
  const sorted = [...players].sort((a, b) => b.score - a.score);
  const key = sorted.map(p => p.id + ':' + p.score + ':' + p.alive).join('|');
  if (key === boardKey) return; boardKey = key;
  rowsEl.innerHTML = '<div class="row hd"><span>#</span><span>Score</span><span>Name</span></div>' +
    sorted.map((p, i) => `<div class="row${p.alive ? '' : ' dead'}"><span>${i + 1}</span><span>${p.score}</span><span><i class="sw" style="background:${CSS[p.id]};box-shadow:0 0 6px ${CSS[p.id]}"></i>${p.name}</span></div>`).join('');
}

////////////////////////////////////////////////////////////////////////////////
// Input
////////////////////////////////////////////////////////////////////////////////
const $ = id => document.getElementById(id);
function setView(v) { view = v; document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.view === v))); }
function setPause(v) { paused = v; $('paused').hidden = !paused; $('bPause').setAttribute('aria-pressed', String(paused)); }
function setMap(v) { showMap = v; $('mapwrap').style.visibility = v ? 'visible' : 'hidden'; $('bMap').setAttribute('aria-pressed', String(v)); }
function setBoard(v) { showBoard = v; $('board').style.visibility = v ? 'visible' : 'hidden'; $('bBoard').setAttribute('aria-pressed', String(v)); }
function respawnMe() { if (!players[0].alive) spawn(0); }
let started = false;
function startGame() {
  if (started) return;
  started = true;
  document.body.classList.remove('prestart');
  $('start').inert = true;
  if (!userTouchedSnd) setSnd(true);
  acc = 0;
}
document.body.classList.add('prestart');
$('bStart').onclick = startGame;
addEventListener('keydown', e => {
  const k = e.code;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(k)) e.preventDefault();
  if (e.repeat && (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'KeyA' || k === 'KeyD')) return;
  if (k === 'ArrowLeft' || k === 'KeyA') turn(players[0], -1);
  else if (k === 'ArrowRight' || k === 'KeyD') turn(players[0], 1);
  else if (k === 'ArrowUp' || k === 'KeyW') keys.up = true;
  else if (k === 'ArrowDown' || k === 'KeyS') keys.down = true;
  else if (k === 'Space' || k === 'Enter') { if (!started) startGame(); else respawnMe(); }
  else if (k === 'KeyP') setPause(!paused);
  else if (k === 'KeyV') setView((view + 1) % 3);
  else if (k === 'KeyO') setMap(!showMap);
  else if (k === 'KeyL') setBoard(!showBoard);
  else if (k === 'KeyM') { userTouchedSnd = true; setSnd(!Snd.on); }
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
  if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
});
let touch0 = null;
canvas.addEventListener('pointerdown', e => { touch0 = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', e => {
  if (!touch0) return;
  const dx = e.clientX - touch0.x, dy = e.clientY - touch0.y; touch0 = null;
  if (!started) return;
  if (!players[0].alive) { respawnMe(); return; }
  if (Math.abs(dy) > 40 && Math.abs(dy) > Math.abs(dx)) {
    const p = players[0]; p.speed = Math.min(MAX_SP, Math.max(MIN_SP, p.speed + (dy < 0 ? .7 : -.7)));
  } else turn(players[0], e.clientX < innerWidth / 2 ? -1 : 1);
});
function setSnd(on) { Snd.setOn(on); $('snd').textContent = on ? 'Sound on' : 'Sound off'; $('snd').setAttribute('aria-pressed', String(on)); }
$('snd').onclick = (e) => { e.stopPropagation(); userTouchedSnd = true; setSnd(!Snd.on); };
let userTouchedSnd = false;
const autoSound = () => { if (started && !userTouchedSnd && !Snd.ctx) setSnd(true); };   // fallback: first key after start
addEventListener('keydown', autoSound, { capture: true });
addEventListener('pointerdown', (e) => { if (e.target.id !== 'snd') autoSound(); }, { capture: true });
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(+b.dataset.view));
$('bPause').onclick = () => setPause(!paused);
$('bMap').onclick = () => setMap(!showMap);
$('bBoard').onclick = () => setBoard(!showBoard);
// size follows the canvas' real CSS box every frame (the panel can collapse to 0 without a resize event)
let viewW = 0, viewH = 0;
function syncSize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (w < 2 || h < 2) return false;                      // hidden / collapsed → never create 0-size swapchain or targets
  if (w !== viewW || h !== viewH) {
    viewW = w; viewH = h;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  return true;
}

////////////////////////////////////////////////////////////////////////////////
// Post — bloom + vignette
////////////////////////////////////////////////////////////////////////////////
const pipeline = new THREE.RenderPipeline(renderer);
const scenePass = pass(scene, camera, { samples: 2 });
const sc = scenePass.getTextureNode('output');
const vig = float(1).sub(pow(length(screenUV.sub(.5)).mul(1.25), 2.6)).clamp(0, 1);
const bloomPass = bloom(sc, .8, .45, .22);
bloomPass.setResolutionScale(.35);
pipeline.outputNode = sc.add(bloomPass).mul(vig);

////////////////////////////////////////////////////////////////////////////////
// Boot + main loop (loop starts only after renderer init)
////////////////////////////////////////////////////////////////////////////////
for (let i = 0; i < 4; i++) spawn(i);   // you + 3 AI
let acc = 0, last = performance.now() / 1000, T = 0, qAcc = 0, qN = 0, mapT = -1;
const deadEl = $('dead'), spdEl = $('spd');

function frame() {
  const now = performance.now() / 1000;
  const dt = Math.min(.1, now - last); last = now;
  // adaptive resolution: average frame time over ~1.5 s, step render scale down/up
  qAcc += dt; qN++;
  if (qAcc > 1.5) {
    const ms = qAcc / qN * 1000; qAcc = 0; qN = 0;
    const nq = ms > 21 ? Math.max(.6, quality - .1) : quality;
    if (Math.abs(nq - quality) > .01) { quality = nq; renderer.setPixelRatio(quality); console.log('render scale', quality.toFixed(2), ms.toFixed(1) + 'ms'); }
  }
  if (!paused && started) {
    acc += dt; T += dt;
    let steps = 0;
    while (acc >= DT && steps < 6) { tick(); acc -= DT; steps++; }
    updateSparks(dt);
  }
  const alpha = paused ? 1 : Math.min(1, acc / DT);      // render-time interpolation between 60 Hz ticks (no judder on 120/144 Hz)
  for (const p of players) {
    const px = p.px ?? p.x, pz = p.pz ?? p.z;
    p.rx = px + (p.x - px) * alpha; p.rz = pz + (p.z - pz) * alpha;
    const fade = p.alive ? 1 : Math.max(0, 1 - p.deadT / .8);
    p.tape.mats.uFade.value = fade;
    p.tape.setVisible(fade > 0);
    if (fade > 0) p.tape.update(p.path, TAPE_H * (p.alive ? 1 : .3 + .7 * fade), 0, p.rx, p.rz);
    const hu = headU[p.id];
    if (hu) { hu.pos.value.set(p.rx, p.alive ? 1 : 0, p.rz); hu.col.value.setRGB(...COLS[p.id]); }
    p.head.visible = p.alive;
    if (p.alive) { p.head.position.set(p.rx, 0, p.rz); p.head.rotation.y = Math.atan2(DIRS[p.dir][0], DIRS[p.dir][1]); }
  }
  updateCamera(dt, T);
  const me = players[0];
  Snd.speed(me.speed, me.alive && !paused);
  deadEl.hidden = me.alive || !started;
  spdEl.style.height = (me.speed / MAX_SP * 100).toFixed(1) + '%';
  if (showMap && T - mapT > .04) { mapT = T; drawMap(T); }
  if (showBoard) drawBoard();
  if (noticeT > 0) { noticeT -= dt; if (noticeT <= 0) $('notice').style.opacity = 0; }
  if (syncSize()) { bakeSky(T); pipeline.render(); }
}

renderer.init().then(() => {
  console.log('backend:', renderer.backend.isWebGPUBackend ? 'WebGPU' : 'WebGL2');
  renderer.setAnimationLoop(frame);
  setTimeout(() => $('loading').classList.add('off'), 400);
}).catch(err => {
  const el = $('err'); el.hidden = false;
  el.textContent = 'Grafik konnte nicht starten: ' + err.message;
});
</script>

</body>
</html>
