<script type="module">
////////////////////////////////////////////////////////////////////////////////
//// Codevember 2026 · Day21 Bolt (Clockwork)
////
//// An endless 3D truchet lattice of spinning hex nuts, eaten by rust.
//// Raymarched in a single fullscreen TSL pass (three.js WebGPU), rust
//// texture and pitting live in each nut's own spinning frame, soft shadows,
//// AO, crisp by default (the original's mip-blur mist with ?mist). Generative sound.
////
//// Lattice layout (cells, point-mirroring, gear placement and spin ratios)
//// ported from "giant clockwork" by florian berger (flockaroo), 2019,
//// licensed CC BY-NC-SA 3.0 — gears replaced by threaded, chamfered nuts.
////
//// This shader may only be shown in this form on shadertoy.com / here.
//// No use in commercial or non-commercial products or websites.
//// Not for sale. Not to be minted as an NFT.
////
//// Related examples:
//// - flockaroo (original "giant clockwork"): https://www.shadertoy.com/user/flockaroo
//// - iq, distance functions (hex prism):     https://iquilezles.org/articles/distfunctions/
//// - iq, soft shadows:                        https://iquilezles.org/articles/rmshadows/
////////////////////////////////////////////////////////////////////////////////

import * as THREE from 'three/webgpu';
import {
  Fn, uniform, float, vec2, vec3, vec4, Loop, If, Break,
  dot, cross, normalize, mix, smoothstep, max, min, abs, fract, floor, length, pow, exp, sign, clamp,
  sin, cos, atan, sqrt, mod, screenUV, convertToTexture, texture, pass, select, step,
  positionWorld, positionLocal, normalWorld, frontFacing, instanceIndex
} from 'three/tsl';

const BUILD = 'v0.3.1';
console.log('%cBolt ' + BUILD, 'color:#e0a070');
const QS = new URLSearchParams(location.search);
const errBox = document.getElementById('err');
const fail = (e) => { errBox.textContent = String(e && e.message || e); console.error(e); };
window.addEventListener('error', (e) => fail(e.error || e.message));

////////////////////////////////////////////////////////////////
//// PARAMS
////////////////////////////////////////////////////////////////

const PI2 = Math.PI * 2;
const R0 = 0.205;          // pitch radius of the big wheels (from the original)
const NUT_H = 0.40;        // half thickness, in pitch radii (original gear: .27)
const NUT_RI = 0.82;       // inradius: sized so neighbours just kiss while turning
const HOLE = 0.43;         // thread minor radius
const LOWQ = QS.has('low') || /Android|iPhone|iPad/i.test(navigator.userAgent);
const STEPS = LOWQ ? 72 : 110;

const uTime = uniform(0);
const uRes = uniform(new THREE.Vector2(1, 1));
const uCam = uniform(new THREE.Vector3());
const uFwd = uniform(new THREE.Vector3(0, 1, 0));
const uLeft = uniform(new THREE.Vector3(-1, 0, 0));
const uUp = uniform(new THREE.Vector3(0, 0, 1));
const LDIR = new THREE.Vector3(0.2, 0.5, 1).normalize();   // world is z-up, like the original
const uL = uniform(LDIR);

////////////////////////////////////////////////////////////////
//// NOISE
////////////////////////////////////////////////////////////////

const hash13 = Fn(([q]) => {
  const p3 = fract(q.mul(0.1031)).toVar();
  p3.addAssign(dot(p3, p3.zyx.add(31.32)));
  return fract(p3.x.add(p3.y).mul(p3.z));
}).setLayout({ name: 'h13', type: 'float', inputs: [{ name: 'q', type: 'vec3' }] });

const vn = Fn(([x]) => {
  const i = floor(x);
  const f = fract(x);
  const u = f.mul(f).mul(f.mul(-2.0).add(3.0));
  const a = hash13(i);
  const b = hash13(i.add(vec3(1, 0, 0)));
  const c = hash13(i.add(vec3(0, 1, 0)));
  const d = hash13(i.add(vec3(1, 1, 0)));
  const e = hash13(i.add(vec3(0, 0, 1)));
  const g = hash13(i.add(vec3(1, 0, 1)));
  const h = hash13(i.add(vec3(0, 1, 1)));
  const k = hash13(i.add(vec3(1, 1, 1)));
  const z0 = mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
  const z1 = mix(mix(e, g, u.x), mix(h, k, u.x), u.y);
  return mix(z0, z1, u.z).mul(2.0).sub(1.0);
}).setLayout({ name: 'vn', type: 'float', inputs: [{ name: 'x', type: 'vec3' }] });

const fbm4 = Fn(([p]) => {
  const v = vn(p).mul(0.5).toVar();
  v.addAssign(vn(p.mul(2.03).add(vec3(1.7, 9.2, 3.1))).mul(0.25));
  v.addAssign(vn(p.mul(4.01).add(vec3(8.3, 2.8, 6.4))).mul(0.125));
  v.addAssign(vn(p.mul(8.05).add(vec3(4.1, 7.7, 1.9))).mul(0.0625));
  return v;
}).setLayout({ name: 'fbm4', type: 'float', inputs: [{ name: 'p', type: 'vec3' }] });

const fbm3 = Fn(([p]) => {
  const v = vn(p).mul(0.55).toVar();
  v.addAssign(vn(p.mul(2.11).add(vec3(5.3, 1.2, 8.8))).mul(0.3));
  v.addAssign(vn(p.mul(4.37).add(vec3(2.6, 6.1, 3.3))).mul(0.15));
  return v;
}).setLayout({ name: 'fbm3', type: 'float', inputs: [{ name: 'p', type: 'vec3' }] });

////////////////////////////////////////////////////////////////
//// NUT
////////////////////////////////////////////////////////////////

// hex nut, pitch radius 1: iq hex prism, 30° chamfer cone on both faces,
// countersunk hole with a single-start thread. w scales the thickness.
const sdNut = Fn(([q, w]) => {
  const h = float(NUT_H).mul(w).sub(0.02);
  const ri = float(NUT_RI - 0.02);
  const k = vec3(-0.8660254, 0.5, 0.57735);
  const pa = abs(q);
  const pxy = pa.xy.sub(k.xy.mul(min(dot(k.xy, pa.xy), 0.0).mul(2.0)));
  const dx = length(pxy.sub(vec2(clamp(pxy.x, k.z.mul(ri).negate(), k.z.mul(ri)), ri))).mul(sign(pxy.y.sub(ri)));
  const dz = pa.z.sub(h);
  const dHex = min(max(dx, dz), 0.0).add(length(max(vec2(dx, dz), 0.0)));
  const rho = length(q.xy);
  const dCh = rho.sub(ri.mul(0.985)).mul(0.5).add(pa.z.sub(h).mul(0.866));
  const d = max(dHex, dCh).sub(0.02).toVar();
  // thread: radius rides a triangle wave along a helix
  const th = fract(atan(q.y, q.x).div(PI2).add(q.z.mul(7.0)));
  const tri = abs(th.sub(0.5)).mul(2.0);
  const rh = float(HOLE).add(tri.mul(0.055));
  d.assign(max(d, rh.sub(rho).mul(0.8)));
  // countersink at the hole mouth
  d.assign(max(d, float(HOLE + 0.11).add(pa.z).sub(h).sub(rho).mul(0.707)));
  return d;
}).setLayout({ name: 'sdNut', type: 'float', inputs: [{ name: 'q', type: 'vec3' }, { name: 'w', type: 'float' }] });

////////////////////////////////////////////////////////////////
//// LATTICE (after flockaroo's truchetDist / allGears)
////////////////////////////////////////////////////////////////

// three wheels on a quarter arc, on three perpendicular planes per cell
const WHEELS = [0, 1, 2].map((i) => {
  const ang = PI2 / 4 * i / 2;
  const c2 = -Math.cos(ang * 4) * 0.5 + 0.5;
  // all nuts the same size and speed (hexes can only stay in contact at 1:1),
  // the middle one turned 30° so a corner always faces a flat
  const r = R0;
  return { i, ang, c2, r, w: 1, spin: (i % 2) * 2 - 1, phase: (i % 2) * PI2 / 12, cx: Math.cos(ang) * 0.5, cy: Math.sin(ang) * 0.5 };
});
const PERM = [(p) => p, (p) => vec3(p.z, p.x.negate(), p.y), (p) => vec3(p.y.negate(), p.z.negate(), p.x)];
const IPERM = [(p) => p, (p) => vec3(p.y.negate(), p.z, p.x), (p) => vec3(p.z, p.x.negate(), p.y.negate())];

// mode 0: distance only · mode 1: vec4(d, local q) · mode 2: vec4(local q, nut id)
const buildLattice = (pos, mode) => {
  const mp = floor(mod(pos, 2.0)).mul(2.0).sub(1.0);
  const s = mp.y.mul(mp.z);                       // fact*mp.x = mp.y*mp.z
  const st = mp.x.mul(0.5).add(0.5);              // sin(tilt): tilt is 0 or 90°
  const ct = st.oneMinus();
  const p0 = pos.mul(s);
  const best = float(1e3).toVar();
  const out = vec4(0).toVar();
  for (const W of WHEELS) {
    const sh = float(W.c2 * 0.05).mul(ct.mul(ct).mul(0.5).add(0.5));
    const pc = vec3(float(W.cx).sub(sh.mul(Math.cos(W.ang))), float(W.cy).sub(sh.mul(Math.sin(W.ang))), st.mul(st).mul(W.c2 * 0.02));
    const ga = uTime.mul(W.spin).add(W.phase);
    const cg = cos(ga), sg = sin(ga);
    const ca = Math.cos(-W.ang), sa = Math.sin(-W.ang);
    for (let k = 0; k < 3; k++) {
      const pp = PERM[k](p0);
      const q0 = fract(pp).sub(vec3(0, 0, 0.5)).sub(pc);
      // Rz(-ang)
      const q1 = vec3(q0.x.mul(ca).sub(q0.y.mul(sa)), q0.x.mul(sa).add(q0.y.mul(ca)), q0.z);
      // Ry(tilt)
      const q2 = vec3(q1.x.mul(ct).add(q1.z.mul(st)), q1.y, q1.z.mul(ct).sub(q1.x.mul(st)));
      // Rz(spin)
      const q = vec3(q2.x.mul(cg).sub(q2.y.mul(sg)), q2.x.mul(sg).add(q2.y.mul(cg)), q2.z).div(W.r);
      const d = sdNut(q, float(W.w)).mul(W.r);
      if (mode === 0) { best.assign(min(best, d)); continue; }
      If(d.lessThan(best), () => {
        best.assign(d);
        if (mode === 1) out.assign(vec4(d, q));
        else {
          const cw = IPERM[k](floor(pp).add(pc).add(vec3(0, 0, 0.5))).mul(s);
          out.assign(vec4(q, hash13(floor(cw.mul(16.0).add(0.5)).add(vec3(3.1, 7.7, 1.3)))));
        }
      });
    }
  }
  return mode === 0 ? best : out;
};

const map = Fn(([p]) => buildLattice(p, 0)).setLayout({ name: 'map', type: 'float', inputs: [{ name: 'p', type: 'vec3' }] });
const mapDQ = Fn(([p]) => buildLattice(p, 1)).setLayout({ name: 'mapDQ', type: 'vec4', inputs: [{ name: 'p', type: 'vec3' }] });
const mapID = Fn(([p]) => buildLattice(p, 2)).setLayout({ name: 'mapID', type: 'vec4', inputs: [{ name: 'p', type: 'vec3' }] });

////////////////////////////////////////////////////////////////
//// RUST
////////////////////////////////////////////////////////////////

// texture space: the two halves of a nut that straddles a cell face see it
// point- or z-mirrored, so fold z and square the xy angle (2-fold symmetric)
const rustUV = Fn(([q, id]) => {
  // z² is conformal, so the noise stays isotropic (scale grows a bit outward)
  const uv2 = vec2(q.x.mul(q.x).sub(q.y.mul(q.y)), q.x.mul(q.y).mul(2.0)).mul(1.3);
  return vec3(uv2, abs(q.z)).add(vec3(id.mul(37.0), id.mul(91.0), id.mul(13.0)));
}).setLayout({ name: 'rustUV', type: 'vec3', inputs: [{ name: 'q', type: 'vec3' }, { name: 'id', type: 'float' }] });

// height of the crust: lumps, pits and raised scale plates
const rustH = Fn(([t]) => {
  const lump = fbm4(t.mul(2.6));
  // blisters: rounded bubbles of crust
  const bl = vn(t.mul(7.0).add(3.0)).abs().oneMinus();
  const blister = bl.mul(bl).mul(bl).mul(smoothstep(-0.1, 0.4, vn(t.mul(1.7))));
  // pits eaten into the metal
  const pit = smoothstep(0.7, 0.92, vn(t.mul(11.0)).mul(0.5).add(0.5));
  // scale plates with a sharp, lifted edge
  const pn = fbm3(t.mul(2.4).add(11.0));
  const plate = smoothstep(0.08, 0.105, pn).add(smoothstep(0.10, 0.08, pn.sub(0.03)).mul(smoothstep(0.06, 0.08, pn)).mul(0.6));
  const grain = vn(t.mul(26.0)).mul(0.18);
  return lump.mul(1.0).add(blister.mul(0.7)).sub(pit.mul(0.9)).add(plate.mul(0.55)).add(grain);
}).setLayout({ name: 'rustH', type: 'float', inputs: [{ name: 't', type: 'vec3' }] });

////////////////////////////////////////////////////////////////
//// SCENE
////////////////////////////////////////////////////////////////

const FOG_A = vec3(0.50, 0.46, 0.43);   // haze away from the sun
const FOG_B = vec3(1.10, 0.95, 0.76);   // haze toward the sun

const sky = Fn(([rd]) => {
  const sd = dot(rd, uL);
  const c = mix(FOG_A, FOG_B, smoothstep(-0.4, 1.0, sd)).toVar();
  c.mulAssign(rd.z.mul(0.12).add(0.95));
  return c;
}).setLayout({ name: 'sky', type: 'vec3', inputs: [{ name: 'rd', type: 'vec3' }] });

const softShadow = Fn(([ro, rd]) => {
  const res = float(1).toVar();
  const t = float(0.012).toVar();
  Loop(LOWQ ? 14 : 22, () => {
    const h = map(ro.add(rd.mul(t)));
    res.assign(min(res, h.mul(10.0).div(t)));
    t.addAssign(clamp(h, 0.01, 0.12));
    If(res.lessThan(0.02).or(t.greaterThan(1.6)), () => { Break(); });
  });
  return clamp(res, 0.0, 1.0);
}).setLayout({ name: 'shadow', type: 'float', inputs: [{ name: 'ro', type: 'vec3' }, { name: 'rd', type: 'vec3' }] });

const rayDir = () => {
  const asp = uRes.y.div(uRes.x);
  const sc = vec2(screenUV.x.sub(0.5), screenUV.y.oneMinus().sub(0.5).mul(asp));
  return normalize(uFwd.add(uLeft.mul(sc.x.mul(2.0))).add(uUp.mul(sc.y.mul(2.0))));
};

const render = Fn(() => {
  const rd = rayDir().toVar();
  const ro = uCam;
  const t = float(0).toVar();
  const hit = float(0).toVar();
  Loop(STEPS, () => {
    const d = map(ro.add(rd.mul(t)));
    If(d.lessThan(t.mul(0.0007).add(0.0012)), () => { hit.assign(1); Break(); });
    t.addAssign(d.mul(0.72));
    If(t.greaterThan(22.0), () => { Break(); });
  });
  const bg = sky(rd);
  const col = vec3(bg).toVar();
  If(hit.greaterThan(0.5), () => {
    const p = ro.add(rd.mul(t)).toVar();
    // geometric normal
    const e = float(0.0009).add(t.mul(0.0004));
    const k0 = vec3(1, -1, -1), k1 = vec3(-1, -1, 1), k2 = vec3(-1, 1, -1), k3 = vec3(1, 1, 1);
    const id4 = mapID(p);
    const nid = id4.w;
    // bump: crust height in the nut's own spinning frame, folded into the gradient
    const bAmp = float(0.0065).div(t.mul(0.35).add(1.0));
    const F = (o) => { const dq = mapDQ(p.add(o.mul(e))); return dq.x.sub(rustH(rustUV(dq.yzw, nid)).mul(bAmp)); };
    const n = normalize(k0.mul(F(k0)).add(k1.mul(F(k1))).add(k2.mul(F(k2))).add(k3.mul(F(k3)))).toVar();
    const tq = rustUV(id4.xyz, nid);
    const hgt = rustH(tq);
    const cav = smoothstep(-0.9, 0.5, hgt);   // low = dark wet rust, high = dry crust
    // ---- albedo
    const tone = fbm4(tq.mul(3.2)).mul(0.5).add(0.5);
    const deep = vec3(0.20, 0.085, 0.04), mid = vec3(0.52, 0.22, 0.075), hot = vec3(0.80, 0.40, 0.12);
    const rust = mix(deep, mid, smoothstep(0.25, 0.6, tone)).toVar();
    rust.assign(mix(rust, hot, smoothstep(0.55, 0.85, tone.add(vn(tq.mul(22.0)).mul(0.18)))));
    rust.mulAssign(vn(tq.mul(24.0)).mul(0.15).add(0.93));
    rust.mulAssign(cav.mul(0.5).add(0.62));
    const plateN = fbm3(tq.mul(2.4).add(11.0));
    const plate = smoothstep(0.08, 0.16, plateN).mul(smoothstep(-0.2, 0.3, fbm3(tq.mul(1.1).add(4.0)))).toVar();
    plate.mulAssign(hash13(vec3(nid.mul(97.0), 1, 2)).mul(0.7).add(0.45));
    const pale = mix(vec3(0.58, 0.54, 0.48), vec3(0.80, 0.76, 0.70), vn(tq.mul(9.0)).mul(0.5).add(0.5));
    const stain = smoothstep(0.0, 0.5, vn(tq.mul(6.0).add(2.0)));
    const scale = mix(pale, mid.mul(1.3), stain.mul(0.45));
    const alb = mix(rust, scale, clamp(plate, 0.0, 1.0)).toVar();
    // a few nuts are younger: darker, less orange, more bare steel
    const young = smoothstep(0.82, 0.95, hash13(vec3(nid.mul(53.0), 5, 9)));
    alb.assign(mix(alb, mix(vec3(0.10, 0.09, 0.085), alb, 0.45), young.mul(0.7)));
    // threads and hole carry darker, wetter rust
    const rho = length(id4.xy);
    const inHole = smoothstep(HOLE + 0.14, HOLE + 0.04, rho);
    alb.mulAssign(mix(1.0, 0.55, inHole));
    // rubbed band on the flats, where the neighbours keep knocking the crust off
    const zq = abs(id4.z);
    const scrape = smoothstep(NUT_RI - 0.03, NUT_RI + 0.02, rho).mul(smoothstep(NUT_H * 0.85, NUT_H * 0.25, zq))
      .mul(smoothstep(-0.15, 0.45, vn(vec3(id4.z.mul(38.0), nid.mul(31.0), rho.mul(3.0))).add(fbm3(tq.mul(3.0)).mul(0.6)))).toVar();
    const steel = mix(vec3(0.20, 0.19, 0.185), vec3(0.42, 0.40, 0.38), vn(vec3(id4.z.mul(90.0), nid, 1)).mul(0.5).add(0.5));
    alb.assign(mix(alb, mix(steel, alb.mul(0.8), 0.25), scrape));
    const rough = mix(0.88, 0.62, plate).sub(young.mul(0.25)).sub(scrape.mul(0.42));
    // ---- light
    const ao = float(1).toVar();
    ao.assign(min(ao, map(p.add(n.mul(0.08))).div(0.08)));
    ao.assign(min(ao, map(p.add(n.mul(0.04))).div(0.04)));

    const H = normalize(L.add(V));

    const a2 = rough.mul(rough).mul(rough).mul(rough);

  const hId = hash13(vec3(float(instanceIndex), 4.1, 7.3));

  const ln = vn(positionLocal.mul(5.0).add(vec3(hId.mul(40.0), hB.mul(40.0), 0)));

const snd = (() => {

    const b = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);

  const init = () => {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    NB = noiseBuf();

    // big hall: a long noise-burst convolution

    // low machine drone: two detuned saws through a slowly moving lowpass
    const dr = ctx.createGain(); dr.gain.value = 0.05;

    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07; const lg = ctx.createGain(); lg.gain.value = 70; lfo.connect(lg).connect(lp.frequency); lfo.start();
    lp.connect(dr); dr.connect(out); dr.connect(wet);

  };

  const tick = (t, hi) => {
    const s = noise(0.02);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = hi ? 3400 : 2100; bp.Q.value = 9;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    const pn = ctx.createStereoPanner(); pn.pan.value = hi ? 0.35 : -0.35;
    s.connect(bp).connect(g).connect(pn); pn.connect(out); pn.connect(wet);
    [hi ? 1870 : 1320, hi ? 4630 : 3310].forEach((f, i) => {
      const o = ctx.createOscillator(); o.frequency.value = f;
      const og = ctx.createGain(); og.gain.setValueAtTime(i ? 0.02 : 0.035, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);

    });
  };
  // rusty groan: a slow stick-slip — a filtered pulse train whose rate wanders
  const groan = (t) => {
    const dur = 1.6 + Math.random() * 1.8;
    const o = ctx.createOscillator(); o.type = 'sawtooth';
    const f0 = 38 + Math.random() * 30;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.linearRampToValueAtTime(f0 * (0.7 + Math.random() * 0.8), t + dur * 0.5);
    o.frequency.linearRampToValueAtTime(f0 * (0.6 + Math.random() * 0.9), t + dur);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 6;
    bp.frequency.setValueAtTime(600 + Math.random() * 500, t); bp.frequency.linearRampToValueAtTime(900 + Math.random() * 900, t + dur);
    const g = ctx.createGain();

    const n = 4 + (Math.random() * 6 | 0);

      const s = noise(0.01);
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800 + Math.random() * 5000; bp.Q.value = 2.5;
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05 + Math.random() * 0.07, t + 0.001); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.012);

    chips(T) {

})();

const permF = [(p) => p, (p) => [p[2], -p[0], p[1]], (p) => [-p[1], -p[2], p[0]]];
const ipermF = [(p) => p, (p) => [-p[1], p[2], p[0]], (p) => [p[2], -p[0], -p[1]]];
const cellCache = new Map();
// world position and surface velocity of every touching pair in one cell
const cellContacts = (cx, cy, cz) => {
  const key = cx + ',' + cy + ',' + cz;
  if (cellCache.has(key)) return cellCache.get(key);
  const pos = [cx + 0.5, cy + 0.5, cz + 0.5];
  const mp = pos.map((v) => Math.floor(((v % 2) + 2) % 2) * 2 - 1);
  const s = mp[1] * mp[2], st = mp[0] * 0.5 + 0.5, ct = 1 - st;
  const p0 = pos.map((v) => v * s);
  const out = [];
  for (let k = 0; k < 3; k++) {
    const fl = permF[k](p0).map(Math.floor);
    const C = WHEELS.map((W) => {
      const sh = W.c2 * 0.05 * (ct * ct * 0.5 + 0.5);
      const pc = [W.cx - sh * Math.cos(W.ang), W.cy - sh * Math.sin(W.ang), st * st * W.c2 * 0.02];
      const cw = ipermF[k]([fl[0] + pc[0], fl[1] + pc[1], fl[2] + pc[2] + 0.5]).map((v) => v * s);
      const c = Math.cos(-W.ang), sn = Math.sin(-W.ang);
      const M = (v) => {
        let a = permF[k](v.map((x) => x * s));
        a = [a[0] * c - a[1] * sn, a[0] * sn + a[1] * c, a[2]];
        return [a[0] * ct + a[2] * st, a[1], a[2] * ct - a[0] * st];
      };
      const cols = [M([1, 0, 0]), M([0, 1, 0]), M([0, 0, 1])];
      return { cw, M, cols, spin: W.spin };
    });
    for (const [a, b] of [[0, 1], [1, 2]]) {
      const A = C[a], B = C[b];
      const mid = [0, 1, 2].map((j) => (A.cw[j] + B.cw[j]) * 0.5);
      const q2 = A.M(mid.map((v, j) => v - A.cw[j]));
      const vq = [A.spin * q2[1], -A.spin * q2[0], 0];
      const vw = A.cols.map((col) => col[0] * vq[0] + col[1] * vq[1] + col[2] * vq[2]);
      const ax = [A.cols[0][2], A.cols[1][2], A.cols[2][2]];
      out.push({ p: mid, v: vw, a: ax });
    }
  }
  if (cellCache.size > 4000) cellCache.clear();
  cellCache.set(key, out);
  return out;
};

let contacts = [], contactAge = 99;
const gatherContacts = () => {
  const c = uCam.value, f = uFwd.value, R = 2;
  const list = [];
  const bx = Math.floor(c.x), by = Math.floor(c.y), bz = Math.floor(c.z);
  for (let x = -R; x <= R; x++) for (let y = -R; y <= R; y++) for (let z = -R; z <= R; z++) {
    for (const ct of cellContacts(bx + x, by + y, bz + z)) {
      const dx = ct.p[0] - c.x, dy = ct.p[1] - c.y, dz = ct.p[2] - c.z;
      const d = Math.hypot(dx, dy, dz);
      if (d < 0.3 || d > 2.4) continue;
      if ((dx * f.x + dy * f.y + dz * f.z) / d < 0.35) continue;
      list.push(ct);
    }
  }
  contacts = list;
};

// the same nuts on the CPU (no thread), so chips can land, bounce and slide off
const nutJS = (x, y, z, h) => {
  const ri = NUT_RI;
  let px = Math.abs(x), py = Math.abs(y); const pz = Math.abs(z);
  const t = 2 * Math.min(-0.8660254 * px + 0.5 * py, 0); px -= t * -0.8660254; py -= t * 0.5;

  d = Math.max(d, (rho - ri * 0.985) * 0.5 + dz * 0.866);
  return Math.max(d, HOLE + 0.03 - rho);
};
const latticeJS = (X, Y, Z, T) => {
  const pos = [X, Y, Z];
  const mp = pos.map((v) => Math.floor(((v % 2) + 2) % 2) * 2 - 1);
  const s = mp[1] * mp[2], st = mp[0] * 0.5 + 0.5, ct = 1 - st;
  const p0 = [X * s, Y * s, Z * s];
  let best = 1e3;
  for (const W of WHEELS) {
    const sh = W.c2 * 0.05 * (ct * ct * 0.5 + 0.5);
    const pcx = W.cx - sh * Math.cos(W.ang), pcy = W.cy - sh * Math.sin(W.ang), pcz = st * st * W.c2 * 0.02;
    const ga = T * W.spin + W.phase, cg = Math.cos(ga), sg = Math.sin(ga);
    const ca = Math.cos(-W.ang), sa = Math.sin(-W.ang);
    for (let k = 0; k < 3; k++) {
      const pp = permF[k](p0);
      const q0x = pp[0] - Math.floor(pp[0]) - pcx, q0y = pp[1] - Math.floor(pp[1]) - pcy, q0z = pp[2] - Math.floor(pp[2]) - 0.5 - pcz;
      const q1x = q0x * ca - q0y * sa, q1y = q0x * sa + q0y * ca;
      const q2x = q1x * ct + q0z * st, q2z = q0z * ct - q1x * st;
      const qx = (q2x * cg - q1y * sg) / W.r, qy = (q2x * sg + q1y * cg) / W.r, qz = q2z / W.r;
      if (qx * qx + qy * qy + qz * qz > 2.2) continue;
      best = Math.min(best, nutJS(qx, qy, qz, NUT_H) * W.r);
    }
  }
  return best;
};

  // chips break off at the rim of either face, right where the two nuts meet
  const side = (Math.random() < 0.5 ? -1 : 1) * (NUT_H * R0 + 0.006);
  for (let j = 0; j < 3; j++) {
    FL.pos[i * 3 + j] = ct.p[j] + ct.a[j] * side + r() * 0.01;
    FL.vel[i * 3 + j] = ct.v[j] * k + r() * 0.05;
  }
  FL.life[i] = 3.5 + Math.random() * 3;
  const u = Math.random();
  FL.size[i] = 0.015 + u * u * u * 0.065;
  FL.q[i].setFromEuler(new THREE.Euler(Math.random() * 6.3, Math.random() * 6.3, Math.random() * 6.3));
  FL.w[i].set(r(), r(), r()).multiplyScalar(6 + Math.random() * 10);
};
const updateFlakes = (dt, T) => {
  contactAge += dt;
  if (contactAge > 0.25) { contactAge = 0; gatherContacts(); }
  // chips come loose in bursts each time a corner rolls over a flat (6x per turn)
  const burst = 0.45 + 0.55 * Math.pow(Math.abs(Math.sin(T * 3)), 4);
  FL.acc += dt * RATE * burst;
  while (FL.acc >= 1) { FL.acc -= 1; if (contacts.length) spawn(contacts[(Math.random() * contacts.length) | 0]); }
  const drag = Math.exp(-dt * 1.4);
  for (let i = 0; i < NF; i++) {
    if (FL.life[i] <= 0) continue;
    FL.life[i] -= dt;
    if (FL.life[i] <= 0) { flakes.setMatrixAt(i, ZERO); continue; }
    const o = i * 3;
    // gravity, air drag and a little side-to-side flutter like a falling leaf
    FL.vel[o + 2] -= 0.42 * dt;
    FL.vel[o] = FL.vel[o] * drag + Math.sin(T * 5.3 + i) * 0.09 * dt;
    FL.vel[o + 1] = FL.vel[o + 1] * drag + Math.cos(T * 4.1 + i * 1.7) * 0.09 * dt;
    FL.vel[o + 2] *= drag;
    FL.pos[o] += FL.vel[o] * dt; FL.pos[o + 1] += FL.vel[o + 1] * dt; FL.pos[o + 2] += FL.vel[o + 2] * dt;
    // land on a nut: push out along the gradient, lose most of the speed
    const rad = FL.size[i] * 0.35;
    const d = latticeJS(FL.pos[o], FL.pos[o + 1], FL.pos[o + 2], T);
    if (d < rad) {
      const e = 0.003;
      let nx = latticeJS(FL.pos[o] + e, FL.pos[o + 1], FL.pos[o + 2], T) - d;
      let ny = latticeJS(FL.pos[o], FL.pos[o + 1] + e, FL.pos[o + 2], T) - d;
      let nz = latticeJS(FL.pos[o], FL.pos[o + 1], FL.pos[o + 2] + e, T) - d;
      const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
      const push = Math.min(rad - d, 0.02);
      FL.pos[o] += nx * push; FL.pos[o + 1] += ny * push; FL.pos[o + 2] += nz * push;
      const vn = FL.vel[o] * nx + FL.vel[o + 1] * ny + FL.vel[o + 2] * nz;
      if (vn < 0) { FL.vel[o] -= nx * vn * 1.25; FL.vel[o + 1] -= ny * vn * 1.25; FL.vel[o + 2] -= nz * vn * 1.25; }
      FL.vel[o] *= 0.82; FL.vel[o + 1] *= 0.82; FL.vel[o + 2] *= 0.82;
      FL.w[i].multiplyScalar(0.8);
    }
    const wl = FL.w[i].length();
    _dq.setFromAxisAngle(_ax.copy(FL.w[i]).divideScalar(wl || 1), wl * dt);
    FL.q[i].premultiply(_dq);
    const fade = Math.min(1, FL.life[i] * 2);
    _s.setScalar(FL.size[i] * fade);
    _m.compose(_p.set(FL.pos[o], FL.pos[o + 1], FL.pos[o + 2]), FL.q[i], _s);
    flakes.setMatrixAt(i, _m);
  }
  flakes.instanceMatrix.needsUpdate = true;
};
// warm up so the air is already full of chips when the page opens
const warm = (T) => { for (let j = 0; j < 90; j++) { placeCam(T - 3 + j / 30, 1 / 30); updateFlakes(1 / 30, T - 3 + j / 30); } };

////////////////////////////////////////////////////////////////
//// LOOP
////////////////////////////////////////////////////////////////

const fit = () => {
  renderer.setSize(innerWidth, innerHeight); uRes.value.set(innerWidth, innerHeight);
  // the raymarch frame spans ±1 horizontally: 90° wide
  cam3.aspect = innerWidth / innerHeight;
  cam3.fov = 2 * Math.atan(innerHeight / innerWidth) * 180 / Math.PI;
  cam3.updateProjectionMatrix();
};
window.addEventListener('resize', fit);
fit();

const T0 = parseFloat(QS.get('t')) || 6;
const clock = new THREE.Timer();
let tt = 0, first = true;
renderer.init().then(() => {
  renderer.setAnimationLoop(() => {
    clock.update();
    const dt = QS.has('freeze') ? 0 : Math.min(clock.getDelta(), 0.05);
    tt += dt;
    const T = T0 + tt;
    uTime.value = T;
    placeCam(T, dt);
    if (first) warm(T);
    updateFlakes(dt, T);
    snd.tick();
    snd.chips(T);
    pipe.render();
    if (first) { first = false; document.getElementById('loading').classList.add('off'); window.__ready = true; }
  });
}).catch(fail);
</script>
</body>
</html>
