<script type="module">
import * as THREE from 'three/webgpu';
import {
  Fn, uniform, instanceIndex, instancedArray, vec2, vec3, vec4, float, uv,
  length, normalize, dot, cross, fract, acos, mix, smoothstep, exp, max, min, clamp, sin, cos, abs, pow, sign, step,
  mx_noise_vec3, mx_noise_float, mx_fractal_noise_float,
  positionWorld, positionLocal, positionView, normalView, cameraPosition, screenUV, screenCoordinate, screenSize, pass, hash, convertToTexture, rtt,
  uint, int, uvec3, floor, If, Loop, atomicAdd, atomicLoad, atomicStore, textureStore, texture3D
} from 'three/tsl';
import { bloom } from 'three/addons/tsl/display/BloomNode.js';

const QS = new URLSearchParams(location.search);

////////////////////////////////////////////////////////////////
//// RENDERER
////////////////////////////////////////////////////////////////

const renderer = new THREE.WebGPURenderer({ antialias: false, forceWebGL: QS.has('webgl') });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);
try { await renderer.init(); }
catch (e) { document.getElementById('loading').textContent = 'this browser could not start WebGPU or WebGL2'; throw e; }

const isWebGL = renderer.backend.isWebGLBackend === true;
const isMobile = matchMedia('(pointer: coarse)').matches;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 4000);

////////////////////////////////////////////////////////////////
//// NOISE (CPU)
////////////////////////////////////////////////////////////////

const rnd2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
const vnoise = (x, y) => {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = rnd2(xi, yi), b = rnd2(xi + 1, yi), c = rnd2(xi, yi + 1), d = rnd2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
};
const fbm2 = (x, y) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < 5; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5; } return s; };
const sstep = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

////////////////////////////////////////////////////////////////
//// DUNES
////////////////////////////////////////////////////////////////

const OASIS = { x: 0, y: 2.4, z: -54 };

const duneH = (x, z) => {
  const d = Math.hypot(x, z);
  const w = fbm2(x * 0.003 + 7, z * 0.003 + 3);
  const crest = 1 - Math.abs(Math.sin((x * 0.55 + z * 0.83) * 0.0105 + w * 3.2));
  const big = Math.pow(crest, 1.8) * (6 + 18 * fbm2(x * 0.002, z * 0.002));
  const roll = (fbm2(x * 0.012 + 11, z * 0.012 - 5) - 0.5) * 5;
  const far = sstep(25, 280, d);
  let h = big * far + roll * (0.35 + 0.65 * far);
  const pan = Math.exp(-(x * x) / (2 * 34 * 34)) * Math.exp(-((z - OASIS.z) ** 2) / (2 * 40 * 40));
  const lane = Math.exp(-(x * x) / (2 * 20 * 20)) * sstep(8, -4, z) * sstep(-95, -55, z);
  h *= 1 - 0.88 * Math.max(pan, lane);
  return h;
};

const GROUND0 = duneH(0, 0);
const EYE = GROUND0 + 1.7;

const duneGeo = new THREE.PlaneGeometry(2600, 2600, QS.has('lite') ? 160 : isMobile ? 300 : 480, QS.has('lite') ? 160 : isMobile ? 300 : 480);
duneGeo.rotateX(-Math.PI / 2);
{
  const p = duneGeo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, duneH(p.getX(i), p.getZ(i)) - GROUND0);
  duneGeo.computeVertexNormals();
}

const uSandA = uniform(new THREE.Color()), uSandB = uniform(new THREE.Color());
const uTime = uniform(0);

const bump = Fn(([h, s]) => {
  const p = positionView, n = normalView;
  const dpdx = p.dFdx(), dpdy = p.dFdy();
  const r1 = cross(dpdy, n), r2 = cross(n, dpdx);
  const det = dot(dpdx, r1);
  const grad = r1.mul(h.dFdx()).add(r2.mul(h.dFdy())).mul(sign(det));
  return normalize(n.mul(abs(det)).sub(grad.mul(s)));
});

const duneMat = new THREE.MeshStandardNodeMaterial();
{
  const wp = positionWorld.xz;
  const big = mx_fractal_noise_float(vec3(wp.mul(0.012), 2.1), 4, 2.0, 0.5);
  const fine = mx_noise_float(vec3(wp.mul(7.0), 4.4));
  const dist = length(positionWorld.sub(cameraPosition));
  const rip = sin(dot(wp, vec2(0.55, 0.83)).mul(7.5).add(mx_noise_float(vec3(wp.mul(0.35), 1.0)).mul(5.0))).mul(0.5).add(0.5);
  const rFade = smoothstep(38.0, 4.0, dist);
  duneMat.colorNode = mix(uSandB, uSandA, smoothstep(-0.35, 0.45, big)).mul(fine.mul(0.05).add(0.97)).mul(rip.mul(0.06).mul(rFade).add(0.97));
  duneMat.roughnessNode = float(0.96);
  duneMat.metalnessNode = float(0);
  duneMat.normalNode = bump(rip.mul(0.022).mul(rFade).add(fine.mul(0.004)), float(1.0));
}
const dunes = new THREE.Mesh(duneGeo, duneMat);
scene.add(dunes);

////////////////////////////////////////////////////////////////
//// SKY
////////////////////////////////////////////////////////////////

const uZenith = uniform(new THREE.Color()), uHorizon = uniform(new THREE.Color()), uSunCol = uniform(new THREE.Color());
const uSunDir = uniform(new THREE.Vector3(0, 1, 0));
const skyMat = new THREE.MeshBasicNodeMaterial({ side: THREE.BackSide, depthWrite: false, fog: false });
skyMat.colorNode = Fn(() => {
  const d = normalize(positionLocal);
  const up = smoothstep(-0.02, 0.55, d.y);
  const sky = mix(uHorizon, uZenith, pow(up, 0.55)).toVar();
  const s = max(dot(d, uSunDir), 0.0);
  sky.addAssign(uSunCol.mul(pow(s, 1400.0).mul(30.0).add(pow(s, 18.0).mul(0.22)).add(pow(s, 3.0).mul(0.10))));
  const veil = smoothstep(0.09, -0.01, d.y);
  return mix(sky, uHorizon, veil.mul(0.6));
})();
const sky = new THREE.Mesh(new THREE.SphereGeometry(1800, 48, 24), skyMat);
sky.renderOrder = -1;
sky.frustumCulled = false;
scene.add(sky);

scene.fog = new THREE.FogExp2(0xe8dcc6, 0.0034);
const sun = new THREE.DirectionalLight(0xffffff, 2.6);
const hemi = new THREE.HemisphereLight(0xbfd4ff, 0xd9b48a, 0.9);
scene.add(sun, sun.target, hemi);

////////////////////////////////////////////////////////////////
//// OASIS IMAGE
////////////////////////////////////////////////////////////////

const qn = parseInt(QS.get('n') || '0', 10);
const COUNT = qn > 0 ? qn : isWebGL ? 393216 : (isMobile ? 786432 : 3145728);

const homeArr = new Float32Array(COUNT * 4);
const colArr = new Float32Array(COUNT * 4);
const scatArr = new Float32Array(COUNT * 4);
const R = Math.random;
let N = 0, mirror = false, TH = homeArr, TC = colArr, OFF = 0;

const emit = (x, y, z, c, a) => {
  if (N >= COUNT) return;
  let r = c[0], g = c[1], b = c[2];
  if (mirror) {
    y = -0.34 * y - 0.25; z += 2.2;
    r = r * 0.55 + 0.20; g = g * 0.55 + 0.30; b = b * 0.55 + 0.36;
    a *= 0.42;
  }
  const k = (N - OFF) * 4;
  TH[k] = OASIS.x + x; TH[k + 1] = OASIS.y + y; TH[k + 2] = OASIS.z + z; TH[k + 3] = R();
  TC[k] = r; TC[k + 1] = g; TC[k + 2] = b; TC[k + 3] = a;
  N++;
};

let PALMS = [
  { x: -11.0, z: -1.4, h: 7.6, lean: -0.20, bend: -0.7, fr: 10 },
  { x: -7.4, z: 0.6, h: 10.8, lean: 0.10, bend: 0.9, fr: 12 },
  { x: -3.2, z: -0.8, h: 8.4, lean: -0.06, bend: -0.5, fr: 10 },
  { x: 4.4, z: 0.2, h: 11.6, lean: 0.09, bend: -1.1, fr: 12 },
  { x: 8.4, z: -1.2, h: 8.0, lean: 0.22, bend: 0.6, fr: 11 },
  { x: 11.9, z: 0.8, h: 5.4, lean: -0.26, bend: 0.3, fr: 9 },
];
const trunkAt = (p, t) => [p.x + p.lean * p.h * t + p.bend * Math.sin(Math.PI * t) * 0.6, p.h * t, p.z];
const prepPalms = (list) => list.forEach((p) => {
  p.top = trunkAt(p, 1);
  p.fronds = [];
  const dl = p.dead ?? 0.16, ln = p.len ?? 1, dp = p.droop ?? 0;
  for (let i = 0; i < p.fr; i++) {
    const dead = R() < dl;
    p.fronds.push({
      phi: (i / p.fr) * Math.PI * 2 + (R() - 0.5) * 0.5,
      e0: dead ? -1.15 - R() * 0.3 : 0.25 + R() * 0.85 - dp * R(),
      dr: dead ? 0.05 : 0.45 + R() * 0.6 + dp * 0.5,
      L: ((dead ? 2.0 : 3.0) + R() * 1.7) * ln,
      dead,
    });
  }
});
prepPalms(PALMS);
const palmPick = () => { let s = 0; for (const p of PALMS) s += p.h; let r = R() * s; for (const p of PALMS) { r -= p.h; if (r <= 0) return p; } return PALMS[0]; };

const trunk = () => {
  const p = palmPick();
  const t = R();
  const c = trunkAt(p, t);
  const rad = (p.rad ?? 0.30) * (1 - 0.45 * t);
  const th = R() * Math.PI * 2;
  const shade = 0.55 + 0.5 * Math.max(0, Math.cos(th - 0.6));
  const band = 0.72 + 0.28 * (((t * p.h * 2.8) % 1) > 0.35 ? 1 : 0);
  const k = shade * band * (0.85 + 0.25 * R());
  const tk = p.tk ?? [0.40, 0.29, 0.18];
  emit(c[0] + Math.cos(th) * rad, c[1], c[2] + Math.sin(th) * rad, [tk[0] * k, tk[1] * k, tk[2] * k], 0.95);
};

const frond = () => {
  const p = palmPick();
  const f = p.fronds[(R() * p.fronds.length) | 0];
  if (R() < 0.04) {
    const a = R() * Math.PI * 2, r = 0.35 * Math.sqrt(R());
    emit(p.top[0] + Math.cos(a) * r, p.top[1] - 0.2 - R() * 0.4, p.top[2] + Math.sin(a) * r, [0.32, 0.22, 0.10], 1);
    return;
  }
  const K = 36;
  const s = (Math.floor(R() * K) + 0.5 + (R() - 0.5) * 0.2) / K;
  const side = R() < 0.5 ? -1 : 1;
  const u = R();
  const cphi = Math.cos(f.phi), sphi = Math.sin(f.phi) * 0.55;
  const reach = f.L * Math.cos(f.e0 * 0.6);
  const sx = p.top[0] + cphi * reach * s;
  const sy = p.top[1] + f.L * (s * Math.sin(f.e0) - s * s * f.dr);
  const sz = p.top[2] + sphi * reach * s;
  const w = (0.78 * Math.sin(Math.PI * Math.min(1, s * 1.12)) * (1 - 0.3 * s) + 0.06) * (f.dead ? 0.5 : 1);
  const px = -sphi, pz = cphi * 0.55;
  const x = sx + px * side * u * w + cphi * u * w * 0.3;
  const y = sy - u * w * 0.55;
  const z = sz + pz * side * u * w;
  let col;
  if (f.dead) col = lerp3([0.42, 0.32, 0.17], [0.58, 0.46, 0.26], R());
  else {
    col = lerp3(p.cA ?? [0.10, 0.25, 0.08], p.cB ?? [0.36, 0.50, 0.15], Math.pow(R(), 0.8));
    if (s > 0.72) col = lerp3(col, p.tip ?? [0.56, 0.52, 0.22], (s - 0.72) * 1.6 * R());
    const k = 0.72 + 0.45 * (1 - u) * (0.6 + 0.4 * Math.max(0, cphi * 0.6 + 0.5));
    col = [col[0] * k, col[1] * k, col[2] * k];
  }
  emit(x, y, z, col, 1);
};

const POOL = { x: 1.0, z: 1.2, rx: 9.5, rz: 2.8 };
const poolPt = () => {
  const r = Math.sqrt(R()), a = R() * Math.PI * 2;
  const zl = Math.sin(a) * r * POOL.rz;
  const y = 0.22 + (POOL.rz - zl) * 0.10;
  let col = lerp3([0.06, 0.27, 0.34], [0.42, 0.62, 0.64], Math.pow(r, 2.2));
  const rip = 0.9 + 0.12 * Math.sin(r * 34 + a * 2);
  col = [col[0] * rip, col[1] * rip, col[2] * rip];
  if (R() < 0.025) col = [1.5, 1.45, 1.3];
  emit(POOL.x + Math.cos(a) * r * POOL.rx, y, POOL.z + zl, col, 0.85);
};

const sandPt = () => {
  const x = (R() - 0.5) * 36;
  const z = (R() - 0.5) * 8;
  const h = 1.0 * Math.exp(-((x / 13) ** 2)) * Math.pow(R(), 0.6) - 0.15;
  const k = 0.82 + 0.3 * R();
  emit(x, h, z, [0.86 * k, 0.70 * k, 0.48 * k], 0.5);
};

const TUFTS = [];
for (let i = 0; i < 70; i++) {
  const a = R() * Math.PI * 2, r = 1.0 + R() * 0.18;
  TUFTS.push({ x: POOL.x + Math.cos(a) * r * POOL.rx, z: POOL.z + Math.sin(a) * r * POOL.rz, y: 0.22 + (POOL.rz - Math.sin(a) * r * POOL.rz) * 0.10, s: 0.6 + R() * 1.0 });
}
const grass = () => {
  const tf = TUFTS[(R() * TUFTS.length) | 0];
  const ang = (R() - 0.5) * 1.6, len = tf.s * (0.5 + R() * 0.7);
  const t = R();
  const x = tf.x + Math.sin(ang) * len * t + ang * 0.4 * t * t;
  const y = tf.y + Math.cos(ang) * len * t * (1 - 0.25 * t);
  const col = lerp3([0.22, 0.30, 0.10], [0.55, 0.55, 0.22], R() * (0.4 + t * 0.6));
  emit(x, y, tf.z + (R() - 0.5) * 0.2, col, 0.9);
};

const IMG = Math.min(1048576, Math.floor(COUNT * 0.34));
const SAND = COUNT - IMG;
N = SAND;
const fill = (frac, fn) => { const end = Math.min(COUNT, N + Math.floor(IMG * frac)); while (N < end) fn(); };
fill(0.07, sandPt);
fill(0.12, poolPt);
mirror = true;
fill(0.03, trunk);
fill(0.08, frond);
fill(0.01, grass);
mirror = false;
fill(0.11, trunk);
fill(0.51, frond);
fill(0.07, grass);
while (N < COUNT) frond();

////////////////////////////////////////////////////////////////
//// OASIS II
////////////////////////////////////////////////////////////////

const c1Arr = colArr.slice(SAND * 4);
const h2Arr = new Float32Array(IMG * 4);
const c2Arr = new Float32Array(IMG * 4);
TH = h2Arr; TC = c2Arr; OFF = SAND; N = SAND;

PALMS = [
  { x: -2.6, z: -0.6, h: 11.2, lean: -0.40, bend: -0.6, fr: 13, rad: 0.24, len: 1.25, droop: 0.35, dead: 0.04,
    cA: [0.05, 0.20, 0.17], cB: [0.16, 0.36, 0.27], tip: [0.25, 0.42, 0.30], tk: [0.52, 0.40, 0.27] },
  { x: 1.6, z: -1.0, h: 14.2, lean: -0.15, bend: 0.5, fr: 14, rad: 0.25, len: 1.3, droop: 0.35, dead: 0.04,
    cA: [0.05, 0.20, 0.16], cB: [0.17, 0.37, 0.27], tip: [0.28, 0.44, 0.30], tk: [0.55, 0.42, 0.28] },
  { x: 3.4, z: -1.6, h: 9.2, lean: -0.02, bend: 0.1, fr: 10, rad: 0.15, len: 0.8, droop: 0.3, dead: 0.02,
    cA: [0.08, 0.24, 0.17], cB: [0.22, 0.42, 0.28], tip: [0.40, 0.52, 0.32], tk: [0.50, 0.42, 0.30] },
  { x: 11.8, z: 0.4, h: 9.6, lean: -0.55, bend: 1.3, fr: 18, rad: 0.27, len: 1.15, droop: 0.9, dead: 0.03,
    cA: [0.42, 0.58, 0.16], cB: [0.82, 0.86, 0.34], tip: [0.95, 0.78, 0.35], tk: [0.62, 0.50, 0.30] },
];
prepPalms(PALMS);

const DUNE2 = (x) => Math.max(7.6 * Math.exp(-(((x - 9.5) / 8.5) ** 2)) + 3.2 * Math.exp(-(((x - 1) / 8) ** 2)), 4.2 * Math.exp(-(((x + 12) / 5.5) ** 2)));
const dunePt = () => {
  const x = (R() - 0.5) * 38;
  const top = DUNE2(x);
  if (top < 0.15) return;
  const u = Math.pow(R(), 0.35);
  const y = top * u - 0.4;
  const slope = DUNE2(x - 0.3) - DUNE2(x + 0.3);
  const lit = Math.max(-0.7, Math.min(0.9, slope * 1.6));
  const k = (0.70 + 0.32 * lit) * (0.92 + 0.12 * R()) * (0.62 + 0.38 * Math.pow(u, 3));
  const ridge = Math.pow(u, 12) * 0.25;
  emit(x, y, -7.5 + R() * 2.0, [1.05 * k + ridge, 0.66 * k + ridge * 0.9, 0.48 * k + ridge * 0.7], 1.0);
};

const POOL2 = { x: -3.2, z: 2.6, rx: 9.6, rz: 3.3 };
const REFL = [-3.4, 1.0, 3.4];
const poolPt2 = () => {
  const r = Math.sqrt(R()), a = R() * Math.PI * 2;
  const xl = Math.cos(a) * r * POOL2.rx * (1 + 0.15 * Math.sin(a * 2));
  const zl = Math.sin(a) * r * POOL2.rz;
  const y = 0.05 + (POOL2.rz - zl) * 0.36;
  const back = (POOL2.rz - zl) / (2 * POOL2.rz);
  let col = lerp3([0.06, 0.30, 0.50], [0.40, 0.78, 0.92], Math.pow(back, 1.2));
  const x = POOL2.x + xl;
  for (const rx of REFL) {
    const sx = rx - (1 - back) * 1.2;
    if (Math.abs(x - sx) < 0.28) col = lerp3(col, [0.22, 0.20, 0.18], 0.75);
  }
  if (back > 0.7 && x > -9 && x < 6 && R() < 0.35) col = lerp3(col, [0.12, 0.22, 0.18], 0.5);
  const rip = 0.92 + 0.08 * Math.sin(r * 30 + a * 3);
  col = [col[0] * rip, col[1] * rip, col[2] * rip];
  if (R() < 0.015) col = [1.4, 1.3, 1.15];
  emit(x, y, POOL2.z + zl, col, 0.9);
};

const rimPt = () => {
  const x = (R() - 0.5) * 36;
  const z = 3.5 + R() * 3.0;
  const y = -0.25 + R() * 0.35 + 0.2 * Math.exp(-((x / 14) ** 2));
  const k = 0.88 + 0.18 * R();
  emit(x, y, z, [0.98 * k, 0.78 * k, 0.70 * k], 0.6);
};

const BUSH = [
  { x: -14.0, y: 0.3, z: 1.5, rx: 3.2, ry: 1.6 }, { x: -13.5, y: 0.0, z: 4.0, rx: 2.4, ry: 1.8 },
  { x: -9.5, y: 0.5, z: -0.5, rx: 2.4, ry: 1.2 }, { x: -1.0, y: 0.5, z: -1.2, rx: 2.4, ry: 1.4 },
  { x: 3.6, y: 0.7, z: -2.0, rx: 2.8, ry: 1.3 }, { x: 7.2, y: 0.4, z: -1.0, rx: 2.4, ry: 1.3 },
  { x: 8.2, y: 0.3, z: 3.8, rx: 3.8, ry: 1.5 }, { x: 11.5, y: 0.3, z: 2.6, rx: 3.4, ry: 1.5 },
  { x: 14.5, y: 0.6, z: 0.0, rx: 2.0, ry: 1.2 }, { x: 15.6, y: 0.4, z: 1.8, rx: 1.4, ry: 1.0 },
];
const bushPt = () => {
  const b = BUSH[(R() * BUSH.length) | 0];
  let dx, dy, dz, l;
  do { dx = R() * 2 - 1; dy = R(); dz = R() * 2 - 1; l = dx * dx + dy * dy + dz * dz; } while (l > 1);
  const sh = 0.75 + 0.25 * Math.pow(R(), 0.3);
  const bumpy = 1 + 0.18 * Math.sin(dx * 9 + dz * 7) * Math.sin(dy * 8);
  const x = b.x + dx * b.rx * sh * bumpy, y = b.y + dy * b.ry * sh * bumpy, z = b.z + dz * 1.2 * sh;
  const lit = Math.max(0, dy * 0.7 - dx * 0.3);
  let col = lerp3([0.05, 0.17, 0.08], [0.20, 0.40, 0.16], lit * (0.6 + 0.4 * R()));
  if (R() < 0.04) col = [0.45, 0.55, 0.25];
  emit(x, y, z, col, 1);
};

const rockPt = () => {
  const rk = R() < 0.6 ? { x: -7.6, y: 0.5, rx: 1.3, ry: 0.75 } : { x: -6.0, y: 0.35, rx: 0.8, ry: 0.5 };
  let dx, dy, dz, l;
  do { dx = R() * 2 - 1; dy = R(); dz = R() * 2 - 1; l = dx * dx + dy * dy + dz * dz; } while (l > 1);
  const k = 0.75 + 0.45 * Math.max(0, dy * 0.6 - dx * 0.5) + 0.1 * R();
  emit(rk.x + dx * rk.rx, rk.y + dy * rk.ry - 0.2, -0.2 + dz * 0.6, [1.0 * k, 0.78 * k, 0.44 * k], 1);
};

fill(0.16, dunePt);

TH = homeArr; TC = colArr; OFF = 0;
for (let i = 0; i < IMG; i++) h2Arr[i * 4 + 3] = homeArr[(SAND + i) * 4 + 3];
const h1Arr = homeArr.slice(SAND * 4);

for (let i = SAND; i < COUNT; i++) {
  const k = i * 4;
  const hx = homeArr[k] - OASIS.x, hy = homeArr[k + 1] - OASIS.y;
  scatArr[k] = OASIS.x + (R() - 0.5) * 110;
  scatArr[k + 1] = OASIS.y - 2.2 + Math.pow(R(), 2.2) * 9;
  scatArr[k + 2] = OASIS.z + (R() - 0.5) * 60;
  scatArr[k + 3] = Math.min(0.95, Math.max(0.05, 0.08 + 0.55 * fbm2(hx * 0.22 + 3, hy * 0.22 + 9) + 0.32 * R()));
}
const FLOOR = OASIS.y - 2.8;
let CORE = 0;
for (let i = 0; i < SAND; i++) {
  const k = i * 4;
  const kind = R();
  let x, y, z, w = 9;
  if (kind < 0.55) {
    let dx, dy, dz, l;
    do { dx = R() * 2 - 1; dy = R() * 2 - 1; dz = R() * 2 - 1; l = dx * dx + dy * dy + dz * dz; } while (l > 1 || l < 1e-4);
    l = Math.sqrt(l); dx /= l; dy /= l; dz /= l;
    const r = R() < 0.72 ? 0.8 + 0.2 * Math.pow(R(), 0.45) : 0.78 * Math.cbrt(R());
    x = OASIS.x + dx * r * 25; y = OASIS.y + 4.2 + dy * r * 10.5; z = OASIS.z + dz * r * 14;
    if (y < FLOOR) y = FLOOR + (FLOOR - y) * 0.25;
    w = 10; CORE++;
  } else if (kind < 0.86) {
    x = OASIS.x + (R() - 0.5) * 110;
    z = OASIS.z + (R() - 0.5) * 60;
    y = FLOOR + 0.3 + Math.pow(R(), 2.2) * 9;
  } else {
    x = (R() - 0.5) * 44;
    z = -30 + R() * 36;
    y = 0.1 + Math.pow(R(), 1.6) * 6.5;
    w = 11;
  }
  scatArr[k] = x; scatArr[k + 1] = y; scatArr[k + 2] = z; scatArr[k + 3] = w;
  homeArr[k] = x; homeArr[k + 1] = y; homeArr[k + 2] = z; homeArr[k + 3] = R();
  const v = 0.8 + 0.35 * R();
  colArr[k] = R(); colArr[k + 1] = v; colArr[k + 2] = R(); colArr[k + 3] = -1;
}

const homeB = instancedArray(homeArr, 'vec4');
const padImg = (a) => { if (!isWebGL) return a; const o = new Float32Array(COUNT * 4); o.set(a, SAND * 4); return o; };
const h2B = isWebGL ? null : instancedArray(h2Arr, 'vec4');
const c1B = instancedArray(padImg(c1Arr), 'vec4');
const c2B = instancedArray(padImg(c2Arr), 'vec4');
const colB = instancedArray(colArr, 'vec4');
const scatB = instancedArray(scatArr, 'vec4');
const posB = instancedArray(COUNT, 'vec4');
const velB = instancedArray(COUNT, 'vec4');
renderer.compute(Fn(() => { posB.element(instanceIndex).assign(vec4(scatB.element(instanceIndex).xyz, 0.0)); })().compute(COUNT));

////////////////////////////////////////////////////////////////
//// UNIFORMS
////////////////////////////////////////////////////////////////

const uDt = uniform(1 / 60);
const uForm = uniform(0), uHeat = uniform(1), uWind = uniform(0.3);
const uSpring = uniform(2.03), uTurb = uniform(1.43), uDamp = uniform(1.78);
const uRayO = uniform(new THREE.Vector3()), uRayD = uniform(new THREE.Vector3(0, 0, -1));
const uPtr = uniform(0), uPtrVel = uniform(new THREE.Vector3());
const uMorph = uniform(1);
const uDrift = uniform(0.57), uDriftRate = uniform(0.068), uDriftWin = uniform(0.35);
const uRingR = uniform(20.57), uRingW = uniform(18.07), uRingSpeed = uniform(1.06), uSwirlSpeed = uniform(5.22), uCurlAmp = uniform(2.26), uRelax = uniform(3.63), uConfine = uniform(5.0);
const uChroma = uniform(0.26);
const uTeal = uniform(new THREE.Color().setRGB(0.06, 0.79, 0.60)), uBlue = uniform(new THREE.Color().setRGB(0.14, 0.42, 0.87)), uPink = uniform(new THREE.Color().setRGB(0.85, 0.31, 0.47)), uLilac = uniform(new THREE.Color().setRGB(0.40, 0.25, 0.75));
const uDevilSpin = uniform(5.5), uDevilR = uniform(7.0), uNearFade = uniform(4.0);
const uSpin = uniform(0.101), uSandTurb = uniform(6.0), uSandSpring = uniform(0.16), uSandAlpha = uniform(QS.has('nosand') ? 0 : 0.25);
const uPush = uniform(20.87), uSwirl = uniform(26.0), uDive = uniform(12.17), uDrag = uniform(2.2);
const uSize = uniform(0.03967 * Math.sqrt(1048576 / IMG));
const uSandSize = uniform(0.085 * Math.sqrt(2097152 / SAND));
const uAlpha = uniform(0.87);
const uHaze = uniform(new THREE.Color()), uDust = uniform(new THREE.Color()), uLit = uniform(new THREE.Color());

////////////////////////////////////////////////////////////////
//// CURL
////////////////////////////////////////////////////////////////

const curl = Fn(([p]) => {
  const e = 0.09;
  const n = mx_noise_vec3(p);
  const nx = mx_noise_vec3(p.add(vec3(e, 0, 0))).sub(n);
  const ny = mx_noise_vec3(p.add(vec3(0, e, 0))).sub(n);
  const nz = mx_noise_vec3(p.add(vec3(0, 0, e))).sub(n);
  return vec3(ny.z.sub(nz.y), nz.x.sub(nx.z), nx.y.sub(ny.x)).div(e);
});

////////////////////////////////////////////////////////////////
//// SIMULATION
////////////////////////////////////////////////////////////////

const update = Fn(() => {
  const P4 = posB.element(instanceIndex);
  const V4 = velB.element(instanceIndex);
  const H4 = homeB.element(instanceIndex);
  const S4 = scatB.element(instanceIndex);
  const p = P4.xyz.toVar();
  const v = V4.xyz.toVar();
  const iImg = isWebGL ? instanceIndex : max(instanceIndex, uint(SAND)).sub(uint(SAND));
  const H2 = isWebGL ? H4 : h2B.element(iImg);
  const mi = smoothstep(H4.w.sub(0.12), H4.w.add(0.12), uMorph.mul(1.24).sub(0.12));
  const h = mix(H4.xyz, H2.xyz, mi);
  if (!isWebGL) {
    const CB = colB.element(instanceIndex);
    CB.assign(mix(mix(c1B.element(iImg), c2B.element(iImg), mi), CB, step(5.0, S4.w)));
  }
  const ly = h.y.sub(OASIS.y);
  const heat = smoothstep(9.0, -2.5, ly);
  const t = uTime;

  const wob = vec3(
    sin(h.y.mul(2.1).add(t.mul(2.4)).add(h.x.mul(0.35))).mul(0.09)
      .add(mx_noise_float(vec3(h.x.mul(0.35), h.y.mul(1.6).sub(t.mul(1.3)), t.mul(0.25))).mul(0.42)),
    mx_noise_float(vec3(h.x.mul(0.22), t.mul(0.45), 3.0)).mul(0.22),
    0.0
  ).mul(heat.mul(0.85).add(0.15)).mul(uHeat);
  const stretch = sin(t.mul(0.31).add(h.x.mul(0.04))).mul(0.06).add(1.0);
  const home = vec3(h.x, ly.mul(stretch).add(OASIS.y), h.z).add(wob);

  const sand = step(5.0, S4.w);
  const near = step(10.5, S4.w);
  const core = step(9.5, S4.w).sub(near);
  const f = smoothstep(S4.w.sub(0.16), S4.w.add(0.16), uForm);
  const target = mix(S4.xyz, home, f);

  const rel = p.sub(uRayO);
  const along = max(dot(rel, uRayD), 0.0);
  const d = rel.sub(uRayD.mul(along));
  const dist = max(length(d), 1e-4);
  const nrm = d.div(dist);
  const rad = along.mul(0.055).add(1.8);
  const g = exp(dist.mul(dist).div(rad.mul(rad)).negate()).mul(uPtr);
  v.addAssign(nrm.mul(uPush).add(cross(uRayD, nrm).mul(uSwirl)).add(uRayD.mul(uDive)).mul(g).mul(uDt));
  v.addAssign(uPtrVel.mul(g).mul(uDrag));

  // sand: carried by a ring vortex, a swirl and curl folds
  const C = vec3(OASIS.x, OASIS.y + 4.5, OASIS.z);
  const rc = p.sub(C);
  const rs = vec3(rc.x, rc.y, rc.z.div(0.6));
  const rho = max(length(rs.xz), 1e-3);
  const radial = vec3(rs.x.div(rho), 0.0, rs.z.div(rho).mul(0.6));
  const tang = vec3(radial.z.negate(), 0.0, radial.x);
  const dr = rho.sub(uRingR);
  const ringW = exp(dr.mul(dr).add(rc.y.mul(rc.y).mul(2.0)).div(uRingW.mul(uRingW)).negate());
  const pol = radial.mul(rc.y).add(vec3(0.0, dr.negate(), 0.0)).mul(uRingSpeed).mul(ringW);
  const swirl = tang.mul(uSwirlSpeed).mul(exp(rho.mul(rho).div(900.0).negate()));
  const qc = p.mul(0.075).add(vec3(0.0, t.mul(0.07), t.mul(0.02)));
  const fold = curl(qc).add(curl(qc.mul(2.3).add(3.0)).mul(0.4)).mul(uCurlAmp);
  const en = length(rc.div(vec3(26.0, 11.5, 15.0)));
  const keepC = rc.div(max(length(rc), 1e-3)).mul(max(en.sub(1.0), 0.0)).mul(uConfine).negate();
  const flowCore = pol.add(swirl).add(fold).add(keepC);

  const qf = p.mul(0.045).add(vec3(t.mul(0.03), t.mul(0.015), 0.0));
  const rf = p.sub(vec3(OASIS.x, FLOOR + 3.0, OASIS.z));
  const out = vec3(
    max(abs(rf.x).sub(55.0), 0.0).mul(sign(rf.x)),
    max(rf.y.sub(7.0), 0.0).add(min(rf.y.add(2.6), 0.0)),
    max(abs(rf.z).sub(30.0), 0.0).mul(sign(rf.z))
  );
  const flowField = curl(qf).mul(1.3).add(tang.mul(0.7)).add(vec3(uWind.mul(0.6), 0.0, 0.0)).sub(out.mul(0.6));

  const ang = t.mul(uSpin);
  const cs = cos(ang), sn = sin(ang);
  const r0 = S4.xyz.sub(vec3(OASIS.x, 0, OASIS.z));
  const homeS = vec3(r0.x.mul(cs).sub(r0.z.mul(sn)), r0.y, r0.x.mul(sn).add(r0.z.mul(cs))).add(vec3(OASIS.x, 0, OASIS.z));
  const pullS = homeS.sub(p).mul(mix(float(0.05), uSandSpring, core)).mul(near.oneMinus());
  const devil = (cx, cz) => {
    const r = vec2(p.x.sub(cx), p.z.sub(cz));
    const d2 = dot(r, r);
    const w = exp(d2.div(uDevilR.mul(uDevilR)).negate());
    const inv = d2.add(1.0).inverseSqrt();
    return vec3(r.y.negate(), 0.0, r.x).mul(inv).mul(uDevilSpin).mul(w)
      .add(vec3(r.x, 0.0, r.y).mul(-0.12).mul(w))
      .add(vec3(0.0, w.mul(1.6).mul(smoothstep(7.0, 0.0, p.y)), 0.0));
  };
  const dv1 = devil(sin(t.mul(0.11)).mul(9.0), cos(t.mul(0.08)).mul(5.0).sub(12.0));
  const dv2 = devil(cos(t.mul(0.07).add(2.0)).mul(13.0), sin(t.mul(0.1).add(1.0)).mul(6.0).sub(21.0));
  const qn = p.mul(0.12).add(vec3(t.mul(0.05), t.mul(0.09), 0.0));
  const outN = vec3(
    max(abs(p.x).sub(22.0), 0.0).mul(sign(p.x)),
    max(p.y.sub(7.0), 0.0),
    max(p.z.sub(6.0), 0.0).add(min(p.z.add(30.0), 0.0))
  );
  const flowNear = dv1.add(dv2).add(curl(qn).mul(uCurlAmp).mul(0.8)).add(vec3(uWind.mul(0.5), 0.0, 0.0))
    .add(S4.xyz.sub(p).mul(uSandSpring.mul(0.6))).sub(outN.mul(0.8));
  // image particles: springs, but never fully settled
  const ph = fract(t.mul(uDriftRate).add(H4.w.mul(7.31)).add(mx_noise_float(h.mul(0.12)).mul(0.6)));
  const detach0 = smoothstep(0.0, 0.08, ph).mul(smoothstep(uDriftWin, uDriftWin.sub(0.1), ph)).mul(uDrift).mul(f);
  const detach = min(detach0.add(sin(mi.mul(Math.PI)).mul(0.95).mul(f)), 1.0);
  const q = p.mul(0.07).add(vec3(t.mul(0.045), t.mul(0.02), t.mul(0.03)));
  const flow = curl(q).add(curl(q.mul(2.6).add(5.0)).mul(0.35));
  const loose = f.mul(0.62).oneMinus();
  const vI = v.toVar();
  vI.addAssign(flow.mul(uTurb).mul(loose.add(detach)).mul(uDt));
  vI.addAssign(vec3(uWind, uWind.mul(0.08), 0.0).mul(f.oneMinus()).mul(uDt));
  vI.addAssign(target.sub(p).mul(mix(float(0.35), uSpring, f)).mul(detach.mul(0.92).oneMinus()).mul(uDt));
  vI.mulAssign(exp(uDamp.mul(uDt).negate()));
  vI.assign(mix(vI, flowCore.mul(0.85), detach.mul(exp(uDt.mul(-2.5)).oneMinus())));

  const floorPush = vec3(0.0, max(float(FLOOR + 0.2).sub(p.y), 0.0).mul(4.0), 0.0);
  const vTarget = mix(mix(flowField, flowCore, core), flowNear, near).add(floorPush).add(pullS);
  const vS = mix(v, vTarget, exp(uRelax.mul(uDt).negate()).oneMinus());

  v.assign(mix(vI, vS, sand));
  p.addAssign(v.mul(uDt));
  P4.assign(vec4(p, f.mul(detach.mul(0.45).oneMinus())));
  V4.assign(vec4(v, 0.0));
})().compute(COUNT);

////////////////////////////////////////////////////////////////
//// DENSITY VOLUME
////////////////////////////////////////////////////////////////

const VOL = !isWebGL && !QS.has('noshadow');
const G = parseInt(QS.get('g') || '0', 10) || (isMobile ? 64 : 96);
const LG = parseInt(QS.get('lg') || '0', 10) || (isMobile ? 40 : 64);
const VC = vec3(OASIS.x, OASIS.y + 4.2, OASIS.z);
const VS = vec3(120, 34, 72);
const OD = 12.0;
const SUN_STEPS = 14, SUN_LEN = 36, VIEW_STEPS = 12, VIEW_LEN = 30;
const toGrid = (wp) => wp.sub(VC).div(VS).add(0.5);
const uExt = uniform(3.1), uShadow = uniform(0.83), uVeil = uniform(0.35);
const uCamPos = uniform(new THREE.Vector3());
const uShadeTint = uniform(new THREE.Color(0.48, 0.5, 0.58));
let lightTex = null, volumePasses = [];

if (VOL) {
  const G3 = G * G * G;
  const gridBuf = instancedArray(G3, 'uint').toAtomic();
  const uDensNorm = uniform(0.05 * (1.15e6 / Math.max(CORE, 1)) * Math.pow(G / 96, 3) * (68 * 30 * 44) / (120 * 34 * 72));
  const densTex = new THREE.Storage3DTexture(G, G, G);
  densTex.type = THREE.HalfFloatType;
  lightTex = new THREE.Storage3DTexture(LG, LG, LG);
  lightTex.type = THREE.HalfFloatType;

  const clearGrid = Fn(() => {
    atomicStore(gridBuf.element(instanceIndex), uint(0));
  })().compute(G3);

  const splat = Fn(() => {
    const g = toGrid(posB.element(instanceIndex).xyz).mul(G).toVar();
    If(g.x.greaterThanEqual(0).and(g.y.greaterThanEqual(0)).and(g.z.greaterThanEqual(0))
      .and(g.x.lessThan(G)).and(g.y.lessThan(G)).and(g.z.lessThan(G)), () => {
      const c = uvec3(floor(g));
      atomicAdd(gridBuf.element(c.x.add(c.y.mul(G)).add(c.z.mul(G * G))), uint(1));
    });
  })().compute(SAND);

  const cellIndex = (x, y, z) => uint(
    clamp(x, int(0), int(G - 1))
      .add(clamp(y, int(0), int(G - 1)).mul(G))
      .add(clamp(z, int(0), int(G - 1)).mul(G * G))
  );

  const blur = Fn(() => {
    const i = instanceIndex;
    const x = int(i.mod(G)).toVar(), y = int(i.div(G).mod(G)).toVar(), z = int(i.div(G * G)).toVar();
    const sum = float(0).toVar();
    for (let dz = -1; dz <= 1; dz++) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const w = (dx === 0 ? 2 : 1) * (dy === 0 ? 2 : 1) * (dz === 0 ? 2 : 1) / 64;
      const c = atomicLoad(gridBuf.element(cellIndex(x.add(dx), y.add(dy), z.add(dz))));
      sum.addAssign(float(c).mul(w));
    }
    textureStore(densTex, uvec3(x, y, z), vec4(sum.mul(uDensNorm), 0, 0, 1));
  })().compute(G3);

  const densAt = (wp) => texture3D(densTex, toGrid(wp)).level(0).r;

  const lightPass = Fn(() => {
    const i = instanceIndex;
    const x = i.mod(LG), y = i.div(LG).mod(LG), z = i.div(LG * LG);
    const wp = vec3(float(x), float(y), float(z)).add(0.5).div(LG).sub(0.5).mul(VS).add(VC).toVar();
    const dsS = SUN_LEN / SUN_STEPS;

  const tt = clamp(vec3(1.0).sub(abs(peak.sub(x).mul(range))), 0.0, 1.0);

  const pluck = (fq, amp) => {
    const t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(fq * 1.012, t); o.frequency.exponentialRampToValueAtTime(fq, t + 0.08);
    const o2 = ctx.createOscillator(); o2.type = 'triangle'; o2.frequency.value = fq * 2.003;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 3;
    f.frequency.setValueAtTime(3200, t); f.frequency.exponentialRampToValueAtTime(380, t + 1.4);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(amp, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
    const g2 = ctx.createGain(); g2.gain.value = 0.25;
    const pn = ctx.createStereoPanner(); pn.pan.value = (Math.random() - 0.5) * 0.9;
    o.connect(f); o2.connect(g2).connect(f);
    f.connect(g).connect(pn); pn.connect(out); pn.connect(wet);
    o.start(t); o2.start(t); o.stop(t + 2.5); o2.stop(t + 2.5);
  };
  return {
    get on() { return on; },
    wake() { if (!ctx) init(); else if (ctx.state === 'suspended') ctx.resume(); },
    set(v) { on = v; if (ctx) out.gain.setTargetAtTime(on ? 0.9 : 0, ctx.currentTime, 0.2); },
    tick(dt, form, walk, look) {
      if (!ready || !on) return;
      const now = ctx.currentTime;
      gustT -= dt;
      if (gustT <= 0) { gustT = 1.5 + Math.random() * 3; gust = 0.2 + Math.random() * 0.6; }
      windG.forEach((g, i) => {
        g.gain.setTargetAtTime((0.05 + gust * 0.09 + walk * 0.22) * (i ? 0.9 : 1), now, 0.9);
        windF[i].frequency.setTargetAtTime(260 + gust * 520 + walk * 700 + i * 90, now, 1.2);
      });
      const vis = Math.max(0, Math.min(1, form));
      shimG.gain.setTargetAtTime(0.0001 + vis * 0.012 * (1 - walk * 0.7), now, 0.8);
      padG.gain.setTargetAtTime(0.0001 + vis * 0.075 * (1 - walk * 0.6), now, 1.2);
      padF.frequency.setTargetAtTime(500 + vis * 900 - walk * 300 + look * 200, now, 0.8);
      chordT -= dt;
      if (chordT <= 0) {
        chordT = 9 + Math.random() * 4;
        chordI = (chordI + 1 + (Math.random() < 0.3 ? 1 : 0)) % CHORDS.length;
        CHORDS[chordI].forEach((fq, i) => padV[i].forEach((o) => o.frequency.setTargetAtTime(fq, now, 2.2)));
      }
      padV.forEach((v) => v.forEach((o, j) => o.detune.setTargetAtTime((j ? 6 : -6) - walk * 45, now, 0.6)));
      pluckT -= dt;
      if (pluckT <= 0) {
        pluckT = 0.9 + Math.random() * 2.6;
        if (vis > 0.6 && walk < 0.3) {
          deg = Math.max(0, Math.min(HIJAZ.length - 1, deg + [-2, -1, -1, 1, 1, 2][(Math.random() * 6) | 0]));
          pluck(HIJAZ[deg], 0.05 + Math.random() * 0.03);
          if (Math.random() < 0.3) setTimeout(() => { if (on) pluck(HIJAZ[Math.max(0, deg - 1)], 0.035); }, 160);
        }
      }
    },
  };
})();

////////////////////////////////////////////////////////////////
//// INPUT
////////////////////////////////////////////////////////////////

const view = { yaw: 0, pitch: 0, yawT: 0, pitchT: 0 };
let walking = false, walk = 0, holdTimer = 0;
const ptr = { x: 0, y: 0, down: false, moved: 0, last: 0, sx: 0, sy: 0 };
const ndc = new THREE.Vector2(10, 10);
const cvs = renderer.domElement;
cvs.addEventListener('pointerdown', (e) => {
  snd.wake();
  cvs.setPointerCapture(e.pointerId);
  ptr.down = true; ptr.moved = 0; ptr.sx = e.clientX; ptr.sy = e.clientY; ptr.x = e.clientX; ptr.y = e.clientY;
  clearTimeout(holdTimer);
  holdTimer = setTimeout(() => { if (ptr.down && ptr.moved < 8) walking = true; }, 220);
});
cvs.addEventListener('pointermove', (e) => {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ptr.last = performance.now();
  if (ptr.down) {
    const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
    ptr.moved += Math.abs(dx) + Math.abs(dy);
    if (ptr.moved >= 8 && !walking) {
      view.yawT = Math.max(-0.7, Math.min(0.7, view.yawT - dx * 0.0035));
      view.pitchT = Math.max(-0.12, Math.min(0.3, view.pitchT + dy * 0.0025));
    }
  }
  ptr.x = e.clientX; ptr.y = e.clientY;
});
const release = () => { ptr.down = false; walking = false; clearTimeout(holdTimer); };
cvs.addEventListener('pointerup', release);
cvs.addEventListener('pointercancel', release);
cvs.addEventListener('pointerleave', () => { ndc.set(10, 10); });

const lookBtns = [...document.querySelectorAll('button[data-look]')];
const syncLook = () => {
  lookBtns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.look === lookMode)));
  document.body.classList.toggle('dusk', lookMode === 'dusk');
};
lookBtns.forEach((b) => b.addEventListener('click', () => { lookMode = b.dataset.look; syncLook(); }));
let sceneT = uMorph.value, glSet = 1;
const sceneBtns = [...document.querySelectorAll('button[data-scene]')];
const syncScene = () => sceneBtns.forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.scene === '2') === (sceneT > 0.5))));
sceneBtns.forEach((b) => b.addEventListener('click', () => { sceneT = b.dataset.scene === '2' ? 1 : 0; syncScene(); }));
syncScene();
const sndBtn = document.querySelector('[data-snd]');
sndBtn.addEventListener('click', () => {
  snd.wake();
  snd.set(!snd.on);
  sndBtn.setAttribute('aria-pressed', String(snd.on));
  sndBtn.textContent = snd.on ? 'Sound on' : 'Sound off';
});
document.getElementById('picker').addEventListener('pointerdown', () => snd.wake());
syncLook();

////////////////////////////////////////////////////////////////
//// LOOP
////////////////////////////////////////////////////////////////

const fit = () => {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 0.8 ? 58 : 42;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uAspect.value = innerWidth / innerHeight;
};
addEventListener('resize', fit);
fit();

const ray = new THREE.Raycaster();
const prevHit = new THREE.Vector3(), hitP = new THREE.Vector3(), _v = new THREE.Vector3(), _f = new THREE.Vector3();
const AIM = new THREE.Vector3(OASIS.x, OASIS.y + 3.2, OASIS.z);
const clock = new THREE.Timer();
const T0 = parseFloat(QS.get('t')) || 0;
let tt = 0, first = true, formS = 0;

renderer.setAnimationLoop(() => {
  clock.update();
  const dt = QS.has('freeze') ? 0 : Math.min(clock.getDelta(), 0.05);
  tt += dt;
  const t = tt + T0;
  uTime.value = t;
  uDt.value = Math.max(dt, 1 / 240);

  lookT += ((lookMode === 'dusk' ? 1 : 0) - lookT) * Math.min(1, dt * 1.6);
  applyLook(lookT);

  walk += ((walking ? 1 : 0) - walk) * Math.min(1, dt * (walking ? 0.9 : 0.55));
  const intro = sstep(0.5, 9, t);
  const auto = intro * (0.7 + 0.5 * Math.cos(t * Math.PI * 2 / 34));
  const formT = QS.has('form') ? parseFloat(QS.get('form')) : auto * (1 - walk);
  formS += (formT - formS) * Math.min(1, dt * 0.8);
  if (QS.has('form') && first) formS = formT;
  uForm.value = P.autoForm ? formS : P.form;
  const md = sceneT - uMorph.value;
  uMorph.value += Math.sign(md) * Math.min(Math.abs(md), dt * 0.22);
  if (isWebGL) {
    const want = uMorph.value > 0.5 ? 2 : 1;
    if (want !== glSet) { homeB.value.array.set(want === 2 ? h2Arr : h1Arr, SAND * 4); homeB.value.needsUpdate = true; glSet = want; }
  }
  uWind.value = 0.35 + walk * 3.5;
  uHeat.value = P.heat * (1 + walk * 0.8);

  view.yaw += (view.yawT - view.yaw) * Math.min(1, dt * 4);
  view.pitch += (view.pitchT - view.pitch) * Math.min(1, dt * 4);
  const sway = Math.sin(t * 0.21) * 0.025;
  const step = walk * 14;
  camera.position.set(0, EYE + Math.sin(t * 1.9) * 0.03 * walk, -step);
  _f.copy(AIM).sub(camera.position).normalize();
  const baseYaw = Math.atan2(_f.x, -_f.z), basePitch = Math.asin(_f.y);
  const yw = baseYaw + view.yaw + sway, pt = basePitch + view.pitch;
  _v.set(Math.sin(yw) * Math.cos(pt), Math.sin(pt), -Math.cos(yw) * Math.cos(pt)).add(camera.position);
  camera.lookAt(_v);
  camera.updateMatrixWorld();
  sky.position.copy(camera.position);

  {
    const e = camera.matrixWorld.elements;
    uCamR.value.set(e[0], e[1], e[2]).normalize();
    uCamU.value.set(e[4], e[5], e[6]).normalize();
    uCamF.value.set(-e[8], -e[9], -e[10]).normalize();
    uTanFov.value = Math.tan(THREE.MathUtils.degToRad(camera.fov) * 0.5);
    _v.copy(uSunDir.value).multiplyScalar(1500).add(camera.position).project(camera);
    uSunScr.value.set(0.5 + _v.x * 0.5, 0.5 - _v.y * 0.5);
    const front = uCamF.value.dot(uSunDir.value) > 0 ? 1 : 0;
    const edge = Math.max(Math.abs(_v.x), Math.abs(_v.y));
    uSunVis.value = front * sstep(1.25, 0.85, edge);
  }
  _v.set(OASIS.x, OASIS.y - 0.1, OASIS.z).project(camera);
  uHz.value = 0.5 - _v.y * 0.5;
  if (P.tiltFollow) { _v.set(OASIS.x, OASIS.y + 4.5, OASIS.z).project(camera); uTiltCenter.value = 0.5 - _v.y * 0.5; }

  if (QS.has('ptr') && first) { ndc.set(0.05, 0.05); }
  const hover = QS.has('ptr') || (performance.now() - ptr.last < 260 && ndc.x < 5 && !walking);
  uPtr.value += ((hover ? 1 : 0) - uPtr.value) * Math.min(1, dt * 6);
  if (QS.has('ptr')) uPtr.value = 1;
  ray.setFromCamera(ndc, camera);
  uRayO.value.copy(ray.ray.origin);
  uRayD.value.copy(ray.ray.direction);
  ray.ray.at(_v.copy(AIM).sub(ray.ray.origin).length(), hitP);
  uPtrVel.value.copy(hitP).sub(prevHit).clampLength(0, 2).multiplyScalar(0.6);
  prevHit.copy(hitP);

  renderer.compute(update);
  uCamPos.value.copy(camera.position);
  if (first && QS.has('settle')) { uDt.value = 1 / 8; for (let i = 0, n = parseInt(QS.get('settle')) || 60; i < n; i++) renderer.compute(update); }
  if (VOL) renderer.compute(volumePasses);
  snd.tick(dt, formS, walk, lookT);
  pipe.render();
  if (first) { first = false; document.getElementById('loading').classList.add('off'); window.__ready = true; }
});
window.__snd = snd;

  const pane = new Pane({ title: 'Day15 Mirage', expanded: false });
  pane.hidden = !QS.has('controls');
  addEventListener('keydown', (e) => { if (e.key === 'h' || e.key === 'H') pane.hidden = !pane.hidden; });
  const u = (f, node, label, min, max, step) => f.addBinding(node, 'value', { label, min, max, ...(step ? { step } : {}) });
  const col = (f, node, label) => f.addBinding(node, 'value', { label, color: { type: 'float' } });

  const fM = pane.addFolder({ title: 'Mirage', expanded: true });

  u(fS, uSandAlpha, 'opacity', 0, 1);
  u(fS, uRingSpeed, 'vortex speed', 0, 1.5);
  u(fS, uRingR, 'vortex radius', 2, 30);
  u(fS, uRingW, 'vortex width', 3, 25);
  u(fS, uSwirlSpeed, 'swirl', -6, 6);
  u(fS, uCurlAmp, 'folds', 0, 4);
  u(fS, uRelax, 'follow flow', 0.1, 6);
  u(fS, uSandSpring, 'cohesion', 0, 1.5);
  u(fS, uSpin, 'revolve', -0.15, 0.15);

  u(fS, uNearFade, 'lens fade', 0.7, 12);

  const fC = pane.addFolder({ title: 'Colour', expanded: false });

  col(fC, uTeal, 'turquoise');
  col(fC, uBlue, 'blue');
  col(fC, uPink, 'pink');
  col(fC, uLilac, 'lilac');

  const fP = pane.addFolder({ title: 'Pointer', expanded: false });
  u(fP, uPush, 'push', 0, 40);
  u(fP, uSwirl, 'swirl', -60, 60);
  u(fP, uDive, 'dive', -40, 40);
  u(fP, uDrag, 'drag', 0, 8);

  if (VOL) {
    const fV = pane.addFolder({ title: 'Self-shadow', expanded: false });
    u(fV, uShadow, 'amount', 0, 1);
    u(fV, uExt, 'density', 0, 15);
    u(fV, uVeil, 'depth veil', 0, 1);
  }

  const fA = pane.addFolder({ title: 'Heat & air', expanded: false });
  fA.addBinding(P, 'heat', { label: 'heat', min: 0, max: 3 });
  u(fA, uAirAmt, 'air shimmer', 0, 4);
  u(fA, uAirScale, 'cell size', 1, 20);
  u(fA, uAirRise, 'rise speed', 0, 3);
  u(fA, uAirChroma, 'colour split', 0, 2);
  u(fA, uAirSky, 'in the sky', 0, 1);
  u(fA, uAirFlick, 'flicker', 0, 3);
  u(fA, uMirror, 'mirror strip', 0, 1.5);

  const fX = pane.addFolder({ title: 'Postpro', expanded: false });
  fX.addBinding(P, 'exposure', { label: 'exposure', min: 0.2, max: 3 });
  fX.addBinding(bl.strength, 'value', { label: 'bloom', min: 0, max: 2 });
  u(fX, uVignette, 'vignette', 0, 1);
  u(fX, uVigSize, 'vignette size', 0, 1.2);
  u(fX, uVigSoft, 'vignette soft', 0.05, 2);
  u(fX, uVigRound, 'vignette round', 0, 1);
  u(fX, uGrain, 'grain', 0, 0.4);
  u(fX, uGrainSize, 'grain size', 0.5, 4);
  u(fX, uGrainFps, 'grain fps', 0, 60);
  u(fX, uGrainColor, 'grain colour', 0, 1);
  u(fX, uGrainShadows, 'grain in shadows', 0, 1);

  const fR = pane.addFolder({ title: 'Rainbow & flare', expanded: false });
  u(fR, uBow, 'rainbow', 0, 3);
  fR.addBinding(uBowAnti, 'value', { label: 'position', options: { 'around sun': 0, 'opposite sun': 1 } });
  u(fR, uBowScale, 'ring size', 0.15, 1.5);
  u(fR, uBowWidth, 'band width', 0.3, 4);
  u(fR, uBowSky, 'in the sky', 0, 1);
  u(fR, uBowPatch, 'patchiness', 0, 1);
  u(fR, uBowDark, 'dark band', 0, 0.6);
  u(fR, uBowHeat, 'heat wobble', 0, 8);
  u(fR, uBow2, 'second bow', 0, 1);
  u(fR, uFlareGain, 'flare gain', 0, 12);
  u(fR, uGhostCount, 'ghosts', 0, 8, 1);
  u(fR, uGhostDisp, 'dispersal', 0, 1.5);
  u(fR, uFlareBias, 'threshold bias', -6, 0);
  u(fR, uFlareScale, 'threshold scale', 0, 10);
  u(fR, uFlareBlur, 'blur', 0.25, 6);
  u(fR, uFlareChroma, 'chroma split', 0, 3);

  const fT = pane.addFolder({ title: 'Tilt-shift', expanded: false });
  u(fT, uTilt, 'amount', 0, 1);
  u(fT, uTiltBlur, 'blur px', 0, 40);
  fT.addBinding(P, 'tiltFollow', { label: 'focus on oasis' });
  u(fT, uTiltCenter, 'focus line', 0, 1);
  u(fT, uTiltWidth, 'sharp band', 0, 0.5);
  u(fT, uTiltSoft, 'falloff', 0.01, 0.8);
  u(fT, uTiltAngle, 'angle', -0.8, 0.8);
  u(fT, uTiltSat, 'saturation', -0.5, 1);
})();
