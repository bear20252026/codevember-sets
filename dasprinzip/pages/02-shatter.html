<script type="module">
import * as THREE from 'three/webgpu';
import {
	attribute, uniform, uniformArray, varying, vec2, vec3, vec4, float, sin, cos, dot, cross, normalize, mix, max, min, abs, length, atan, clamp, pow, step, select,
	positionGeometry, positionLocal, positionWorld, normalGeometry, transformNormalToView, smoothstep, color, texture
} from 'three/tsl';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';

const BUILD = 'v0.10-terraces-glass';
console.log( BUILD );

// ═══════════════════════════════════════════════════════════════════
//  renderer / scene / camera
// ═══════════════════════════════════════════════════════════════════

const renderer = new THREE.WebGPURenderer( { canvas: document.getElementById( 'c' ), antialias: true } );
renderer.setPixelRatio( Math.min( devicePixelRatio, 2 ) );
renderer.setSize( Math.max( innerWidth, 8 ), Math.max( innerHeight, 8 ) );
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

try { await renderer.init(); }
catch ( e ) {
	throw new Error( 'this browser could not start WebGPU or WebGL2' );
}

const scene = new THREE.Scene();
scene.background = new THREE.Color( 0xa8a7ad );
scene.fog = new THREE.Fog( 0xa8a7ad, 14, 40 );

const camera = new THREE.PerspectiveCamera( 24, innerWidth / innerHeight, 0.1, 60 );
const fitDistance = () => ( innerWidth / innerHeight < 0.8 ? 12.0 : 8.2 );
const camAz = THREE.MathUtils.degToRad( 36 ), camEl = THREE.MathUtils.degToRad( 36 );
const aimY = 0.5;
camera.position.set(
	fitDistance() * Math.cos( camEl ) * Math.sin( camAz ),
	aimY + fitDistance() * Math.sin( camEl ),
	fitDistance() * Math.cos( camEl ) * Math.cos( camAz )
);

const controls = new OrbitControls( camera, renderer.domElement );
controls.target.set( 0, aimY, 0 );
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 16;
controls.maxPolarAngle = 1.45;
controls.update();

// ═══════════════════════════════════════════════════════════════════
//  studio environment
// ═══════════════════════════════════════════════════════════════════

function studio() {

	const env = new THREE.Scene();
	const room = new THREE.MeshBasicNodeMaterial( { side: THREE.BackSide } );
	const y = positionWorld.normalize().y;
	const low = mix( color( 0x8d8c92 ), color( 0xc6c5ca ), smoothstep( - 0.2, 0.0, y ) );
	room.colorNode = mix( low, color( 0x77767c ), smoothstep( 0.0, 0.9, y ) );
	env.add( new THREE.Mesh( new THREE.BoxGeometry( 24, 24, 24 ), room ) );

	const DEG = Math.PI / 180;
	const panel = ( hex, intensity, az, el, w, h ) => {
		const m = new THREE.Mesh( new THREE.PlaneGeometry( 1, 1 ), new THREE.MeshBasicNodeMaterial( { color: 0xffffff } ) );
		m.material.color.set( hex ).multiplyScalar( intensity );
		m.position.set( Math.cos( el * DEG ) * Math.sin( az * DEG ), Math.sin( el * DEG ), Math.cos( el * DEG ) * Math.cos( az * DEG ) ).multiplyScalar( 9 );
		m.lookAt( 0, 0, 0 );
		m.scale.set( w, h, 1 );
		env.add( m );
	};
	panel( 0xfff6ec, 5.0, - 25, 72, 16, 2.5 );
	panel( 0xffffff, 2.0, 45, 12, 4, 12 );
	panel( 0xeef0ff, 2.5, - 150, 30, 3, 8 );
	panel( 0x050505, 1.0, - 60, 12, 12, 7 );

	const pmrem = new THREE.PMREMGenerator( renderer );
	return pmrem.fromScene( env, 0.02, 0.1, 100 ).texture;

}

scene.environment = studio();
scene.environmentIntensity = 1.0;

// ═══════════════════════════════════════════════════════════════════
//  parameters / uniforms
// ═══════════════════════════════════════════════════════════════════

const P = {
	height: 0.78, amplitude: 0.26, frequency: 2.53, tilt: 0.24, tiltPhase: 0.14, spin: 1.5708, travel: 0.0, lag: - 1.09, step: - 0.02,
	rings: 4, outerWall: 0.11, wall: 0.12, gap: 0.035, corner: 0.03, shardSize: 0.16,
	bevel: 0.024,
	glassColor: '#ece6e8', roughness: 0.11, transmission: 1.0, thickness: 0.46, ior: 1.81,
	attenuationColor: '#9c8479', attenuationDistance: 2.0, dispersion: 36.09, envIntensity: 1.4,
	clearcoat: 0.7, coatRough: 0.04, iridescence: 0.4, iridescenceIOR: 1.68, iridMin: 547.83, iridMax: 520, iridBands: 3.0, iridFlow: 0.15,
	shatterRadius: 0.72, fly: 0.36, through: - 0.85, scatter: 0.78, radial: 0.78, spin: 4.0, burst: 0.71, hold: 0.71, heal: 0.61, ripple: 0.35,
	ballSpeed: 11, gravity: 9.8, ballRadius: 0.09, ballColor: '#ece8e2', ballInner: '#b8a697', ballPieces: 14, ballBurst: 2.2, ballKeep: 0.35, ballSpin: 12, pieceLife: 1.2, pieceBounce: 0.3,
	sound: { on: true, volume: 0.8, drone: 1.0, impact: 1.0, freeze: 1.0, rewind: 1.0, reverb: 0.8 },
	floorCenter: '#c4c4c9', floorEdge: '#8a8990', shadow: 0.45, contact: 0.35,
};

const uTime = uniform( 0 );
const uH = uniform( P.height ), uA = uniform( P.amplitude ), uK = uniform( P.frequency );
const uTilt = uniform( P.tilt ), uTiltPhase = uniform( P.tiltPhase );
const uSpin = uniform( P.spin ), uTravel = uniform( P.travel ), uLag = uniform( P.lag ), uStep = uniform( P.step );
const uBevel = uniform( P.bevel );
const uContact = uniform( P.contact ), uShadow = uniform( P.shadow );
const uFloorC0 = uniform( new THREE.Color( P.floorCenter ) ), uFloorC1 = uniform( new THREE.Color( P.floorEdge ) );
const uIridMin = uniform( P.iridMin ), uIridMax = uniform( P.iridMax ), uIridBands = uniform( P.iridBands ), uIridFlow = uniform( P.iridFlow );

// ═══════════════════════════════════════════════════════════════════
//  wave field
// ═══════════════════════════════════════════════════════════════════

const info = attribute( 'aInfo', 'vec3' );
const edge = attribute( 'aEdge', 'vec4' );
const seed = attribute( 'aSeed', 'vec3' );
const rnd = attribute( 'aRand', 'vec4' );
const ring = info.z;
const waveAt = ( xz, tt ) => {
	const th = tt.mul( uSpin );
	const d = vec2( cos( th ), sin( th ) );
	const ta = th.add( uTiltPhase ).sub( ring.mul( uLag ).mul( 0.5 ) );
	const td = vec2( cos( ta ), sin( ta ) );
	const ph = dot( xz, d ).mul( uK ).sub( tt.mul( uTravel ) ).sub( ring.mul( uLag ) );
	const h = max( uH.add( uA.mul( sin( ph ) ) ).add( dot( xz, td ).mul( uTilt ) ).sub( ring.mul( uStep ) ), float( 0.04 ) );
	const sl = d.mul( uA.mul( uK ).mul( cos( ph ) ) ).add( td.mul( uTilt ) );
	return { h, sl };
};

// ═══════════════════════════════════════════════════════════════════
//  shatter: every shard turns about its own seed, flies, freezes, heals
//  while broken off, a shard keeps the wave shape from the moment of impact
// ═══════════════════════════════════════════════════════════════════

const MAX_IMPACTS = 4;
const impactHit = uniformArray( Array.from( { length: MAX_IMPACTS }, () => new THREE.Vector4( 0, - 100, 0, - 100 ) ), 'vec4' );
const impactDir = uniformArray( Array.from( { length: MAX_IMPACTS }, () => new THREE.Vector4( 0, 0, - 1, 0 ) ), 'vec4' );
const uRadius = uniform( P.shatterRadius ), uFly = uniform( P.fly ), uThrough = uniform( P.through ), uScatter = uniform( P.scatter );
const uRadial = uniform( P.radial );
const uSpinShard = uniform( P.spin ), uBurst = uniform( P.burst ), uHold = uniform( P.hold ), uHeal = uniform( P.heal ), uRipple = uniform( P.ripple );

const rotate = ( v, k, a ) => v.mul( cos( a ) ).add( cross( k, v ).mul( sin( a ) ) ).add( k.mul( dot( k, v ).mul( float( 1 ).sub( cos( a ) ) ) ) );

const impacts = [];
let detach = float( 0 ), frozenT = uTime;
for ( let i = 0; i < MAX_IMPACTS; i ++ ) {
	const hit = impactHit.element( i ), idr = impactDir.element( i );
	const pivotAtHit = vec3( seed.x, seed.y.mul( waveAt( seed.xz, hit.w ).h ), seed.z );
	const dist = length( pivotAtHit.sub( hit.xyz ) );
	const fall = float( 1 ).sub( smoothstep( uRadius.mul( 0.35 ), uRadius, dist ) ).mul( idr.w );
	const tau = uTime.sub( hit.w ).sub( dist.mul( uRipple ) );
	const back = smoothstep( uBurst.add( uHold ), uBurst.add( uHold ).add( uHeal ), tau );
	const held = fall.mul( step( hit.w, uTime ) ).mul( float( 1 ).sub( back ) );
	frozenT = select( held.greaterThan( detach ), hit.w, frozenT );
	detach = max( detach, held );
	impacts.push( { hit, idr, pivotAtHit, dist, fall, tau, back } );
}

const live = waveAt( positionGeometry.xz, uTime ), frozen = waveAt( positionGeometry.xz, frozenT );
const height = mix( live.h, frozen.h, detach );
const slope = mix( live.sl, frozen.sl, detach );
const capNormal = normalize( vec3( slope.x.negate(), 1, slope.y.negate() ) );

const outward = normalize( vec3( edge.z, 0, edge.w ) );
const roundOut = smoothstep( edge.y.sub( uBevel ), edge.y, edge.x );
const roundIn = smoothstep( uBevel, 0, edge.x );
const capRounded = normalize( capNormal.add( outward.mul( roundOut.sub( roundIn ).mul( 1.6 ) ) ) );
const fromTop = height.mul( float( 1 ).sub( info.x ) );

let ringBands = [];

function buildTerraces() {

	const pos = [], nrm = [], inf = [], edg = [], idx = [];
	let vi = 0;

	const roundedLoop = ( c, r, arcSeg, sideSeg ) => {
		const pts = [];
		const centers = [ [ 1, 1 ], [ - 1, 1 ], [ - 1, - 1 ], [ 1, - 1 ] ];
		for ( let k = 0; k < 4; k ++ ) {
			const [ sx, sz ] = centers[ k ];
			for ( let j = 0; j <= arcSeg; j ++ ) {
				const ang = ( k + j / arcSeg ) * Math.PI / 2;
				const nx = Math.cos( ang ), nz = Math.sin( ang );
				pts.push( [ sx * c + r * nx, sz * c + r * nz, nx, nz ] );
			}
			const [ ex, ez, enx, enz ] = pts[ pts.length - 1 ];
			const [ tx, tz ] = centers[ ( k + 1 ) % 4 ];
			const angN = ( k + 1 ) * Math.PI / 2;
			const fx = tx * c + r * Math.cos( angN ), fz = tz * c + r * Math.sin( angN );
			for ( let i = 1; i < sideSeg; i ++ ) {
				const u = i / sideSeg;
				pts.push( [ ex + ( fx - ex ) * u, ez + ( fz - ez ) * u, enx, enz ] );
			}
		}
		return pts;
	};

	const band = ( A, B, liftA, liftB, acrossA, acrossB, normalOf, ringId, cap, w, rows ) => {
		const n = A.length, base = vi;
		for ( let r = 0; r <= rows; r ++ ) {
			const f = r / rows, lift = liftA + ( liftB - liftA ) * f, across = acrossA + ( acrossB - acrossA ) * f;
			for ( let i = 0; i < n; i ++ ) {
				const pa = A[ i ], pb = B[ i ];
				const x = pa[ 0 ] + ( pb[ 0 ] - pa[ 0 ] ) * f, z = pa[ 1 ] + ( pb[ 1 ] - pa[ 1 ] ) * f;
				const nn = normalOf( pa );
				pos.push( x, lift, z ); nrm.push( nn[ 0 ], nn[ 1 ], nn[ 2 ] );
				inf.push( lift, cap, ringId ); edg.push( across, w, pa[ 2 ], pa[ 3 ] ); vi ++;
			}
		}
		const Pt = ( k ) => [ pos[ 3 * k ], pos[ 3 * k + 1 ], pos[ 3 * k + 2 ] ];
		const p0 = Pt( base ), p1 = Pt( base + 1 ), p2 = Pt( base + n );
		const u = [ p1[ 0 ] - p0[ 0 ], p1[ 1 ] - p0[ 1 ], p1[ 2 ] - p0[ 2 ] ], v = [ p2[ 0 ] - p0[ 0 ], p2[ 1 ] - p0[ 1 ], p2[ 2 ] - p0[ 2 ] ];
		const cr = [ u[ 1 ] * v[ 2 ] - u[ 2 ] * v[ 1 ], u[ 2 ] * v[ 0 ] - u[ 0 ] * v[ 2 ], u[ 0 ] * v[ 1 ] - u[ 1 ] * v[ 0 ] ];
		const n0 = normalOf( A[ 0 ] );
		const flip = cr[ 0 ] * n0[ 0 ] + cr[ 1 ] * n0[ 1 ] + cr[ 2 ] * n0[ 2 ] < 0;
		for ( let r = 0; r < rows; r ++ ) for ( let i = 0; i < n; i ++ ) {
			const a = base + r * n + i, b = base + r * n + ( i + 1 ) % n, c = a + n, d = b + n;
			if ( flip ) idx.push( a, d, b, a, c, d ); else idx.push( a, b, d, a, d, c );
		}
	};

	const ring = ( a, w, ringId ) => {
		const ro = Math.min( P.corner, a * 0.5 ), ri = Math.min( 0.006, Math.max( a - w, 0 ) * 0.5 );
		const arcSeg = 8, sideSeg = Math.max( 12, Math.round( 80 * a ) );
		const outer = roundedLoop( a - ro, ro, arcSeg, sideSeg );
		const inner = roundedLoop( a - w - ri, ri, arcSeg, sideSeg );

			const aPos = new Float32Array( nv * 3 ), aNrm = new Float32Array( nv * 3 ), aInf = new Float32Array( nv * 3 ), aEdg = new Float32Array( nv * 4 );
			const aSeed = new Float32Array( nv * 3 ), aRand = new Float32Array( nv * 4 );
			let o = 0;
			for ( const t of tris ) {
				let mx = 0, my = 0, mz = 0;
				for ( let k = 0; k < 3; k ++ ) { const q = idx[ t + k ]; mx += pos[ 3 * q ]; my += pos[ 3 * q + 1 ]; mz += pos[ 3 * q + 2 ]; }
				const sd = seedOf( mx / 3, my / 3, mz / 3, sp.id );
				const r0 = hash( sd[ 3 ], sd[ 4 ], sd[ 5 ], 31 + sp.id ) * 2 - 1, r1 = hash( sd[ 3 ], sd[ 4 ], sd[ 5 ], 47 + sp.id ) * 2 - 1;
				const r2 = hash( sd[ 3 ], sd[ 4 ], sd[ 5 ], 59 + sp.id ) * 2 - 1, r3 = hash( sd[ 3 ], sd[ 4 ], sd[ 5 ], 71 + sp.id );
				for ( let k = 0; k < 3; k ++ ) {
					const q = idx[ t + k ];
					for ( let c = 0; c < 3; c ++ ) { aPos[ o * 3 + c ] = pos[ q * 3 + c ]; aNrm[ o * 3 + c ] = nrm[ q * 3 + c ]; aInf[ o * 3 + c ] = inf[ q * 3 + c ]; }
					for ( let c = 0; c < 4; c ++ ) aEdg[ o * 4 + c ] = edg[ q * 4 + c ];
					aSeed[ o * 3 ] = sd[ 0 ]; aSeed[ o * 3 + 1 ] = Math.min( Math.max( sd[ 1 ], 0 ), 1 ); aSeed[ o * 3 + 2 ] = sd[ 2 ];
					aRand[ o * 4 ] = r0; aRand[ o * 4 + 1 ] = r1; aRand[ o * 4 + 2 ] = r2; aRand[ o * 4 + 3 ] = r3;
					o ++;
				}
			}
			const g = new THREE.BufferGeometry();
			g.setAttribute( 'position', new THREE.BufferAttribute( aPos, 3 ) );
			g.setAttribute( 'normal', new THREE.BufferAttribute( aNrm, 3 ) );
			g.setAttribute( 'aInfo', new THREE.BufferAttribute( aInf, 3 ) );
			g.setAttribute( 'aEdge', new THREE.BufferAttribute( aEdg, 4 ) );
			g.setAttribute( 'aSeed', new THREE.BufferAttribute( aSeed, 3 ) );
			g.setAttribute( 'aRand', new THREE.BufferAttribute( aRand, 4 ) );
			g.boundingSphere = new THREE.Sphere( new THREE.Vector3( 0, 0.5, 0 ), 4 );
			pieces.push( { ring: sp.id, nx: dirs[ s ][ 0 ], nz: dirs[ s ][ 1 ], a: sp.a, geometry: g } );
		}
	}
	ringBands = spans.map( ( sp ) => ( { id: sp.id, outer: sp.a + sp.w * 0.5, inner: sp.a - sp.w * 0.5 } ) );
	return pieces;

}

const heightCPU = ( x, z, r, t ) => {

function rayHit( ray, t ) {

		if ( p.y < 0 ) return null;
		const m = Math.max( Math.abs( p.x ), Math.abs( p.z ) );
		if ( m > 1 ) continue;
		for ( const b of ringBands ) if ( m <= b.outer && m >= b.inner && p.y <= heightCPU( p.x, p.z, b.id, t ) ) { const q = p.clone(); q.ring = b.id; return q; }

}

function throwBall( clientX, clientY ) {
	const rect = renderer.domElement.getBoundingClientRect();

function updateBalls( dt ) {
	for ( let i = balls.length - 1; i >= 0; i -- ) {
		const b = balls[ i ];
		b.age += dt;
		b.vel.y -= P.gravity * dt;
		b.mesh.position.addScaledVector( b.vel, dt );
		if ( ! b.done && b.age >= b.T ) {

			if ( b.vel.length() > 1.5 ) { spawnBallShatter( b ); audio.ballBreak(); scene.remove( b.mesh ); balls.splice( i, 1 ); continue; }
			b.vel.y *= - 0.5;

		if ( b.age > life - 0.5 ) b.mesh.scale.setScalar( r * Math.max( 0, ( life - b.age ) / 0.5 ) );

}

function mulberry32( a ) {
	return function () {
		a |= 0; a = a + 0x6D2B79F5 | 0;

		t = t + Math.imul( t ^ t >>> 7, 61 | t ) ^ t;
		return ( ( t ^ t >>> 14 ) >>> 0 ) / 4294967296;
	};
}

function buildFracture( cells, seedN ) {
	const rr = mulberry32( seedN );
	const inBall = () => { for ( ;; ) { const v = new THREE.Vector3( rr() * 2 - 1, rr() * 2 - 1, rr() * 2 - 1 ); if ( v.lengthSq() <= 1 ) return v; } };
	const seeds = Array.from( { length: cells }, () => inBall().multiplyScalar( 0.85 ) );
	const pts = seeds.map( () => [] );
	const nearest2 = ( p ) => {
		let a = - 1, b = - 1, da = 1e9, db = 1e9;
		for ( let i = 0; i < seeds.length; i ++ ) { const d = p.distanceToSquared( seeds[ i ] ); if ( d < da ) { db = da; b = a; da = d; a = i; } else if ( d < db ) { db = d; b = i; } }
		return [ a, b ];

	for ( let i = 0; i < NS; i ++ ) {
		const y = 1 - ( i + 0.5 ) * 2 / NS, r = Math.sqrt( 1 - y * y ), th = ga * i;
		const p = new THREE.Vector3( Math.cos( th ) * r, y, Math.sin( th ) * r );

		const [ a, b ] = nearest2( p );
		m.addVectors( seeds[ a ], seeds[ b ] ).multiplyScalar( 0.5 );
		n.subVectors( seeds[ b ], seeds[ a ] ).normalize();
		const q = p.clone().addScaledVector( n, - p.clone().sub( m ).dot( n ) );
		if ( q.lengthSq() > 1 ) continue;
		const [ a2, b2 ] = nearest2( q );
		if ( ! ( ( a2 === a || a2 === b ) && ( b2 === a || b2 === b ) ) ) continue;
		pts[ a ].push( q ); pts[ b ].push( q.clone() );
	}
	const out = [];
	for ( let i = 0; i < cells; i ++ ) {
		if ( pts[ i ].length < 8 ) continue;
		let g;
		try { g = new ConvexGeometry( pts[ i ] ); } catch ( e ) { continue; }
		const pos = g.attributes.position, nor = g.attributes.normal;
		const shell = new Float32Array( pos.count ), v = new THREE.Vector3();
		for ( let f = 0; f < pos.count; f += 3 ) {
			let onShell = true;
			for ( let j = 0; j < 3; j ++ ) { v.fromBufferAttribute( pos, f + j ); if ( v.length() < 0.975 ) onShell = false; }
			for ( let j = 0; j < 3; j ++ ) {

				if ( onShell ) { v.fromBufferAttribute( pos, f + j ).normalize(); nor.setXYZ( f + j, v.x, v.y, v.z ); }
			}
		}
		g.setAttribute( 'shell', new THREE.BufferAttribute( shell, 1 ) );
		g.computeBoundingBox();
		const c = new THREE.Vector3(); g.boundingBox.getCenter( c );
		g.translate( - c.x, - c.y, - c.z );
		g.computeBoundingSphere();
		out.push( { geometry: g, center: c } );
	}
	return out;
}

let fractureSets = [];

pieceMat.colorNode = mix( uBallInner, uBallColor, attribute( 'shell', 'float' ) );
const ballShatters = [];

function spawnBallShatter( b ) {
	if ( ! fractureSets.length ) {
		const cells = Math.max( 3, Math.min( 40, Math.round( P.ballPieces ) ) );
		fractureSets = [ buildFracture( cells, 11 ), buildFracture( cells, 29 ) ];
	}
	const set = fractureSets[ Math.floor( Math.random() * fractureSets.length ) ];
	const r = P.ballRadius, q = b.mesh.quaternion;
	const parts = set.map( ( f ) => {
		const mesh = new THREE.Mesh( f.geometry, pieceMat );
		const c = f.center.clone().applyQuaternion( q );
		mesh.position.copy( b.mesh.position ).addScaledVector( c, r );
		mesh.quaternion.copy( q );
		mesh.scale.setScalar( r );
		mesh.castShadow = true;
		mesh.layers.enable( 1 );
		scene.add( mesh );
		const out = c.lengthSq() > 1e-6 ? c.clone().normalize() : new THREE.Vector3( 0, 1, 0 );
		const vel = b.vel.clone().multiplyScalar( P.ballKeep ).addScaledVector( out, P.ballBurst * ( 0.5 + Math.random() ) );
		const axis = new THREE.Vector3( Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5 ).normalize();

	const life = Math.max( 0.1, P.pieceLife ), r = P.ballRadius;

		const fade = 1 - x * x * ( 3 - 2 * x );
		for ( const pc of sh.parts ) {
			const m = pc.mesh;
			pc.vel.y -= P.gravity * dt;
			m.position.addScaledVector( pc.vel, dt );
			if ( m.position.y < r * 0.35 ) {

// ═══════════════════════════════════════════════════════════════════
//  sound: "time glass"
//  every ring is a rubbed wine glass tuned in stacked fifths, swelling as its crest comes round;
//  a hit records its own crash, tape-stops into a frozen grain shimmer while the shards hang,
//  then plays the crash backwards so the glass rewinds itself into one piece
// ═══════════════════════════════════════════════════════════════════

const audio = ( () => {

	const S = () => P.sound;
	const RING_HZ = [ 110, 164.81, 246.94, 369.99, 554.37, 830.61 ];
	let ctx = null, ready = false;
	let master, bus, revIn, droneBus, voices = [];

	function impulse( seconds, bright ) {
		const n = Math.floor( ctx.sampleRate * seconds ), b = ctx.createBuffer( 2, n, ctx.sampleRate );

		// ═══════════════════════════════════════════════════════════════════

		// ═══════════════════════════════════════════════════════════════════

	g( 'transmission', { min: 0, max: 1 } );

	g( 'ior', { min: 1, max: 2.333 } );
	g( 'attenuationColor', { label: 'attenuation colour' } );
	g( 'attenuationDistance', { min: 0, max: 3, label: 'attenuation dist.' } );
	g( 'dispersion', { min: 0, max: 40, label: 'dispersion (rainbow)' } );
	g( 'envIntensity', { min: 0, max: 4, label: 'reflections' } );
	g( 'clearcoat', { min: 0, max: 1 } );
	g( 'coatRough', { min: 0, max: 1, label: 'coat rough' } );

	const fIrid = pane.addFolder( { title: 'Iridescence', expanded: false } );
	const ir = ( k, o ) => fIrid.addBinding( P, k, o ).on( 'change', applyGlass );
	ir( 'iridescence', { min: 0, max: 1, label: 'amount' } );
	ir( 'iridescenceIOR', { min: 1, max: 2.333, label: 'film IOR' } );
	ir( 'iridMin', { min: 0, max: 1200, label: 'film min (nm)' } );
	ir( 'iridMax', { min: 0, max: 1200, label: 'film max (nm)' } );
	ir( 'iridBands', { min: 0, max: 12, label: 'bands' } );
	ir( 'iridFlow', { min: - 1, max: 1, label: 'flow' } );

	const fShatter = pane.addFolder( { title: 'Shatter', expanded: false } );
	bind( fShatter, 'shatterRadius', uRadius, { min: 0.1, max: 2, label: 'break radius' } );
	bind( fShatter, 'fly', uFly, { min: 0, max: 3, label: 'fly distance' } );
	bind( fShatter, 'through', uThrough, { min: - 1, max: 1, label: 'toward cam ↔ through' } );
	bind( fShatter, 'scatter', uScatter, { min: 0, max: 3, label: 'all directions' } );
	bind( fShatter, 'radial', uRadial, { min: 0, max: 3, label: 'out from hit' } );
	bind( fShatter, 'spin', uSpinShard, { min: 0, max: 8, label: 'shard spin' } );
	bind( fShatter, 'burst', uBurst, { min: 0.05, max: 2, label: 'burst (s)' } );
	bind( fShatter, 'hold', uHold, { min: 0, max: 5, label: 'freeze (s)' } );
	bind( fShatter, 'heal', uHeal, { min: 0.1, max: 4, label: 'heal (s)' } );
	bind( fShatter, 'ripple', uRipple, { min: 0, max: 2, label: 'ripple delay' } );
	fShatter.addBinding( P, 'shardSize', { min: 0.06, max: 0.5, label: 'shard size' } ).on( 'change', rebuild );
	fShatter.addBinding( P, 'ballSpeed', { min: 3, max: 30, label: 'ball speed' } );
	fShatter.addBinding( P, 'gravity', { min: 0, max: 20 } );
	fShatter.addBinding( P, 'ballRadius', { min: 0.03, max: 0.3, label: 'ball size' } );
	fShatter.addBinding( P, 'ballColor', { label: 'ball colour' } ).on( 'change', ( e ) => { ballMat.color.set( e.value ); uBallColor.value.set( e.value ); } );
	fShatter.addBinding( P, 'ballInner', { label: 'ball inside' } ).on( 'change', ( e ) => uBallInner.value.set( e.value ) );
	fShatter.addBinding( P, 'ballPieces', { min: 3, max: 40, step: 1, label: 'ball pieces' } ).on( 'change', () => { fractureSets = []; } );
	fShatter.addBinding( P, 'ballBurst', { min: 0, max: 8, label: 'ball burst' } );
	fShatter.addBinding( P, 'ballSpin', { min: 0, max: 30, label: 'piece spin' } );
	fShatter.addBinding( P, 'pieceLife', { min: 0.2, max: 4, label: 'piece life (s)' } );

	const fSound = pane.addFolder( { title: 'Sound', expanded: false } );
	const sb = ( k, o ) => fSound.addBinding( P.sound, k, o ).on( 'change', () => { if ( P.sound.on ) audio.unlock(); audio.apply(); } );
	sb( 'on', { label: 'sound on' } );
	sb( 'volume', { min: 0, max: 1.5 } );
	sb( 'drone', { min: 0, max: 3, label: 'singing glasses' } );
	sb( 'impact', { min: 0, max: 3, label: 'crash + ball' } );
	sb( 'freeze', { min: 0, max: 3, label: 'frozen shimmer' } );
	sb( 'rewind', { min: 0, max: 3, label: 'rewind' } );
	sb( 'reverb', { min: 0, max: 2, label: 'glass hall' } );

	const fFloor = pane.addFolder( { title: 'Floor', expanded: false } );
	bind( fFloor, 'shadow', uShadow, { min: 0, max: 1, label: 'cast shadow' } );
	bind( fFloor, 'contact', uContact, { min: 0, max: 1, label: 'contact shadow' } );
	fFloor.addBinding( P, 'floorCenter', { label: 'floor centre' } ).on( 'change', ( e ) => uFloorC0.value.set( e.value ) );
	fFloor.addBinding( P, 'floorEdge', { label: 'floor edge' } ).on( 'change', ( e ) => uFloorC1.value.set( e.value ) );

} catch ( e ) { console.warn( 'Tweakpane unavailable', e ); }

// ═══════════════════════════════════════════════════════════════════
//  resize guard
// ═══════════════════════════════════════════════════════════════════

const layerRT = new THREE.RenderTarget( 8, 8, { type: THREE.HalfFloatType, samples: 4 } );
const present = new THREE.QuadMesh( new THREE.MeshBasicNodeMaterial( { colorNode: texture( layerRT.texture ) } ) );
renderer.autoClear = false;
renderer.setClearColor( 0xa8a7ad, 1 );

function drawLayered() {
	glassKey.position.copy( key.position );
	glassScene.environment = scene.environment;
	glassScene.environmentIntensity = scene.environmentIntensity;
	renderer.setRenderTarget( layerRT );
	renderer.clear();
	renderer.render( scene, camera );
	const cx = camera.position.x, cz = camera.position.z;
	const rings = pieces.reduce( ( m, p ) => Math.max( m, p.ring ), 0 );
	const pass = ( r, front ) => {
		let any = false;
		for ( const p of pieces ) {
			const facing = p.nx * ( cx - p.nx * p.a ) + p.nz * ( cz - p.nz * p.a ) > 0;
			p.mesh.visible = p.ring === r && facing === front;
			any = any || p.mesh.visible;
		}
		if ( any ) renderer.render( glassScene, camera );
	};
	for ( let r = 0; r <= rings; r ++ ) pass( r, false );
	for ( let r = rings; r >= 0; r -- ) pass( r, true );
	renderer.setRenderTarget( null );
	renderer.clear();
	present.render( renderer );
}

const MIN_PX = 8;
const viewOK = () => innerWidth >= MIN_PX && innerHeight >= MIN_PX;
let sizeDirty = true;
addEventListener( 'resize', () => { sizeDirty = true; } );
function applySize() {
	if ( ! viewOK() ) return false;
	camera.aspect = innerWidth / innerHeight;
	camera.updateProjectionMatrix();
	renderer.setSize( innerWidth, innerHeight );
	const px = renderer.getDrawingBufferSize( new THREE.Vector2() );
	layerRT.setSize( px.x, px.y );
	sizeDirty = false;
	return true;
}

// ═══════════════════════════════════════════════════════════════════
//  render loop
// ═══════════════════════════════════════════════════════════════════

const timer = new THREE.Timer();
timer.connect( document );
const qt = parseFloat( new URLSearchParams( location.search ).get( 't' ) || 'NaN' );
let t = 0;
let firstFrame = true;

renderer.setAnimationLoop( () => {

	timer.update();
	if ( ! viewOK() ) return;
	if ( sizeDirty && ! applySize() ) return;
	const dt = Math.min( timer.getDelta(), 1 / 30 );
	if ( firstFrame ) { firstFrame = false; document.getElementById( 'loader' ).classList.add( 'hidden' ); }
	t = isNaN( qt ) ? t + dt : qt;
	uTime.value = t;
	updateBalls( dt );
	updateBallShatters( dt );
	{
		const ax = camera.position.x, az = camera.position.z, len = Math.hypot( ax, az ) || 1;
		const levels = ringBands.map( ( b ) => {
			const r = ( b.outer + b.inner ) * 0.5, x = ax / len * r, z = az / len * r;
			const h = heightCPU( x, z, b.id, t ), lo = P.height - P.amplitude - P.tilt, hi = P.height + P.amplitude + P.tilt;
			const k = Math.min( 1, Math.max( 0, ( h - lo ) / Math.max( 0.01, hi - lo ) ) );
			return Math.pow( k, 2.2 );
		} );
		audio.frame( levels );
	}
	controls.update( dt );
	drawLayered();

} );
</script>
