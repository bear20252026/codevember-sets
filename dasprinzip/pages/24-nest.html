<script type="module">
import * as THREE from 'three/webgpu';
import {
  Fn, uniform, float, vec2, vec3, vec4, attribute, instancedBufferAttribute,
  dot, normalize, mix, smoothstep, max, min, abs, fract, floor, length, pow, exp, clamp, mod,
  sin, cos, uv, step, positionLocal, positionWorld, normalWorld, cameraPosition, screenUV, pass, reflector, fog, rangeFogFactor, color, positionWorldDirection, screenSize,
  instanceIndex, normalLocal, varying, select
} from 'three/tsl';
import { bloom } from 'three/addons/tsl/display/BloomNode.js';

const BUILD = 'v0.20.1-gale-default';
console.log('%c' + BUILD, 'color:#dfe6f5');

////////////////////////////////////////////////////////////////
//// PARAMS
////////////////////////////////////////////////////////////////

const QS = new URLSearchParams(location.search);
const LOWQ = QS.has('low') || /Android|iPhone|iPad/i.test(navigator.userAgent);
const Q = LOWQ ? 0.55 : 1;
const TARGET = new THREE.Vector3(0, 0.05, 0);
const GLOW_C = new THREE.Vector3(0, 4.2, 2.4);

const uTime = uniform(0);
const uGale = uniform(0);
const uShake = uniform(0);
const uPulse = uniform(0);
const uAspect = uniform(1);

////////////////////////////////////////////////////////////////
//// RANDOM / CPU NOISE
////////////////////////////////////////////////////////////////

let _s = 20261121;
const R = () => { _s |= 0; _s = _s + 0x6D2B79F5 | 0; let t = Math.imul(_s ^ _s >>> 15, 1 | _s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const RR = (a, b) => a + (b - a) * R();
const hc = (x, y, z) => { const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return s - Math.floor(s); };
const vnc = (x, y, z) => {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  const fx = x - ix, fy = y - iy, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy), uz = fz * fz * (3 - 2 * fz);
  const l = (a, b, t) => a + (b - a) * t;
  const c = (i, j, k) => hc(ix + i, iy + j, iz + k);
  return l(l(l(c(0, 0, 0), c(1, 0, 0), ux), l(c(0, 1, 0), c(1, 1, 0), ux), uy), l(l(c(0, 0, 1), c(1, 0, 1), ux), l(c(0, 1, 1), c(1, 1, 1), ux), uy), uz) * 2 - 1;
};

////////////////////////////////////////////////////////////////
//// GPU NOISE
////////////////////////////////////////////////////////////////

const hash13 = Fn(([q]) => {
  const p3 = fract(q.mul(0.1031)).toVar();
  p3.addAssign(dot(p3, p3.zyx.add(31.32)));
  return fract(p3.x.add(p3.y).mul(p3.z));
}).setLayout({ name: 'h13', type: 'float', inputs: [{ name: 'q', type: 'vec3' }] });

const vn = Fn(([x]) => {
  const i = floor(x);
  const f = fract(x);
  const u = f.mul(f).mul(f.mul(-2.0).add(3.0));
  const a = hash13(i);
  const b = hash13(i.add(vec3(1, 0, 0)));
  const c = hash13(i.add(vec3(0, 1, 0)));
  const d = hash13(i.add(vec3(1, 1, 0)));
  const e = hash13(i.add(vec3(0, 0, 1)));
  const g = hash13(i.add(vec3(1, 0, 1)));
  const h = hash13(i.add(vec3(0, 1, 1)));
  const k = hash13(i.add(vec3(1, 1, 1)));
  const z0 = mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
  const z1 = mix(mix(e, g, u.x), mix(h, k, u.x), u.y);
  return mix(z0, z1, u.z).mul(2.0).sub(1.0);
}).setLayout({ name: 'vn', type: 'float', inputs: [{ name: 'x', type: 'vec3' }] });

const fbm3 = Fn(([p]) => {
  const v = vn(p).mul(0.55).toVar();
  v.addAssign(vn(p.mul(2.11).add(vec3(5.3, 1.2, 8.8))).mul(0.3));
  v.addAssign(vn(p.mul(4.37).add(vec3(2.6, 6.1, 3.3))).mul(0.15));
  return v;
}).setLayout({ name: 'fbm3', type: 'float', inputs: [{ name: 'p', type: 'vec3' }] });

const PI = Math.PI;

// silk light: bright near the glowing cocoon, falling off into the grey
const silkLight = (wp) => {
  const d = wp.sub(vec3(GLOW_C.x, GLOW_C.y, GLOW_C.z));
  return exp(dot(d, d).mul(-1.0 / 11.0)).mul(0.6).add(exp(dot(d, d).mul(-1.0 / 30.0)).mul(0.3)).add(0.06);
};

// shared wind so ribbons and their threads move together
const windOff = (v, seed, amp) => {
  const t = uTime;
  const g = uGale.mul(2.2).add(1.0);
  const sp = uGale.mul(1.1).add(0.6);
  const env = sin(v.mul(PI));
  const x = sin(t.mul(sp.mul(0.55)).add(v.mul(4.0)).add(seed)).mul(0.6).add(sin(t.mul(sp.mul(1.3)).add(v.mul(9.0)).add(seed.mul(2.1))).mul(0.22).mul(g));
  const y = sin(t.mul(sp.mul(0.4)).add(v.mul(3.0)).add(seed.mul(1.7))).mul(0.3);
  const z = cos(t.mul(sp.mul(0.5)).add(v.mul(5.0)).add(seed.mul(0.7))).mul(0.5);
  const sh = sin(t.mul(17.0).add(v.mul(30.0)).add(seed.mul(3.0))).mul(uShake).mul(0.35);
  return vec3(x.add(sh), y.add(sh.mul(0.5)), z.add(sh.mul(0.4))).mul(amp.mul(env).mul(g));
};

////////////////////////////////////////////////////////////////
//// RENDERER
////////////////////////////////////////////////////////////////

const renderer = new THREE.WebGPURenderer({ antialias: false, forceWebGL: QS.has('webgl') });
const PR = Math.min(window.devicePixelRatio, LOWQ ? 1.5 : 2) * (parseFloat(QS.get('scale')) || 1);
renderer.setPixelRatio(PR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
try { await renderer.init(); } catch (e) {
  const el = document.getElementById('err'); el.style.display = 'grid'; el.textContent = 'This browser could not start WebGPU / WebGL2.'; throw e;
}

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.05, 120);

////////////////////////////////////////////////////////////////
//// FOG WORLD
////////////////////////////////////////////////////////////////

const FOG = new THREE.Color(0.6, 0.615, 0.65);
scene.fogNode = fog(mix(color(FOG), vec3(0.22, 0.226, 0.245), smoothstep(5.0, 22.0, positionWorld.y)), rangeFogFactor(9.0, 52.0));
scene.backgroundNode = Fn(() => {
  // plain sky: grey at the horizon, falling off to a very dark grey overhead
  const el = normalize(positionWorldDirection).y;
  const k = smoothstep(-0.02, 0.55, el);
  const mid = mix(vec3(0.6, 0.615, 0.65), vec3(0.28, 0.287, 0.305), smoothstep(0.0, 0.5, k));
  return mix(mid, vec3(0.12, 0.123, 0.135), smoothstep(0.45, 1.0, k));
})();
{
  const W = 64, H = 32, d = new Float32Array(W * H * 4);
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const v = 1 - j / (H - 1);
    const sky = v > 0.5 ? 0.85 - 0.6 * Math.pow((v - 0.5) * 2, 0.7) + 0.5 * Math.exp(-((v - 0.62) ** 2) / 0.004) : 0.05 + 0.75 * Math.pow(v * 2, 3);
    d.set([sky * 0.97, sky * 0.99, sky * 1.04, 1], (j * W + i) * 4);
  }
  const env = new THREE.DataTexture(d, W, H, THREE.RGBAFormat, THREE.FloatType);
  env.mapping = THREE.EquirectangularReflectionMapping; env.needsUpdate = true;
  scene.environment = env;
  scene.environmentIntensity = 0.16;
if (QS.has('noenv')) scene.environment = null;
if (QS.has('nofog')) scene.fogNode = null;
}
scene.add(new THREE.HemisphereLight(0xdfe4ee, 0x15171c, 0.25));
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(-3, 10, -6); scene.add(sun);

////////////////////////////////////////////////////////////////
//// NEST RIG
////////////////////////////////////////////////////////////////

// ---- one construct: irregular trunks merging into a single vaulted canopy (heightfield over the water)
const COLS = [[-6.0, -1.2], [6.3, -2.0]];
{
  const sp = 8.4;
  for (let j = -6; j <= 2; j++) for (let i = -3; i <= 3; i++) {
    const x = (i + (j & 1 ? 0.5 : 0)) * sp + RR(-1.8, 1.8), z = j * sp * 0.86 + 1.0 + RR(-1.8, 1.8);
    if (Math.hypot(x, z - 3) < 5.2 || Math.hypot(x, z - 11) < 6) continue;
    if (Math.abs(x) < 3.0 && z > -15) continue;
    if (COLS.some((c) => Math.hypot(c[0] - x, c[1] - z) < 5.2)) continue;
    COLS.push([x, z]);
  }
}
const colD = (x, z) => { let d = 1e9, k = 0; for (let i = 0; i < COLS.length; i++) { const e = Math.hypot(COLS[i][0] - x, COLS[i][1] - z); if (e < d) { d = e; k = i; } } return [d, k]; };
const Hs = (x, z) => {
  const [d] = colD(x, z);
  const t = (d - 0.36 - 0.1 * vnc(x * 0.9, z * 0.9, 3)) / 1.6;
  const crown = 9.6 + 1.6 * vnc(x * 0.07, z * 0.07, 2) + 1.1 * vnc(x * 0.2, z * 0.2, 8) + 1.6 * Math.max(0, vnc(x * 0.11, z * 0.11, 13));
  const y = t < 0 ? t * 7 : crown * (1 - Math.exp(-Math.pow(t, 1.22)));
  return Math.max(-1.8, y) + vnc(x * 0.35, z * 0.35, 5) * 0.35 * Math.min(1, Math.max(0, t));
};
const Hn = (x, z) => { const e = 0.02; return new THREE.Vector3(-(Hs(x + e, z) - Hs(x - e, z)) / (2 * e), 1, -(Hs(x, z + e) - Hs(x, z - e)) / (2 * e)).normalize(); };

const NEST_PIVOT = new THREE.Vector3(0, Hs(0, 2.4) - 0.15, 2.4);
const NEST_S = 0.85;
const NEST_Y = 4.1;
const nestPivot = new THREE.Group(); nestPivot.position.copy(NEST_PIVOT); scene.add(nestPivot);
const nestG = new THREE.Group(); nestG.scale.setScalar(NEST_S);
nestG.position.y = NEST_Y - NEST_PIVOT.y + 0.125 * NEST_S;
nestPivot.add(nestG);

////////////////////////////////////////////////////////////////
//// COCOON
////////////////////////////////////////////////////////////////

const CH = 3.45, CY0 = -1.85, CR = 0.98;
const cocR = (t) => {
  if (t <= 0 || t >= 1) return 0;
  const y = t * 2 - 1;
  const sm = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); };
  const e = Math.pow(1 - y * y, y > 0 ? 0.58 : 0.5);
  const lean = 0.84 + 0.16 * Math.sin(y * PI * 0.5 + 0.35);
  const tail = 1 - 0.38 * sm(-0.25, -1.0, y);
  return CR * e * lean * tail;
};
const cocDisp = (x, y, z) => 1 + 0.045 * vnc(x * 2.2, y * 2.2, z * 2.2) + 0.018 * vnc(x * 6 + 7, y * 6, z * 6);
const cocPoint = (theta, t, off = 1) => {
  const r = cocR(t), y = CY0 + t * CH;
  const x = Math.cos(theta) * r, z = Math.sin(theta) * r;
  const k = cocDisp(x, y, z) * off;
  return new THREE.Vector3(x * k, y, z * k);
};

const cocGeo = (() => {
  const pts = [];
  const N = 180;
  for (let i = 0; i <= N; i++) { const t = i / N; pts.push(new THREE.Vector2(Math.max(cocR(t), 0.0005), CY0 + t * CH)); }
  const g = new THREE.LatheGeometry(pts, 160);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const k = cocDisp(x, y, z);
    p.setXYZ(i, x * k, y, z * k);
  }
  g.computeVertexNormals();
  return g;
})();

const fiberField = (p) => {
  const w = fbm3(p.mul(1.6)).mul(6.0);
  const w2 = fbm3(p.mul(2.3).add(9.0)).mul(5.0);
  const L = (d, f, ww, k) => pow(float(1.0).sub(abs(sin(dot(p, vec3(...d)).mul(f).add(ww)))), k);
  const a = L([0.28, 0.92, 0.25], 34.0, w, 9.0);
  const b = L([-0.55, 0.62, 0.55], 41.0, w2, 10.0);
  const c = L([0.66, 0.38, -0.64], 47.0, w.mul(0.8), 12.0);
  const e = L([0.12, 0.25, 0.96], 55.0, w2.mul(1.2), 12.0);
  const f = L([0.4, -0.7, 0.3], 80.0, w.add(w2), 16.0);
  return max(max(a, b), max(c, e)).mul(0.8).add(f.mul(0.4)).add(a.add(b).add(c).add(e).mul(0.12));
};

// tilted, stretched noise = wrapped silk bands running around the nest
const tiltP = (p, a) => vec3(p.x.mul(Math.cos(a)).sub(p.y.mul(Math.sin(a))), p.x.mul(Math.sin(a)).add(p.y.mul(Math.cos(a))), p.z);
const wrapBands = (p, a, sx, sy, seed) => fbm3(tiltP(p, a).mul(vec3(sx, sy, sx)).add(seed));

const TEARS = Array.from({ length: 4 }, () => uniform(new THREE.Vector4(0, 0, 0, 0)));
const cocMat = new THREE.MeshBasicNodeMaterial();
cocMat.colorNode = Fn(() => {
  const p = positionLocal;
  const n = normalize(normalWorld);
  const V = normalize(cameraPosition.sub(positionWorld));
  const ndv = clamp(dot(n, V), 0.0, 1.0);
  const L = normalize(vec3(-0.45, 0.75, 0.5));
  const lam = dot(n, L).mul(0.5).add(0.5);
  const fib = fiberField(p);
  const ty = p.y.sub(CY0).div(CH);
  // two crossing layers of wrapped bands + big patches
  const b1 = wrapBands(p, 0.42, 2.2, 13.0, 0.0);
  const b2 = wrapBands(p, -0.55, 2.6, 16.0, 11.0);
  const patch = fbm3(p.mul(1.1).add(3.0)).mul(0.5).add(0.5);
  const crease = smoothstep(0.0, 0.08, abs(b1)).mul(smoothstep(0.0, 0.06, abs(b2)).mul(0.4).add(0.6));
  const layerTop = smoothstep(-0.2, 0.35, b1);
  const tone = clamp(patch.mul(0.3).add(layerTop.mul(0.22)).add(b2.mul(0.15)).add(0.42), 0.0, 1.0).mul(crease.mul(0.25).add(0.75));
  // light: key from upper left, shadow side right & bottom, glow from inside the upper middle
  const shade = mix(0.1, 1.05, pow(lam, 1.6)).mul(mix(0.35, 1.0, pow(ndv, 0.5))).mul(mix(0.38, 1.0, smoothstep(0.05, 0.62, ty)));
  const dark = vec3(0.26, 0.275, 0.31), mid = vec3(0.62, 0.64, 0.69), white = vec3(1.08, 1.08, 1.1);
  const albedo = mix(mix(dark, mid, smoothstep(0.0, 0.5, tone)), white, smoothstep(0.45, 1.0, tone));
  const col = albedo.mul(shade).mul(fib.mul(0.22).add(0.88)).toVar();
  const core = exp(pow(ty.sub(0.6).div(0.27), 2.0).negate()).mul(pow(ndv, 1.6)).mul(exp(pow(n.x.add(0.18), 2.0).mul(-2.0)));
  // thinner silk (bright layers) lets more of the inner light through
  col.addAssign(vec3(1.0, 0.985, 0.96).mul(core).mul(uPulse.mul(0.9).add(1.7)).mul(layerTop.mul(0.35).add(0.65)).mul(crease.mul(0.3).add(0.7)));
  col.addAssign(vec3(0.85, 0.88, 0.95).mul(pow(float(1.0).sub(ndv), 3.0)).mul(0.12));
  // torn patches: darker notch with frayed edge, fading as the spiders mend it
  const tear = float(0.0).toVar();
  TEARS.forEach((u) => {
    const d = length(normalize(p.mul(vec3(1.0, 0.45, 1.0))).sub(u.xyz));
    const fray = fbm3(p.mul(9.0)).mul(0.06);
    tear.assign(max(tear, smoothstep(0.38, 0.12, d.add(fray)).mul(u.w)));
  });
  col.mulAssign(float(1.0).sub(tear.mul(0.6)));
  return col;
})();
const cocoon = new THREE.Mesh(cocGeo, cocMat);
nestG.add(cocoon);

// loose outer wrappings: partial translucent silk sheets slightly off the surface
const wrapMats = [[1.03, 0.6, 3.0], [1.06, -0.35, 7.0]].map(([k, a, seed]) => {
  const m = new THREE.MeshBasicNodeMaterial({ transparent: true, depthWrite: false });
  m.positionNode = positionLocal.mul(vec3(k, 1.0 + (k - 1) * 0.25, k));
  const p = positionLocal;
  const band = wrapBands(p, a, 1.6, 9.0, seed);
  const n = normalize(normalWorld);
  const V = normalize(cameraPosition.sub(positionWorld));
  const ndv = clamp(dot(n, V), 0.0, 1.0);
  const lam = dot(n, normalize(vec3(-0.45, 0.75, 0.5))).mul(0.5).add(0.5);
  const ty = p.y.sub(CY0).div(CH);
  const fibs = pow(float(1.0).sub(abs(sin(tiltP(p, a).y.mul(60.0).add(fbm3(p.mul(2.0).add(seed)).mul(4.0))))), 6.0);

const webLayer = (p, sc, seed, sharp, soft) => {
  const q = p.mul(sc).add(vec2(seed * 3.1, seed * 1.7));
  const tw = uTime.mul(0.015).add(seed);
  const w = vec2(fbm3(vec3(q.mul(0.32), tw)), fbm3(vec3(q.mul(0.32).add(7.1), tw.add(3.0))));
  const qq = q.add(w.mul(2.2));
  const D = holeD(qq, uTime.mul(0.035).add(seed));
  const n = fbm3(vec3(qq.mul(0.9), seed * 2.0));
  const tear = smoothstep(-0.45, 0.0, n);
  const rim = exp(abs(D).mul(-sharp)).mul(smoothstep(-0.08, 0.02, D)).mul(tear);
  const sheet = smoothstep(-0.02, 0.06, D).mul(exp(D.mul(-soft))).mul(smoothstep(-0.6, 0.1, n));
  const fib = pow(sin(D.mul(55.0).add(n.mul(7.0))).mul(0.5).add(0.5), 3.0);
  const fold = fbm3(vec3(qq.mul(2.2), seed + 5.0)).mul(0.5).add(0.5);
  return vec3(rim, sheet.mul(fib.mul(0.5).add(0.35)).mul(fold.mul(0.8).add(0.4)), sheet);
};


const RB_pos = [], RB_uv = [], RB_r = [], RB_idx = [];
const ribbons = [];
const ACROSS = 6;
const lerpProf = (prof, v) => { const x = v * (prof.length - 1); const i = Math.min(prof.length - 2, Math.floor(x)); const f = x - i; return prof[i] * (1 - f) + prof[i + 1] * f; };

const addRibbon = (cps, o = {}) => {
  const pts3 = cps.map((p) => p.isVector3 ? p.clone() : new THREE.Vector3(...p));
  const curve = new THREE.CatmullRomCurve3(pts3, false, 'centripetal');
  const N = o.n || 200;
  const seed = o.seed ?? R() * 60;
  const W = o.w ?? 0.4;
  const prof = o.prof || [0.25, 1, 1, 0.85, 0.5];
  const op = o.op ?? 0.8;
  const kind = o.torn ? 1 : 0;
  const wind = (o.wind ?? 0.14) * (o.att ? -1 : 1);
  const twist0 = o.twist0 ?? RR(-0.6, 0.6), twistA = o.twist ?? RR(0.3, 1.2);
  const cup = o.cup ?? 0.12;
  const frames = [];
  const CAMP = new THREE.Vector3(0, 2.0, 11.0);
  const base = RB_pos.length / 3;
  for (let i = 0; i <= N; i++) {
    const v = i / N;
    const P = curve.getPointAt(v), T = curve.getTangentAt(v).normalize();
    const view = CAMP.clone().sub(P).normalize();
    let S = new THREE.Vector3().crossVectors(T, view);
    if (S.lengthSq() < 1e-4) S.set(1, 0, 0);
    S.normalize();
    const B0 = new THREE.Vector3().crossVectors(T, S).normalize();
    const a = twist0 + twistA * Math.sin(v * PI * 1.3 + seed);
    const side = S.clone().multiplyScalar(Math.cos(a)).addScaledVector(B0, Math.sin(a));
    const nrm = new THREE.Vector3().crossVectors(T, side).normalize();
    const w = W * lerpProf(prof, v) * (0.8 + 0.35 * vnc(v * 5, seed, 0.5));
    frames.push({ P, side, nrm, w, v });
    for (let j = 0; j <= ACROSS; j++) {
      const u = j / ACROSS, uc = u * 2 - 1;
      const q = P.clone().addScaledVector(side, uc * w).addScaledVector(nrm, uc * uc * w * cup + vnc(v * 9, uc * 2, seed) * w * 0.12);
      RB_pos.push(q.x, q.y, q.z);
      RB_uv.push(u, v);
      RB_r.push(seed, op, kind, wind);
    }
  }
  const row = ACROSS + 1;
  for (let i = 0; i < N; i++) for (let j = 0; j < ACROSS; j++) {
    const a = base + i * row + j, b = a + 1, c = a + row, d = c + 1;
    RB_idx.push(a, c, b, b, c, d);
  }
  // threads riding along the ribbon
  const nt = Math.floor((o.threads ?? 18) * Q * 0.6);
  for (let k = 0; k < nt; k++) {
    const uo = RR(-1.25, 1.25), no = RR(-0.08, 0.08), js = R() * 40;
    const v0 = R() < 0.6 ? 0 : RR(0, 0.5), v1 = R() < 0.6 ? 1 : RR(0.5, 1);
    const pts = [], vs = [];
    frames.forEach((f) => {
      if (f.v < v0 || f.v > v1) return;
      const jit = vnc(f.v * 6, js, 0) * 0.35;
      pts.push(f.P.clone().addScaledVector(f.side, (uo + jit) * f.w).addScaledVector(f.nrm, no + vnc(f.v * 4, js, 3) * 0.05));
      vs.push(f.v);
    });
    if (pts.length > 2) pushPolyline(pts, seed, RR(0.12, 0.45) * op, wind, vs);
  }
  ribbons.push({ curve, seed, wind });
};

        sN.connect(bp).connect(g).connect(pn); sN.start(tt, Math.random() * 2); sN.stop(tt + 0.06);
      }
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(1900, t); o.frequency.exponentialRampToValueAtTime(700, t + 0.06);
      const og = ctx.createGain(); og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.12, t + 0.003); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      o.connect(og).connect(pn); o.start(t); o.stop(t + 0.12);
    },
    splat() {
      if (!ready) return;
      const t = ctx.currentTime + 0.005;
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.12);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      o.connect(g).connect(out); o.start(t); o.stop(t + 0.25);
      for (let i = 0; i < 8; i++) {
        const tt = t + i * RR(0.004, 0.018);
        const sN = ctx.createBufferSource(); sN.buffer = noiseBuf;
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = RR(3000, 6000); bp.Q.value = 3;
        const gg = ctx.createGain(); gg.gain.setValueAtTime(0.0001, tt); gg.gain.exponentialRampToValueAtTime(0.09, tt + 0.002); gg.gain.exponentialRampToValueAtTime(0.0001, tt + 0.03);
        sN.connect(bp).connect(gg).connect(out); sN.start(tt, Math.random() * 2); sN.stop(tt + 0.04);
      }
    },
    whoosh() {
      if (!ready) return;
      const t = ctx.currentTime + 0.005;
      const sN = ctx.createBufferSource(); sN.buffer = noiseBuf;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
      bp.frequency.setValueAtTime(400, t); bp.frequency.exponentialRampToValueAtTime(3200, t + 0.8);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.28, t + 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.0);
      sN.connect(bp).connect(g); g.connect(out); sN.start(t, Math.random()); sN.stop(t + 1.05);
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(2400, t + 0.05); o.frequency.exponentialRampToValueAtTime(4200, t + 0.12);
      const og = ctx.createGain(); og.gain.setValueAtTime(0.0001, t + 0.05); og.gain.exponentialRampToValueAtTime(0.05, t + 0.06); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(og).connect(out); o.start(t + 0.05); o.stop(t + 0.2);
    },
    drop(pan, k) { if (!ready) return; const t = ctx.currentTime + 0.01; drop(t, 0.12 + 0.25 * k, pan); if (k > 0.5) drop(t + RR(0.08, 0.16), 0.08 * k, pan); },
    get on() { return on; },
    wake() { const fresh = !ctx; if (!ctx) init(); if (ctx.state === 'suspended') ctx.resume(); if (fresh) this.gale(galeTarget); },
    set(v) { on = v; if (ctx) out.gain.setTargetAtTime(v ? 0.8 : 0, ctx.currentTime, 0.12); },
    beat(k) { if (!ready) return; const t = ctx.currentTime + 0.01; thump(t, 0.25 + 0.5 * k); thump(t + 0.28, (0.25 + 0.5 * k) * 0.6); },
    pluck(k, n = 1) {
      if (!ready) return;
      const sc = [62, 64, 69, 71, 74, 76, 81, 83, 86];
      for (let i = 0; i < n; i++) pluckAt(ctx.currentTime + 0.01 + i * RR(0.03, 0.12), mf(sc[Math.floor(Math.random() * sc.length)] + 12), 0.04 + 0.08 * k, RR(-0.8, 0.8));
    },
    gale(g) {
      if (!ready) return;
      const n = ctx.currentTime;
      windG.gain.setTargetAtTime(0.05 + g * 0.2, n, 0.8);
      windF.frequency.setTargetAtTime(420 + g * 500, n, 0.8);
      whistleG.gain.setTargetAtTime(g * 0.05, n, 1.2);
    },
    tick(dt, gale) {
      if (!ready) return;
      nextChord -= dt;
      if (nextChord <= 0) {
        nextChord = 16; chord = (chord + 1) % CHS.length;
        pad.forEach((v, i) => v.forEach((o, k) => o.frequency.setTargetAtTime(mf(CHS[chord][i] + (k ? 12 : 0)), ctx.currentTime, 2.5)));
      }
      nextCreak -= dt * (1 + gale * 2);
      if (nextCreak <= 0) { nextCreak = RR(6, 14); this.pluck(0.18 + gale * 0.3, 1); }
      nextDrip -= dt; if (nextDrip <= 0) { nextDrip = RR(2.5, 6); this.drop(RR(-0.8, 0.8), RR(0.1, 0.35)); }
    }
  };
})();

////////////////////////////////////////////////////////////////
//// BUTTONS
////////////////////////////////////////////////////////////////

let galeTarget = QS.has('calm') ? 0 : 1;
uGale.value = galeTarget;
const sndBtn = document.querySelector('[data-snd]');
sndBtn.addEventListener('click', () => {
  snd.wake(); snd.set(!snd.on);
  sndBtn.setAttribute('aria-pressed', String(snd.on));
  sndBtn.textContent = snd.on ? 'Sound on' : 'Sound off';
});
document.querySelectorAll('[data-wind]').forEach((b) => b.addEventListener('click', () => {
  galeTarget = b.dataset.wind === 'gale' ? 1 : 0;
  document.querySelectorAll('[data-wind]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  snd.wake(); snd.gale(galeTarget);
}));
document.getElementById('picker').addEventListener('pointerdown', () => snd.wake());

////////////////////////////////////////////////////////////////
//// HEART + SWING
////////////////////////////////////////////////////////////////

const heart = { at: -10, k: 0.4, next: 2.5 };
const beat = (t, k) => { heart.at = t; heart.k = k; snd.beat(k); };
const env = (x) => x < 0 ? 0 : Math.exp(-x * 6) * (1 - Math.exp(-x * 50));
let shake = 0;
const swing = { ax: 0, az: 0, vx: 0, vz: 0 };

////////////////////////////////////////////////////////////////
//// LOOK
////////////////////////////////////////////////////////////////

const look = { yaw: 0, pitch: 0, ty: 0, tp: 0, down: false, moved: 0, x: 0, y: 0 };
const cv = renderer.domElement;
const _ray = new THREE.Raycaster(), _v2 = new THREE.Vector2();
const _plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), _hit = new THREE.Vector3();
cv.addEventListener('pointerdown', (e) => {
  snd.wake(); cv.setPointerCapture(e.pointerId);
  look.down = true; look.moved = 0; look.x = e.clientX; look.y = e.clientY;
});
cv.addEventListener('pointercancel', () => { look.down = false; });
cv.addEventListener('pointermove', (e) => {
  if (!look.down) return;
  const dx = e.clientX - look.x, dy = e.clientY - look.y;
  look.x = e.clientX; look.y = e.clientY; look.moved += Math.abs(dx) + Math.abs(dy);
  look.ty = Math.max(-0.6, Math.min(0.6, look.ty - dx * 0.004));
  look.tp = Math.max(-0.5, Math.min(0.3, look.tp + dy * 0.003));
});
cv.addEventListener('pointerup', (e) => {
  look.down = false;
  if (look.moved > 14) return;
  _v2.set(e.clientX / window.innerWidth * 2 - 1, 1 - e.clientY / window.innerHeight * 2);
  _ray.setFromCamera(_v2, camera);
  const cHit = _ray.intersectObject(cocoon, false)[0];
  if (cHit) {
    alarmSpiders(cHit.point);
    beat(uTime.value, 1); shake = 1; snd.pluck(0.9, 4);
    swing.vx += RR(-0.12, 0.12); swing.vz += (R() < 0.5 ? -1 : 1) * RR(0.08, 0.14);
  } else if ((() => { let best = null, bd = 1e9; pearls.forEach((p) => { if (p.broken) return; const c = p.m.getWorldPosition(new THREE.Vector3()); const d2 = _ray.ray.distanceSqToPoint(c); if (d2 < (p.r * 1.9) ** 2 && d2 < bd) { bd = d2; best = p; } }); if (best) crackEgg(best); return !!best; })()) {
    // egg cracked
  } else if (_ray.ray.intersectPlane(_plane, _hit)) {
    rippleAt(_hit.x, _hit.z, 1.0);
    snd.drop(Math.max(-1, Math.min(1, _hit.x / 6)), 1);
  }
});

////////////////////////////////////////////////////////////////
//// FRAME
////////////////////////////////////////////////////////////////

const TGT = new THREE.Vector3(0, 3.45, 1.6);
const CAM0 = new THREE.Vector3(0, 2.25, 8.1);
if (QS.has('tp')) { look.tp = look.pitch = +QS.get('tp'); }
const placeCam = (t) => {
  look.yaw += (look.ty - look.yaw) * 0.06; look.pitch += (look.tp - look.pitch) * 0.06;
  const rel = CAM0.clone().sub(TGT);
  const D = rel.length() * camera.userData.k;
  const yaw = look.yaw + Math.sin(t * 0.05) * 0.04;
  const el = Math.atan2(rel.y, Math.hypot(rel.x, rel.z)) + look.pitch + Math.sin(t * 0.04 + 1) * 0.015;
  camera.position.set(TGT.x + Math.sin(yaw) * Math.cos(el) * D, TGT.y + Math.sin(el) * D, TGT.z + Math.cos(yaw) * Math.cos(el) * D);
  camera.position.y = Math.max(0.35, camera.position.y);
  camera.lookAt(TGT);
};
const fit = () => {
  const vw = window.innerWidth, vh = window.innerHeight;
  camera.aspect = vw / vh;
  camera.fov = Math.max(50, Math.min(72, 2 * Math.atan(Math.tan(27 * PI / 180) / Math.min(1, camera.aspect * 1.3)) * 180 / PI));
  camera.userData.k = camera.aspect < 1 ? 1.0 : 0.95;
  camera.updateProjectionMatrix();
  renderer.setSize(vw, vh);
  uAspect.value = camera.aspect;
};
window.addEventListener('resize', fit);
fit();

////////////////////////////////////////////////////////////////
//// LOOP
////////////////////////////////////////////////////////////////

const clock = new THREE.Timer();
let first = true, tt = parseFloat(QS.get('t')) || 0;

const _c = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  clock.update();
  const dt = QS.has('freeze') ? 0 : Math.min(clock.getDelta(), 0.05);
  tt += dt;
  uTime.value = tt;
  uGale.value += (galeTarget - uGale.value) * Math.min(1, dt * 0.6);
  const g = uGale.value;
  if (tt > heart.next) { heart.next = tt + RR(3.2, 4.6); beat(tt, 0.35); }
  const a = tt - heart.at;
  uPulse.value = heart.k * (env(a) + 0.65 * env(a - 0.28));
  shake *= Math.exp(-dt * 1.6);
  uShake.value = shake;
  // pendulum on a long silk thread, nudged by the wind
  const wx = (Math.sin(tt * 0.37) + Math.sin(tt * 0.91 + 2) * 0.5) * (0.004 + g * 0.05);
  const wz = (Math.sin(tt * 0.29 + 1) + Math.sin(tt * 1.13) * 0.5) * (0.006 + g * 0.07);
  swing.vx += (-1.6 * swing.ax - 0.25 * swing.vx + wx) * dt; swing.vz += (-1.6 * swing.az - 0.25 * swing.vz + wz) * dt;
  swing.ax += swing.vx * dt; swing.az += swing.vz * dt;
  nestPivot.rotation.set(swing.ax, 0, swing.az);
  nestG.rotation.y = Math.sin(tt * 0.11) * 0.5 + swing.az * 2;
  const s = 1 + uPulse.value * 0.012;
  cocoon.scale.set(s, 1 + uPulse.value * 0.006, s); fuzz.scale.copy(cocoon.scale); wraps.forEach((w) => w.scale.copy(cocoon.scale));
  pearls.forEach((p) => {
    p.m.position.y = p.r * 0.55 + Math.sin(tt * 0.8 + p.ph) * p.r * (0.04 + g * 0.08);
    if (!p.broken && tt > p.next) { p.next = tt + RR(4, 10) / (1 + g); rippleAt(p.m.position.x, p.m.position.z, 0.25 + p.r * 0.5); }
  });
  cocoon.getWorldPosition(_c); uNestOff.value.copy(_c).sub(NEST_REST); glow.position.copy(_c).add(new THREE.Vector3(0, 0.3, -1.2));
  placeCam(tt);
  if (QS.has('spcam')) { const S = spiders[+QS.get('spcam')]; const p = S.root.getWorldPosition(new THREE.Vector3()); camera.position.copy(p).add(new THREE.Vector3(0.5, 0.55, 1.1)); camera.lookAt(p); }
  glow.quaternion.copy(camera.quaternion);
  updateSpiders(tt, dt);
  updateEggs(tt, dt);
  snd.tick(dt, g);
  pipe.render();
  if (first && QS.has('alarm')) { cocoon.updateWorldMatrix(true, false); const w = new THREE.Vector3(); cocoon.getWorldPosition(w); alarmSpiders(w.add(new THREE.Vector3(-0.3, 0.4, 1.0))); }
  if (first && QS.has('sim')) { const n = +QS.get('sim'); for (let i = 0; i < n; i++) updateSpiders(tt + i * 0.05, 0.05); console.log('TR', JSON.stringify(travellers.map((T) => [T.out, +T.v.toFixed(2), T.S.hex.toString(16)])), JSON.stringify(spiders.map((S) => S && [S.hex.toString(16), S.state]))); console.log('SP', JSON.stringify(spiders.filter(Boolean).map((S) => [S.state, +S.th.toFixed(2), +S.t.toFixed(2), S.tgt && S.tgt.map((x) => +x.toFixed(2)), +backTh.toFixed(2)]))); }
  if (first && QS.has('crack')) { (QS.get('crack') === 'all' ? pearls : [pearls[+QS.get('crack')]]).forEach(crackEgg); const n = +(QS.get('esim') || 0); for (let i = 0; i < n; i++) { tt += 0.033; uTime.value = tt; updateEggs(tt, 0.033); } }
  if (first) { first = false; document.getElementById('loading').classList.add('off'); window.__ready = true; }
});
window.__snd = snd; window.__V3 = THREE.Vector3; window.__cam = camera;
window.__eggs = () => pearls.map((p) => { const v = p.m.getWorldPosition(new THREE.Vector3()).project(camera); return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight, z: v.z, broken: !!p.broken, vis: p.m.visible }; });
</script>
