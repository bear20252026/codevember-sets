<script type="module">
import * as THREE from 'three/webgpu';
import {
  Fn, uniform, float, vec2, vec3, vec4, attribute, varyingProperty, uv, step,
  dot, cross, normalize, mix, smoothstep, max, min, abs, fract, floor, length, pow, exp, clamp, sin, cos, atan, reflect,
  positionWorld, positionGeometry, normalGeometry, normalWorld, cameraPosition, screenUV, pass, convertToTexture
} from 'three/tsl';
import { bloom } from 'three/addons/tsl/display/BloomNode.js';
import { fxaa } from 'three/addons/tsl/display/FXAANode.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const BUILD = 'v1.3-three-koi';
console.log('%c' + BUILD, 'color:#b6e21c');

////////////////////////////////////////////////////////////////
//// PARAMS
////////////////////////////////////////////////////////////////

const QS = new URLSearchParams(location.search);
const LOWQ = QS.has('low') || /Android|iPhone|iPad/i.test(navigator.userAgent);
const uTime = uniform(0);
const FLOW = new THREE.Vector2(-0.24, 1).normalize();
const SUN = new THREE.Vector3(-0.3, 1, -0.6).normalize();
const uSun = vec3(SUN.x, SUN.y, SUN.z);
const SUNC = vec3(1.0, 0.92, 0.7).mul(1.75);
const KL = 0.62, KS = 1.5;
const KOIN = 3;
const uKoi = [0, 1, 2].map(() => uniform(new THREE.Vector4(0, 0, 0, 1)));
const uKoiY = [0, 1, 2].map(() => uniform(-0.16));
const koiShade = (P) => {
  let s = float(1.0);
  uKoi.forEach((k, i) => {
    const q = P.xz.add(uSun.xz.div(uSun.y).mul(uKoiY[i].sub(P.y)));
    const a = k.xy.sub(k.zw.mul(KL * KS * 0.45)), ba = k.zw.mul(KL * KS * 0.9);
    const pa = q.sub(a);
    const hh = clamp(dot(pa, ba).div(dot(ba, ba)), 0.0, 1.0);
    const d = length(pa.sub(ba.mul(hh)));
    const w = float(0.075 * KS).mul(hh.oneMinus().mul(0.6).add(0.4));
    s = s.mul(smoothstep(w.mul(0.3), w.add(0.06), d).mul(0.6).add(0.4));
  });
  return s;
};
const uInvProj = uniform(new THREE.Matrix4());
const uCamWorld = uniform(new THREE.Matrix4());
const uCamPos = uniform(new THREE.Vector3());
const uCamFwd = uniform(new THREE.Vector3());

let seed = 13;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const rr = (a, b) => a + (b - a) * rnd();
const gauss = () => { let s = 0; for (let k = 0; k < 4; k++) s += rnd(); return (s - 2) / 0.58; };

const bedAt = (x, z) => -0.5 - 0.6 * THREE.MathUtils.smoothstep(z - 0.4 * x, 0.6, 2.4);
const bedN = (p) => float(-0.5).sub(smoothstep(0.6, 2.4, p.y.sub(p.x.mul(0.4))).mul(0.6));

////////////////////////////////////////////////////////////////
//// NOISE
////////////////////////////////////////////////////////////////

const hash13 = Fn(([q]) => {
  const p3 = fract(q.mul(0.1031)).toVar();
  p3.addAssign(dot(p3, p3.zyx.add(31.32)));
  return fract(p3.x.add(p3.y).mul(p3.z));
}).setLayout({ name: 'h13', type: 'float', inputs: [{ name: 'q', type: 'vec3' }] });

const vn = Fn(([x]) => {
  const i = floor(x);
  const f = fract(x);
  const u = f.mul(f).mul(f.mul(-2.0).add(3.0));
  const a = hash13(i);
  const b = hash13(i.add(vec3(1, 0, 0)));
  const c = hash13(i.add(vec3(0, 1, 0)));
  const d = hash13(i.add(vec3(1, 1, 0)));
  const e = hash13(i.add(vec3(0, 0, 1)));
  const g = hash13(i.add(vec3(1, 0, 1)));
  const h = hash13(i.add(vec3(0, 1, 1)));
  const k = hash13(i.add(vec3(1, 1, 1)));
  const z0 = mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
  const z1 = mix(mix(e, g, u.x), mix(h, k, u.x), u.y);
  return mix(z0, z1, u.z).mul(2.0).sub(1.0);
}).setLayout({ name: 'vn', type: 'float', inputs: [{ name: 'x', type: 'vec3' }] });

const fbm3 = Fn(([p]) => {
  const v = vn(p).mul(0.55).toVar();
  v.addAssign(vn(p.mul(2.11).add(vec3(5.3, 1.2, 8.8))).mul(0.3));
  v.addAssign(vn(p.mul(4.37).add(vec3(2.6, 6.1, 3.3))).mul(0.15));
  return v;
}).setLayout({ name: 'fbm3', type: 'float', inputs: [{ name: 'p', type: 'vec3' }] });

const caustic = Fn(([pin, sp]) => {
  const p = fract(pin).mul(6.28318).sub(250.0).toVar();
  const i = vec2(p).toVar();
  const c = float(1.0).toVar();
  for (let n = 0; n < 4; n++) {
    const t = sp.mul(1.0 - 3.5 / (n + 1)).add(23.0);
    i.assign(p.add(vec2(cos(t.sub(i.x)).add(sin(t.add(i.y))), sin(t.sub(i.y)).add(cos(t.add(i.x))))));
    c.addAssign(float(1.0).div(length(vec2(p.x.div(sin(i.x.add(t)).div(0.005)), p.y.div(cos(i.y.add(t)).div(0.005))))));
  }
  c.divAssign(4.0);
  c.assign(float(1.17).sub(pow(c, 1.4)));
  return pow(abs(c), 7.0);
}).setLayout({ name: 'caus', type: 'float', inputs: [{ name: 'pin', type: 'vec2' }, { name: 'sp', type: 'float' }] });

const flowXZ = (p) => vec2(p.x.mul(FLOW.y).sub(p.y.mul(FLOW.x)), p.x.mul(FLOW.x).add(p.y.mul(FLOW.y)));
const sunXZ = (P) => P.xz.add(uSun.xz.div(uSun.y).mul(P.y.negate()));
const lightAt = (P) => {
  const q = sunXZ(P);
  const f = flowXZ(q);
  const shade = fbm3(vec3(f.x.mul(0.9), f.y.mul(0.45).sub(uTime.mul(0.5)), uTime.mul(0.07))).mul(0.5).add(0.5);
  const sh = smoothstep(0.28, 0.7, shade);
  const c = caustic(q.mul(0.23).sub(vec2(FLOW.x, FLOW.y).mul(uTime.mul(0.012))), uTime.mul(0.55));
  return { sh, c };
};
const absorb = (col, depth) => col.mul(exp(vec3(2.4, 0.95, 1.6).mul(depth).negate())).add(vec3(0.004, 0.022, 0.01).mul(exp(depth.mul(-1.6)).oneMinus()));

////////////////////////////////////////////////////////////////
//// RENDERER
////////////////////////////////////////////////////////////////

const renderer = new THREE.WebGPURenderer({ antialias: false, forceWebGL: QS.has('webgl') });
const PR = Math.min(window.devicePixelRatio, LOWQ ? 1.25 : 2) * (parseFloat(QS.get('scale')) || 1);
renderer.setPixelRatio(PR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
document.body.appendChild(renderer.domElement);
await renderer.init();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020403);
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.05, 60);
const LOOK = new THREE.Vector3(0, -0.3, -0.4);

////////////////////////////////////////////////////////////////
//// BED
////////////////////////////////////////////////////////////////

{
  const g = new THREE.PlaneGeometry(26, 26, 120, 120);
  g.rotateX(-Math.PI / 2);
  const pa = g.attributes.position;
  for (let i = 0; i < pa.count; i++) pa.setY(i, bedAt(pa.getX(i), pa.getZ(i)));
  const m = new THREE.MeshBasicNodeMaterial();
  m.colorNode = Fn(() => {
    const P = positionWorld;
    const grit = fbm3(vec3(P.xz.mul(5.0), 1.3)).mul(0.5).add(0.5);
    const pebble = smoothstep(0.1, 0.5, vn(vec3(P.xz.mul(14.0), 4.0)));
    const alb = mix(vec3(0.025, 0.022, 0.014), vec3(0.09, 0.075, 0.04), grit).mul(mix(0.7, 1.15, pebble));
    const L = lightAt(P);
    const lit = SUNC.mul(L.sh.mul(0.35).add(0.05).mul(L.c.mul(2.2).add(0.4))).mul(koiShade(P)).add(vec3(0.02, 0.05, 0.035));
    return absorb(alb.mul(lit), P.y.negate());
  })();
  scene.add(new THREE.Mesh(g, m));
}

////////////////////////////////////////////////////////////////
//// STRANDS
////////////////////////////////////////////////////////////////

const strands = (() => {
  const A = [], B = [], C = [];
  const NC = LOWQ ? 260 : 420;
  let n = 0;
  for (let k = 0; k < NC * 3 && n < NC; k++) {
    const cx = rr(-4.2, 4.2), cz = rr(-8.5, 1.6);
    const lane = Math.sin(cx * 1.7 - cz * 0.4) * 0.5 + Math.sin(cx * 3.1 + cz * 0.9 + 1.3) * 0.35;
    if (lane < -0.15 && rnd() < 0.9) continue;
    if (bedAt(cx, cz + 1.2) < -0.75 && rnd() < 0.75) continue;
    n++;
    const ang = Math.atan2(FLOW.x, FLOW.y) + rr(-0.22, 0.22);
    const dir = [Math.sin(ang), Math.cos(ang)];
    const len = rr(1.1, 2.6);
    const bed = bedAt(cx, cz);
    const layer = rr(-0.34, -0.04) + (bed + 0.5) * 0.65;
    const tone = Math.pow(rnd(), 1.4);
    const per = Math.round(rr(26, 46) * (LOWQ ? 0.7 : 1));
    for (let j = 0; j < per; j++) {
      const rx = cx + gauss() * 0.09, rz = cz + gauss() * 0.11;
      A.push(rx, rz, len * rr(0.55, 1.15), rr(0.018, 0.042));
      B.push(rnd(), layer + rr(-0.06, 0.04), THREE.MathUtils.clamp(tone + rr(-0.15, 0.15), 0, 1), bedAt(rx, rz));
      C.push(dir[0] + rr(-0.16, 0.16), dir[1], rnd(), rr(0.01, 0.05));
    }
  }
  const count = A.length / 4;
  const SEG = LOWQ ? 26 : 40;
  const base = new THREE.PlaneGeometry(1, 1, 1, SEG);
  const geo = new THREE.InstancedBufferGeometry();
  geo.index = base.index;
  geo.setAttribute('position', base.attributes.position);
  geo.setAttribute('uv', base.attributes.uv);
  geo.setAttribute('aA', new THREE.InstancedBufferAttribute(new Float32Array(A), 4));
  geo.setAttribute('aB', new THREE.InstancedBufferAttribute(new Float32Array(B), 4));
  geo.setAttribute('aC', new THREE.InstancedBufferAttribute(new Float32Array(C), 4));
  geo.instanceCount = count;

  const iA = attribute('aA', 'vec4'), iB = attribute('aB', 'vec4'), iC = attribute('aC', 'vec4');
  const centre = (s) => {
    const along = s.mul(iA.z);
    const dir = normalize(iC.xy);
    const px = iA.x.add(dir.x.mul(along)), pz = iA.y.add(dir.y.mul(along));
    const e = smoothstep(0.0, 0.32, s);
    const f = flowXZ(vec2(px, pz));
    const fp = vec3(f.x.mul(0.62).add(iB.x.mul(0.12)), f.y.mul(0.5).sub(uTime.mul(0.95)), uTime.mul(0.12));
    const big = vn(fp).mul(0.6).add(vn(fp.mul(2.3).add(7.3)).mul(0.28));
    const wave = sin(f.y.mul(3.4).sub(uTime.mul(3.6)).add(iC.z.mul(2.0))).mul(0.06);
    const flut = sin(along.mul(8.0).sub(uTime.mul(6.0)).add(iB.x.mul(6.28))).mul(iC.w);
    const lat = big.mul(0.42).add(wave).add(flut).mul(pow(s, 1.1));
    const sd = vec2(dir.y, dir.x.negate());
    const qx = px.add(sd.x.mul(lat)), qz = pz.add(sd.y.mul(lat));
    let push = vec2(0.0, 0.0);
    uKoi.forEach((k, i) => {
      const a = k.xy.sub(k.zw.mul(KL * KS * 0.5)), ba = k.zw.mul(KL * KS);
      const pa = vec2(qx, qz).sub(a);
      const hh = clamp(dot(pa, ba).div(dot(ba, ba)), 0.0, 1.0);
      const dv = pa.sub(ba.mul(hh));
      const dy = iB.y.sub(uKoiY[i]);
      const fall = exp(dot(dv, dv).mul(-30.0)).mul(exp(dy.mul(dy).mul(-40.0))).mul(e);
      push = push.add(normalize(dv.add(vec2(0.0001, 0.0))).mul(fall).mul(0.13));
    });
    const y = mix(iB.w, iB.y, e).add(sin(f.y.mul(2.2).sub(uTime.mul(2.4)).add(iB.x.mul(3.0))).mul(0.035).mul(e));
    return vec3(qx.add(push.x), y, qz.add(push.y));
  };
  const vT = varyingProperty('vec3', 'vT');
  const vN = varyingProperty('vec3', 'vN');
  const m = new THREE.MeshBasicNodeMaterial({ side: THREE.DoubleSide });
  m.positionNode = Fn(() => {
    const s = uv().y;
    const c0 = centre(s), c1 = centre(s.add(0.015));
    const T = normalize(c1.sub(c0));
    const S0 = normalize(cross(vec3(0, 1, 0), T));
    const tw = sin(s.mul(7.0).add(iB.x.mul(9.0)).sub(uTime.mul(1.7))).mul(1.1);
    const U = cross(T, S0);
    const side = normalize(S0.mul(cos(tw)).add(U.mul(sin(tw))));
    const w = iA.w.mul(pow(s.oneMinus(), 0.55)).mul(smoothstep(0.0, 0.06, s).mul(0.5).add(0.5));
    vT.assign(T);
    vN.assign(normalize(cross(side, T)));
    return c0.add(side.mul(uv().x.sub(0.5).mul(w)));
  })();
  m.colorNode = Fn(() => {
    const P = positionWorld;
    const s = uv().y;
    const V = normalize(cameraPosition.sub(P));
    const T = normalize(vT);
    const N = normalize(vN).mul(dot(vN, V).sign());
    const tone = iB.z;
    const lime = vec3(0.62, 0.9, 0.02), olive = vec3(0.16, 0.4, 0.01), rust = vec3(0.5, 0.28, 0.02);
    const alb = mix(mix(lime, olive, tone), rust, smoothstep(0.55, 1.0, s).mul(smoothstep(0.55, 0.95, tone)).mul(0.8)).mul(0.6).mul(mix(0.35, 1.15, fract(iB.x.mul(7.13)))).toVar();
    const L = lightAt(P);
    const top = pow(smoothstep(-0.36, -0.02, P.y), 1.6);
    const vis = L.sh.mul(top.mul(0.9).add(0.1));
    const ndl = dot(N, uSun);
    const diff = max(ndl, 0.0).mul(0.6).add(0.4);
    const trans = max(ndl.negate(), 0.0).mul(0.55).add(0.25).mul(vec3(0.75, 1.0, 0.35));
    const H = normalize(uSun.add(V));
    const th = dot(T, H);
    const kk = pow(max(float(1.0).sub(th.mul(th)), 0.0).sqrt(), 90.0);
    const kb = pow(max(float(1.0).sub(th.mul(th)), 0.0).sqrt(), 12.0);
    const light = SUNC.mul(vis).mul(L.c.mul(1.4).add(0.55));
    const amb = vec3(0.02, 0.06, 0.02).mul(top.mul(0.7).add(0.3));
    const col = alb.mul(light.mul(diff.add(trans)).add(amb)).toVar();
    col.addAssign(SUNC.mul(vis).mul(kk.mul(0.16).add(kb.mul(0.025))).mul(vec3(0.85, 1.0, 0.35)));
    return absorb(col, P.y.negate().max(0.0));
  })();
  const mesh = new THREE.Mesh(geo, m);
  mesh.frustumCulled = false;
  scene.add(mesh);
  console.log('strands', count);
  return { count };
})();

////////////////////////////////////////////////////////////////
//// KOI
////////////////////////////////////////////////////////////////

const KP = [
  [0.0, 0.006, -0.006, 0.006], [0.025, 0.015, -0.012, 0.018], [0.06, 0.026, -0.019, 0.031],
  [0.12, 0.038, -0.027, 0.044], [0.2, 0.048, -0.034, 0.053], [0.32, 0.055, -0.038, 0.058],
  [0.45, 0.053, -0.038, 0.055], [0.6, 0.042, -0.032, 0.043], [0.75, 0.027, -0.022, 0.027],
  [0.88, 0.016, -0.014, 0.014], [0.96, 0.014, -0.012, 0.0095], [1.0, 0.016, -0.013, 0.007],
];
const kp = (u) => {
  let i = 0;
  while (i < KP.length - 2 && u > KP[i + 1][0]) i++;
  const a = KP[Math.max(0, i - 1)], b = KP[i], c = KP[i + 1], d = KP[Math.min(KP.length - 1, i + 2)];
  const t = (u - b[0]) / (c[0] - b[0]), t2 = t * t, t3 = t2 * t;
  return [1, 2, 3].map((j) => 0.5 * (2 * b[j] + (-a[j] + c[j]) * t + (2 * a[j] - 5 * b[j] + 4 * c[j] - d[j]) * t2 + (-a[j] + 3 * b[j] - 3 * c[j] + d[j]) * t3));
};
const koiSurf = (u, a) => {
  const [top, bot, w] = kp(u);
  const c = Math.cos(a), s = Math.sin(a), mid = bot + (top - bot) * 0.44;
  const x = w * Math.sign(c) * Math.pow(Math.abs(c), 0.82);
  const y = s > 0 ? mid + (top - mid) * Math.pow(s, 0.85) : mid - (mid - bot) * Math.pow(-s, 0.65);
  return [x, y - (u < 0.05 ? (0.05 - u) * 0.08 : 0), KL * (0.5 - u)];
};
const withPart = (g, part) => { g.setAttribute('aPart', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count).fill(part), 1)); return g; };
const koiBodyGeo = (() => {
  const NU = 90, NV = 36, pos = [], uvs = [], idx = [];
  for (let i = 0; i <= NU; i++) {
    const u = Math.pow(i / NU, 1.15);

  const { x, z } = s.b;

  koi.forEach((k, i) => {
    const d = Math.hypot(k.x - x, k.z - z);

const sM = new THREE.Matrix4(), sQ = new THREE.Quaternion(), sS = new THREE.Vector3();
const stepPool = (P, dt, f) => {
  P.items.forEach((it, i) => {
    if (it.live) { it.t += dt; f(it); }
    sS.setScalar(it.live ? it.s : 0);

};
const updateBoats = (dt) => {
  boats.forEach((s) => {
    if (s.st === 'off') return;
    s.age += dt;
    if (s.st === 'fly') {
      s.t = Math.min(1, s.t + dt / 0.75);
      s.p.copy(s.a).lerp(s.b, s.t);
      s.p.y += Math.sin(s.t * Math.PI) * 0.55 + (1 - s.t) * 0.05;
      s.h += s.wh * dt;

    } else {
      const flowSpd = 0.17 + 0.05 * Math.sin(s.age * 0.4 + s.ph);
      s.spd += (flowSpd - s.spd) * Math.min(1, dt * 0.8);
      s.p.x += FLOW.x * s.spd * dt + Math.sin(s.age * 0.31 + s.ph) * 0.03 * dt;
      s.p.z += FLOW.y * s.spd * dt;
      s.wh += (Math.sin(s.age * 0.23 + s.ph) * 0.25 - s.wh) * Math.min(1, dt * 0.5);
      s.h += s.wh * dt;
      koi.forEach((k) => {
        const d = Math.hypot(k.x - s.p.x, k.z - s.p.z);
        if (d < 0.35 && k.y > -0.2) { s.vr += (k.x - s.p.x) * dt * 6; s.vp += dt * 2; }

    it.v.y -= 4.2 * dt;

};

const pipe = new THREE.RenderPipeline(renderer);
const sp = pass(scene, camera, { samples: 0 });
const sCol = sp.getTextureNode('output');
const sZ = sp.getViewZNode();

const ripple = (p) => {
  const f = flowXZ(p);
  const a = fbm3(vec3(f.x.mul(4.5), f.y.mul(2.2).sub(uTime.mul(2.2)), uTime.mul(0.4)));
  const b = vn(vec3(f.x.mul(16.0), f.y.mul(9.0).sub(uTime.mul(3.0)), uTime.mul(0.9)));
  let rg = float(0.0);
  RINGS.forEach((R) => {
    const r = length(p.sub(R.xy));
    const front = R.w.mul(0.45);
    rg = rg.add(sin(r.mul(48.0).sub(R.w.mul(20.0))).mul(smoothstep(front.add(0.03), front.sub(0.12), r)).mul(smoothstep(front.sub(0.35), front.sub(0.05), r).mul(0.7).add(0.3)).mul(exp(R.w.mul(-1.4))).mul(R.z));
  });
  return a.mul(0.018).add(b.mul(0.007)).add(rg.mul(0.02));
};

const sky = (R) => {
  const el = R.y;
  const az = atan(R.x, R.z.negate());
  const blue = mix(vec3(0.55, 0.66, 0.95), vec3(0.2, 0.32, 0.85), smoothstep(0.6, 0.98, el)).mul(2.2);
  const line = float(0.94).add(fbm3(vec3(az.mul(1.6), 0.0, 3.0)).mul(0.08));
  const open = smoothstep(line.sub(0.06), line.add(0.05), el).mul(fbm3(vec3(R.xz.mul(1.8), 2.0)).mul(0.6).add(0.75).clamp(0.0, 1.0));
  return mix(vec3(0.01, 0.016, 0.01), blue, open);
};

const water = Fn(() => {
  const q = screenUV;
  const ndc = vec2(q.x.mul(2.0).sub(1.0), float(1.0).sub(q.y).mul(2.0).sub(1.0));
  const rv = uInvProj.mul(vec4(ndc, 1.0, 1.0));
  const D = normalize(uCamWorld.mul(vec4(rv.xyz.div(rv.w), 0.0)).xyz);
  const tS = uCamPos.y.negate().div(D.y);
  const S = uCamPos.add(D.mul(tS));
  const e = 0.015;
  const h0 = ripple(S.xz), hx = ripple(S.xz.add(vec2(e, 0))), hz = ripple(S.xz.add(vec2(0, e)));
  const n = normalize(vec3(h0.sub(hx).div(e), 1.0, h0.sub(hz).div(e)));
  const under = clamp(sZ.negate().sub(tS.mul(dot(D, uCamFwd))), 0.0, 1.4);
  const ruv = q.add(vec2(n.x, n.z).mul(0.09).mul(under));
  const refr = sCol.sample(ruv).rgb.add(vec3(0.006, 0.028, 0.008).mul(exp(under.mul(-1.8)).oneMinus()));
  const cs = max(dot(D.negate(), n), 0.0);
  const F = float(0.02).add(pow(cs.oneMinus(), 5.0).mul(0.98));
  const R = reflect(D, n);
  const env = sky(R);
  const glint = pow(max(dot(R, uSun), 0.0), 6000.0).mul(12.0);
  let foam = float(0.0);
  RINGS.forEach((Rg) => {
    const rr0 = length(S.xz.sub(Rg.xy));
    foam = foam.add(smoothstep(Rg.w.mul(0.12).add(0.14), 0.0, rr0).mul(exp(Rg.w.mul(-1.3))).mul(max(Rg.z.sub(1.0), 0.0)));
  });
  foam = foam.mul(smoothstep(-0.1, 0.5, fbm3(vec3(S.xz.mul(28.0), uTime.mul(1.5))))).clamp(0.0, 1.0);
  const col = refr.mul(F.oneMinus()).add(env.mul(F.mul(5.0))).add(vec3(1.0, 0.95, 0.85).mul(glint).mul(F.mul(4.0)));
  const above = smoothstep(0.0, 0.006, tS.mul(dot(D, uCamFwd)).sub(sZ.negate()));
  return vec4(mix(mix(col, vec3(0.62, 0.7, 0.68), foam.mul(0.75)), sCol.sample(q).rgb, above), 1.0);
})();

const wTex = convertToTexture(water);
const bl = bloom(wTex, 0.38, 0.8, 0.35);
const graded = convertToTexture(Fn(() => {
  const q = screenUV;
  const col = wTex.rgb.add(bl.rgb).toVar();
  const lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col.assign(mix(vec3(lum), col, 1.35));
  col.mulAssign(pow(q.x.mul(q.y).mul(q.x.oneMinus()).mul(q.y.oneMinus()).mul(16.0), 0.22));

pipe.outputNode = fxaa(graded);

const MODES = {
  sunlit: { water: 0.7, cut: 5200,  bed: 0.6, near: 0.5, music: 1.0, birds: 0.45, oct: 1 },
};
const CHORDS = [
  [146.83, 220.0, 329.63, 369.99, 554.37],
  [98.0, 146.83, 185.0, 246.94, 277.18],
  [123.47, 185.0, 220.0, 277.18, 293.66],
  [110.0, 164.81, 196.0, 246.94, 293.66],

const PENTA = [587.33, 659.25, 739.99, 880.0, 987.77, 1174.66, 1318.51];

const snd = (() => {
  let ctx = null, on = true, mode = 'sunlit';
  let master, rev, WN, PN, bus = {}, wCut, bedG = [], pad = null;

  const rr2 = (a, b) => a + (b - a) * Math.random();

    const b = ctx.createBuffer(1, ctx.sampleRate * sec, ctx.sampleRate), d = b.getChannelData(0);

    const len = Math.floor(ctx.sampleRate * 3.4), ir = ctx.createBuffer(2, len, ctx.sampleRate);

      const d = ir.getChannelData(ch);

        const x = i / len, k = 0.15 + 0.8 * x;
        lp = lp * k + (Math.random() * 2 - 1) * (1 - k);
        d[i] = lp * Math.pow(1 - x, 2.6) * (i < 400 ? i / 400 : 1);
      }
    }

  };
  const panTo = (dst, p, send = 0) => {
    const pn = ctx.createStereoPanner(); pn.pan.value = Math.max(-1, Math.min(1, p));
    pn.connect(dst);
    if (send) { const s = ctx.createGain(); s.gain.value = send; pn.connect(s).connect(rev); }

  };
  const env = (g, t, a, peak, d) => {

    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);

  // water: tiny rising noise drops, bubble chirps and a softly breathing flow bed
  const drop = (t, amp, dst) => {
    const s = ctx.createBufferSource(); s.buffer = WN;
    const f = rr2(500, 2600), len = rr2(0.012, 0.055);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = rr2(5, 14);
    bp.frequency.setValueAtTime(f, t); bp.frequency.exponentialRampToValueAtTime(f * rr2(1.2, 1.9), t + len);

    const dur = rr2(0.03, 0.09);
    const o = ctx.createOscillator();

    const g = ctx.createGain(); env(g, t, 0.004, amp, dur);

  };

    [[1100, 0.8, 0.14], [2400, 1.1, 0.08]].forEach(([f, q, a]) => {

  // music: a slow glassy pad drifting through four soft chords, with kalimba-like drops of light
  const chord = (t, notes, oct) => {
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(1, t + 4);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100 * oct + 300; lp.Q.value = 0.4;
    lp.connect(g).connect(bus.music);
    const s = ctx.createGain(); s.gain.value = 0.5; g.connect(s).connect(rev);
    const osc = [];
    notes.forEach((f, i) => {
      [[-5, 'sine', 0.006], [6, 'triangle', 0.003]].forEach(([dt, ty, a]) => {
        const o = ctx.createOscillator(); o.type = ty; o.frequency.value = f * oct; o.detune.value = dt + rr2(-2, 2);

  };

    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1800; hp.connect(d);
    const kind = Math.random();
    if (kind < 0.6) {
      const f0 = rr2(2800, 4600), n = Math.floor(rr2(3, 8)), gap = rr2(0.07, 0.14);
      for (let k = 0; k < n; k++) {
        const tk = t + k * gap, len = rr2(0.03, 0.07);
        const o = ctx.createOscillator();
        o.frequency.setValueAtTime(f0 * rr2(0.95, 1.05), tk); o.frequency.exponentialRampToValueAtTime(f0 * rr2(0.65, 1.35), tk + len);
        const g = ctx.createGain(); env(g, tk, 0.005, rr2(0.006, 0.014), len);

      }
    } else {
      const f0 = rr2(5200, 6800), len = rr2(0.35, 0.7);
      const o = ctx.createOscillator();
      o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 0.82, t + len);
      const vib = ctx.createOscillator(); vib.frequency.value = rr2(18, 30);
      const vg = ctx.createGain(); vg.gain.value = f0 * 0.015; vib.connect(vg).connect(o.frequency);
      const g = ctx.createGain(); env(g, t, 0.05, rr2(0.004, 0.008), len);
      o.connect(g).connect(hp); o.start(t); vib.start(t); o.stop(t + len + 0.05); vib.stop(t + len + 0.05);
    }
  };

  const applyMode = (t, k = 1.2) => {
    const m = MODES[mode];
    bus.water.gain.setTargetAtTime(m.water, t, k);
    bus.bed.gain.setTargetAtTime(m.bed, t, k);
    bus.near.gain.setTargetAtTime(m.near, t, k);
    bus.music.gain.setTargetAtTime(m.music, t, k);
    bus.birds.gain.setTargetAtTime(m.birds, t, k);
    wCut.frequency.setTargetAtTime(m.cut, t, k * 0.6);
  };

  return {
    get on() { return on; },
    get mode() { return mode; },
    wake() {
      if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = on ? 0.6 : 0;
      const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 2.5; comp.attack.value = 0.02;
      master.connect(comp).connect(ctx.destination);
      rev = room(); const rg = ctx.createGain(); rg.gain.value = 0.32; rev.connect(rg).connect(master);
      wCut = ctx.createBiquadFilter(); wCut.type = 'lowpass'; wCut.Q.value = 0.6; wCut.connect(master);
      ['water', 'bed', 'near'].forEach((k) => { bus[k] = ctx.createGain(); bus[k].gain.value = 0; bus[k].connect(wCut); });
      ['music', 'birds'].forEach((k) => { bus[k] = ctx.createGain(); bus[k].gain.value = 0; bus[k].connect(master); });

    set(v) { on = v; if (ctx) master.gain.setTargetAtTime(on ? 0.6 : 0, ctx.currentTime, 0.2); },
    setMode(m) {

    tick(dt, stir) {

      while (tGrain < end) { if (m.water > 0.01) drop(Math.max(tGrain, now), rr2(0.04, 0.16) * Math.min(2, busy), bus.water); tGrain += rr2(0.012, 0.05) / busy; }
      while (tBub < end) { bubble(Math.max(tBub, now), rr2(0.014, 0.05) * Math.min(2, busy), rr2(450, 1700), rr2(-0.8, 0.8), bus.near); tBub += rr2(0.05, 0.25) / busy; }
      if (tRun < end) {
        const f = rr2(380, 900), p = rr2(-0.6, 0.6);
        for (let k = 0; k < 6; k++) bubble(Math.max(tRun, now) + k * rr2(0.025, 0.06), rr2(0.012, 0.028), f * rr2(0.9, 1.3), p, bus.near);
        tRun = now + rr2(0.8, 2.6);
      }
      if (now > tSwell) { bedG.forEach(({ g, a }) => g.gain.setTargetAtTime(a * rr2(0.55, 1.15), now, 0.12)); tSwell = now + rr2(0.08, 0.25); }
      if (now > tChord) { if (m.music > 0.01) nextChord(now); tChord = now + rr2(11, 15); }
      if (now > tPluck) {
        if (m.music > 0.01) {
          const n = Math.random() < 0.3 ? Math.floor(rr2(2, 4)) : 1;
          let idx = Math.floor(rr2(0, PENTA.length));
          for (let k = 0; k < n; k++) { pluck(now + 0.02 + k * rr2(0.16, 0.3), PENTA[idx], 0.05); idx = Math.max(0, Math.min(PENTA.length - 1, idx + pick([-2, -1, 1, 2]))); }
        }
        tPluck = now + rr2(2.5, 6.5);
      }
      if (now > tBird) { if (m.birds > 0.01) bird(now + 0.02); tBird = now + (Math.random() < 0.3 ? rr2(0.6, 1.4) : rr2(6, 16)); }
    },
    plop(p) {
      if (!ctx || !on) return;
      const t = ctx.currentTime + 0.12;
      for (let k = 0; k < 3; k++) { const tk = t + k * rr2(0.02, 0.05); bubble(tk, rr2(0.02, 0.035), rr2(1400, 2400), p + rr2(-0.1, 0.1), bus.near); drop(tk, rr2(0.03, 0.05), bus.water); }
    },
    boat(p) {

      const tap = ctx.createBufferSource(); tap.buffer = WN;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = rr2(900, 1300); bp.Q.value = 1.2;
      const g = ctx.createGain(); env(g, t, 0.003, 0.07, 0.07);
      tap.connect(bp).connect(g).connect(d); tap.start(t, Math.random()); tap.stop(t + 0.12);
      for (let k = 0; k < 8; k++) drop(t + rr2(0.05, 0.5), rr2(0.03, 0.06), bus.water);
      for (let k = 0; k < 5; k++) bubble(t + 0.04 + k * rr2(0.03, 0.08), rr2(0.008, 0.02), rr2(700, 1600), p + rr2(-0.1, 0.1), bus.near);
      if (MODES[mode].music > 0.01) pluck(t + 0.15, pick(PENTA), 0.035);
    },
    reroll() {
      if (!ctx || !on) return;
      const t = ctx.currentTime + 0.02;
      [0, 2, 4].forEach((n, k) => pluck(t + k * 0.09, PENTA[(n + Math.floor(Math.random() * 3)) % PENTA.length], 0.035));
      for (let k = 0; k < 6; k++) bubble(t + k * rr2(0.03, 0.07), rr2(0.008, 0.018), rr2(900, 1800), rr2(-0.5, 0.5), bus.near);
    },
    gulp(p) {
      if (!ctx || !on) return;
      const t = ctx.currentTime + 0.01;
      bubble(t, 0.06, rr2(170, 230), p, bus.near);
      for (let k = 0; k < 4; k++) bubble(t + 0.05 + k * rr2(0.03, 0.06), rr2(0.01, 0.02), rr2(700, 1500), p + rr2(-0.15, 0.15), bus.near);
      if (MODES[mode].music > 0.01 && Math.random() < 0.5) pluck(t + 0.1, pick(PENTA), 0.03);
    },
  };
})();

////////////////////////////////////////////////////////////////
//// TOGGLE
////////////////////////////////////////////////////////////////

const sndBtn = document.querySelector('[data-snd]');
sndBtn.addEventListener('click', () => {
  snd.wake();
  snd.set(!snd.on);
  sndBtn.setAttribute('aria-pressed', String(snd.on));
  sndBtn.textContent = snd.on ? 'Sound on' : 'Sound off';
});
let clickMode = 'boat';
const clickBtns = [...document.querySelectorAll('[data-click]')];
clickBtns.forEach((b) => b.addEventListener('click', () => {
  clickMode = b.dataset.click;
  clickBtns.forEach((q) => q.setAttribute('aria-pressed', String(q === b)));
  document.querySelector('.tag').textContent = clickMode === 'food' ? 'Drag to look · click to throw breadcrumbs' : 'Drag to look · click to launch a paper boat';
}));
document.querySelector('[data-reroll]').addEventListener('click', () => { rerollKoi(); snd.reroll(); });
document.getElementById('picker').addEventListener('pointerdown', () => snd.wake());

////////////////////////////////////////////////////////////////
//// ORBIT
////////////////////////////////////////////////////////////////

const view = { yaw: parseFloat(QS.get('yaw')) || 0, pitch: parseFloat(QS.get('pitch')) || 0, vy: 0, vp: 0, drag: false, moved: 0, x: 0, y: 0 };
let camK = 1;
const placeCam = (t) => {
  view.yaw = Math.max(-0.7, Math.min(0.7, view.yaw));
  view.pitch = Math.max(-0.35, Math.min(0.3, view.pitch));
  const el = 1.02 + view.pitch + Math.sin(t * 0.31) * 0.012, az = view.yaw + Math.sin(t * 0.23) * 0.02, r = 5.3 * camK;
  camera.position.set(LOOK.x + Math.sin(az) * Math.cos(el) * r, LOOK.y + Math.sin(el) * r, LOOK.z + Math.cos(az) * Math.cos(el) * r);
  camera.lookAt(LOOK.x + Math.sin(t * 0.4) * 0.02, LOOK.y, LOOK.z + Math.cos(t * 0.27) * 0.03);
};
const cv = renderer.domElement;
const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), ray = new THREE.Raycaster(), ndcV = new THREE.Vector2(), hit = new THREE.Vector3();
cv.addEventListener('pointerdown', (e) => { snd.wake(); view.drag = true; view.moved = 0; view.x = e.clientX; view.y = e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', (e) => {
  if (!view.drag) return;
  const dx = e.clientX - view.x, dy = e.clientY - view.y;
  view.moved += Math.abs(dx) + Math.abs(dy);
  view.vy = -dx * 0.003; view.vp = dy * 0.0025;
  view.yaw += view.vy; view.pitch += view.vp;
  view.x = e.clientX; view.y = e.clientY;
});
cv.addEventListener('pointerup', (e) => {
  view.drag = false;
  if (view.moved > 6) return;
  ndcV.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndcV, camera);
  if (ray.ray.intersectPlane(plane, hit)) {
    if (clickMode === 'food') dropFood(hit.x, hit.z);
    else launchBoat(hit.x, hit.z);
  }
});

////////////////////////////////////////////////////////////////
//// LOOP
////////////////////////////////////////////////////////////////

const fit = () => {
  camera.aspect = innerWidth / innerHeight;
  camK = Math.max(1, 0.72 / camera.aspect);
  camera.fov = camera.aspect < 1 ? 50 : 42;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
};
window.addEventListener('resize', fit);
fit();

let tt = parseFloat(QS.get('t')) || 0;
placeCam(tt);
await renderer.compileAsync(scene, camera);
const clock = new THREE.Timer();
let first = true;
const fwd = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  clock.update();
  const dt = QS.has('freeze') ? 0 : Math.min(clock.getDelta(), 0.05);
  tt += dt;
  uTime.value = tt;
  if (!view.drag) { view.yaw += view.vy; view.pitch += view.vp; view.vy *= 0.92; view.vp *= 0.92; }
  placeCam(tt);
  updateKoi(dt);
  updateBoats(dt);
  snd.tick(dt, koi.reduce((a, k) => a + k.gulp, 0) * 0.3);
  camera.updateMatrixWorld();
  uInvProj.value.copy(camera.projectionMatrixInverse);
  uCamWorld.value.copy(camera.matrixWorld);
  uCamPos.value.copy(camera.position);
  camera.getWorldDirection(fwd); uCamFwd.value.copy(fwd);
  if (QS.has('nopost')) renderer.render(scene, camera); else pipe.render();
  window.__frames = (window.__frames || 0) + 1;
  if (QS.has('frames') && window.__frames >= +QS.get('frames')) { renderer.setAnimationLoop(null); window.__done = true; }
  if (first) { first = false; document.getElementById('loading').classList.add('off'); window.__ready = true; }
});
</script>
</body>
</html>
