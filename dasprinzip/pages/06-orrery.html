  nebula: 1.0,
  bloom: 0.35,
  exposure: 0.85,
  wobble: 0.4
};

const uTime = uniform(0);
const uIor = uniform(P.ior);
const uGalaxy = uniform(P.galaxy);
const uCore = uniform(P.core);
const uStars = uniform(P.stars);
const uNebula = uniform(P.nebula);
const uWobble = uniform(P.wobble);
const uGal = uniform(new THREE.Matrix3());
const uGalN = uniform(new THREE.Vector3(0, 1, 0));
const GS = 0.92;

////////////////////////////////////////////////////////////////
//// HASH / ENV
////////////////////////////////////////////////////////////////

const hash13 = Fn(([q]) => {
  const p3 = fract(q.mul(0.1031)).toVar();
  p3.addAssign(dot(p3, p3.zyx.add(31.32)));
  return fract(p3.x.add(p3.y).mul(p3.z));
});

const hash33 = Fn(([q]) => {
  const v = vec3(dot(q, vec3(127.1, 311.7, 74.7)), dot(q, vec3(269.5, 183.3, 246.1)), dot(q, vec3(113.5, 271.9, 124.6)));
  return fract(sin(v).mul(43758.5453));
});

const hashS = Fn(([q]) => fract(sin(dot(q, vec3(419.2, 371.9, 91.7))).mul(43758.5453)));

const vnoise = Fn(([x]) => {
  const i = floor(x);
  const f = fract(x);
  const u = f.mul(f).mul(f.mul(-2.0).add(3.0));
  const a = hash13(i);
  const b = hash13(i.add(vec3(1, 0, 0)));
  const c = hash13(i.add(vec3(0, 1, 0)));
  const d = hash13(i.add(vec3(1, 1, 0)));
  const e = hash13(i.add(vec3(0, 0, 1)));
  const g = hash13(i.add(vec3(1, 0, 1)));
  const h = hash13(i.add(vec3(0, 1, 1)));
  const k = hash13(i.add(vec3(1, 1, 1)));
  const z0 = mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
  const z1 = mix(mix(e, g, u.x), mix(h, k, u.x), u.y);
  return mix(z0, z1, u.z).mul(2.0).sub(1.0);
});

const vnoise3 = (x) => vec3(vnoise(x), vnoise(x.add(vec3(17.1, 3.7, 9.2))), vnoise(x.add(vec3(-5.3, 11.9, 2.4))));

const fbm = Fn(([x]) => {
  const v = float(0).toVar();
  const a = float(0.5).toVar();
  const q = vec3(x).toVar();
  Loop(4, () => {
    v.addAssign(vnoise(q).mul(a));
    q.assign(q.mul(2.03).add(vec3(1.7, 9.2, 3.1)));
    a.mulAssign(0.5);
  });
  return v;
});

const AMBER = vec3(1.0, 0.56, 0.2);

const env = Fn(([d]) => {
  const y = d.y;
  const c = mix(vec3(0.004, 0.005, 0.009), vec3(0.035, 0.042, 0.06), smoothstep(-0.2, 0.9, y)).toVar();
  c.addAssign(AMBER.mul(pow(max(dot(d, normalize(vec3(-0.25, 0.0, -1.0))), 0.0), 8.0)).mul(1.2).mul(smoothstep(0.3, 0.0, y)));
  c.addAssign(vec3(1.0, 0.82, 0.6).mul(smoothstep(0.93, 0.975, dot(d, normalize(vec3(-0.55, 0.75, 0.35))))).mul(5.0));
  c.addAssign(vec3(1.0, 0.68, 0.36).mul(smoothstep(0.9, 0.965, dot(d, normalize(vec3(0.95, 0.3, -0.15))))).mul(3.5));
  c.addAssign(vec3(0.45, 0.55, 0.8).mul(pow(max(y, 0.0), 8.0)).mul(0.22));
  return mix(c, vec3(0.012, 0.009, 0.007), smoothstep(0.02, -0.12, y));
});

const toWorld = (d) => normalize(modelWorldMatrix.mul(vec4(d, 0.0)).xyz);

////////////////////////////////////////////////////////////////
//// STARS (3D DDA THROUGH CELL GRID)
////////////////////////////////////////////////////////////////

const starCell = (cell, N, ro, rd, tFar, Tend, seed, big, Minv, off) => {
  const h1 = hash33(cell.add(seed));
  const spL = cell.add(h1.mul(big ? 0.5 : 0.7).add(big ? 0.25 : 0.15)).div(N);
  const sp = Minv.mul(spL.sub(off));
  const v = spL.sub(ro);
  const t = dot(v, rd);
  const d = length(v.sub(rd.mul(t)));
  const g = uGal.mul(sp).div(GS);
  const gg = g.mul(vec3(1.0, 1.8, 1.0));
  const side = smoothstep(0.45, 0.95, max(abs(sp.x), abs(sp.z)));
  const w = big ? float(0.08).add(side.mul(0.55)) : float(0.06).add(exp(dot(gg, gg).mul(-1.7)).mul(1.5));
  const h2 = hashS(cell.add(seed).add(17.3));
  const inBox = step(max(abs(sp.x), max(abs(sp.y), abs(sp.z))), 0.95);
  const on = step(h2, w.mul(big ? 0.4 : 0.6).mul(uStars)).mul(step(0.0, t)).mul(step(t, tFar)).mul(inBox);
  const mag = pow(hashS(cell.add(seed).add(vec3(5.1, -3.3, 7.7))), big ? 2.0 : 9.0);
  const r0 = float(big ? 0.009 : 0.0034).add(mag.mul(big ? 0.012 : 0.0035));
  const tw = sin(uTime.mul(h1.x.mul(5.0).add(2.0)).add(h2.mul(60.0))).mul(0.4).add(0.6);
  const x = d.div(r0);
  const core = exp(x.mul(x).negate());
  const b = core.mul(mag.mul(big ? 1.6 : 5.0).add(big ? 0.35 : 0.45)).mul(tw);
  const warm = exp(dot(g, g).mul(-6.0));
  const tint = big ? mix(vec3(1.0, 0.72, 0.38), vec3(1.0, 0.86, 0.6), h1.y) : mix(mix(vec3(0.85, 0.9, 1.0), vec3(1.0, 0.95, 0.85), h1.y), vec3(1.0, 0.8, 0.55), warm.mul(0.5));
  const att = mix(1.0, Tend, smoothstep(0.35, 0.65, t.div(tFar)));
  return tint.mul(b).mul(on).mul(att);
};

const rng = (() => { let a = 1337; return () => { a = (a * 16807) % 2147483647; return a / 2147483647; }; })();
const makeLayer = () => {
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rng() * 6.283, rng() * 6.283, rng() * 6.283));
  const m4 = new THREE.Matrix4().makeRotationFromQuaternion(q);
  const M = new THREE.Matrix3().setFromMatrix4(m4);
  const Minv = M.clone().transpose();
  return { M: uniform(M), Minv: uniform(Minv), off: vec3(rng() * 7.0 + 3.0, rng() * 7.0 + 3.0, rng() * 7.0 + 3.0) };
};
const LAYERS = [makeLayer(), makeLayer(), makeLayer(), makeLayer()];

const starLayer = (roO, rdO, tFar, Tend, N, maxIt, seed, big, L, cands) => {
  const ro = L.M.mul(roO).add(L.off);
  const rd = L.M.mul(rdO);
  const acc = vec3(0).toVar();
  const rds = rd.add(sign(rd).mul(1e-5)).add(vec3(1e-6));
  const cell = floor(ro.mul(N)).toVar();
  const stp = sign(rds);
  const tDel = abs(vec3(1.0).div(rds)).div(N);
  const tMax = cell.add(max(stp, 0.0)).div(N).sub(ro).div(rds).toVar();
  Loop(maxIt, () => {
    for (let k = 0; k < cands; k++) acc.addAssign(starCell(cell, N, ro, rd, tFar, Tend, seed + 47.3 * k, big, L.Minv, L.off));
    If(min(tMax.x, min(tMax.y, tMax.z)).greaterThan(tFar), () => { Break(); });
    If(tMax.x.lessThan(tMax.y).and(tMax.x.lessThan(tMax.z)), () => {
      cell.x.addAssign(stp.x); tMax.x.addAssign(tDel.x);
    }).ElseIf(tMax.y.lessThan(tMax.z), () => {
      cell.y.addAssign(stp.y); tMax.y.addAssign(tDel.y);
    }).Else(() => {
      cell.z.addAssign(stp.z); tMax.z.addAssign(tDel.z);
    });
  });
  return acc;
};

////////////////////////////////////////////////////////////////
//// CUBE SHADER
////////////////////////////////////////////////////////////////

const B = 0.965;

const LOWQ = (() => {
  const q = new URLSearchParams(location.search);
  if (q.has('hq')) return false;
  if (q.has('lq')) return true;
  const coarse = matchMedia('(pointer: coarse)').matches;
  const small = Math.min(screen.width, screen.height) < 820;
  return coarse && small || /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
})();

const makeCubeMaterial = (isMirror) => {
  const STEPS = isMirror ? 28 : 64;
  const mat = new THREE.MeshBasicNodeMaterial();

  mat.fragmentNode = Fn(() => {
    const camL = modelWorldMatrixInverse.mul(vec4(cameraPosition, 1.0)).xyz;
    const p0 = positionLocal;
    const rd = normalize(p0.sub(camL));
    const ng = normalize(normalLocal);
    const n = normalize(ng.add(vnoise3(p0.mul(1.3)).mul(0.1).add(vnoise3(p0.mul(4.5)).mul(0.035)).mul(uWobble)));

    const cosI = max(dot(rd.negate(), n), 0.0);
    const F = float(0.04).add(pow(float(1.0).sub(cosI), 5.0).mul(0.96));
    const reflCol = env(toWorld(reflect(rd, n)));

    const rdi = normalize(refract(rd, n, float(1.0).div(uIor)));
    const ro = p0.clamp(-B, B);

    const ta = vec3(B).sub(ro).div(rdi);
    const tb = vec3(-B).sub(ro).div(rdi);
    const tf = max(ta, tb);
    const tFar = max(min(tf.x, min(tf.y, tf.z)), 0.0);

    const col = vec3(0).toVar();
    const T = vec3(1).toVar();
    const jit = interleavedGradientNoise(screenCoordinate.xy);

      const SC = isMirror ? (LOWQ ? 6 : 12) : (LOWQ ? 12 : 20);
      const dsc = tFar.div(SC);
      const tc = dsc.mul(jit).toVar();
      const colC = vec3(0).toVar();
      Loop(SC, () => {
        const p = ro.add(rdi.mul(tc));
        const g = uGal.mul(p).div(GS);
        const haloE = vec3(0.55, 0.66, 1.0).mul(exp(length(g.mul(vec3(1.0, 1.7, 1.0))).mul(-3.4))).mul(0.1);
        const glowE = vec3(1.0, 0.7, 0.4).mul(exp(length(g.mul(vec3(1.0, 2.0, 1.0))).mul(-8.0))).mul(0.45).mul(uCore);
        const neb = pow(vnoise(p.mul(1.25).add(vec3(0.0, 0.0, uTime.mul(0.02)))).mul(0.5).add(0.5), 2.0);
        const nebE = vec3(0.12, 0.24, 0.7).mul(neb).mul(0.22).mul(uNebula);
        colC.addAssign(haloE.add(glowE).add(nebE).mul(dsc));
        tc.addAssign(dsc);
      });

      const SG = isMirror ? (LOWQ ? 14 : 24) : (LOWQ ? 30 : 56);
      const H = float(0.2 * 0.92);
      const hp = dot(uGalN, ro);
      const hd = dot(uGalN, rdi);
      const hds = select(abs(hd).lessThan(1e-4), float(1e-4), hd);
      const t1 = H.negate().sub(hp).div(hds);
      const t2 = H.sub(hp).div(hds);
      const sa = clamp(min(t1, t2), 0.0, tFar);
      const sb = clamp(max(t1, t2), 0.0, tFar);
      const dsg = sb.sub(sa).div(SG);
      const tg = sa.add(dsg.mul(jit)).toVar();

      Loop(SG, () => {
        const p = ro.add(rdi.mul(tg));
        const g = uGal.mul(p).div(GS);
        const r = length(g.xz);
        const h = g.y;
        const ang = atan(g.z, g.x);
        const sp = ang.sub(log(r.add(0.02)).mul(2.6));
        const cs = vec2(cos(sp), sin(sp));
        const warp = vnoise(g.mul(vec3(3.0, 5.0, 3.0))).mul(0.7);
        const arm = pow(cos(sp.mul(2.0).add(warp)).mul(0.5).add(0.5), 3.0);
        const lane = pow(cos(sp.mul(2.0).add(warp).add(0.95)).mul(0.5).add(0.5), 4.0);
        const fil = vnoise(vec3(cs.mul(2.5), r.mul(26.0)).add(vec3(0.0, 0.0, h.mul(30.0)))).mul(0.5).add(0.5);
        const fil2 = vnoise(vec3(cs.mul(5.0), r.mul(55.0)).add(vec3(7.3, 1.1, h.mul(60.0)))).mul(0.5).add(0.5);
        const fibre = fil.mul(0.65).add(fil2.mul(0.35));

        const thick = r.mul(0.03).add(0.016);
        const vert = exp(h.mul(h).div(thick.mul(thick)).negate());
        const radial = exp(r.mul(-1.6)).mul(smoothstep(1.0, 0.55, r));
        const disc = vert.mul(radial);

        const armC = mix(vec3(1.0, 0.78, 0.4), vec3(1.0, 0.36, 0.1), smoothstep(0.15, 0.65, r));
        const armE = armC.mul(disc).mul(arm.mul(2.4).add(0.25)).mul(fibre.mul(1.3).add(0.25)).mul(24.0).mul(uGalaxy);

        const cd = length(g.mul(vec3(0.75, 2.6, 0.75)));
        const coreE = vec3(1.0, 0.95, 0.82).mul(exp(cd.mul(-14.0))).mul(90.0).add(vec3(1.0, 0.78, 0.4).mul(exp(cd.mul(-6.5))).mul(3.0)).mul(uCore);

        const dvert = exp(h.mul(h).div(thick.mul(thick).mul(0.55)).negate());
        const dark = smoothstep(0.45, 0.8, fibre).mul(1.4).add(0.15);
        const dust = dvert.mul(radial).mul(lane.mul(1.6).add(arm.mul(0.4))).mul(dark).mul(smoothstep(0.08, 0.3, r)).mul(280.0).mul(uGalaxy);

        col.addAssign(T.mul(armE.add(coreE)).mul(dsg));
        T.mulAssign(exp(vec3(0.85, 1.3, 1.8).mul(dust).mul(dsg).negate()));
        tg.addAssign(dsg);
      });

      col.addAssign(colC.mul(mix(vec3(1.0), T, 0.5)));

    const Tend = dot(T, vec3(0.333));
    const starsBig = starLayer(ro, rdi, tFar, Tend, 5.0, 32, 91.7, true, LAYERS[0], 1);
    const stars = isMirror ? starsBig : LOWQ
      ? starsBig.add(starLayer(ro, rdi, tFar, Tend, 10.0, 48, 0.0, false, LAYERS[1], 3))
      : starsBig
        .add(starLayer(ro, rdi, tFar, Tend, 9.0, 44, 0.0, false, LAYERS[1], 3))
        .add(starLayer(ro, rdi, tFar, Tend, 11.0, 52, 13.0, false, LAYERS[2], 3))
        .add(starLayer(ro, rdi, tFar, Tend, 13.0, 60, 29.0, false, LAYERS[3], 2));

    const pe = ro.add(rdi.mul(tFar));
    const ape = abs(pe);
    const ne = select(ape.x.greaterThan(max(ape.y, ape.z)), vec3(sign(pe.x), 0, 0),
      select(ape.y.greaterThan(ape.z), vec3(0, sign(pe.y), 0), vec3(0, 0, sign(pe.z))));
    const outD = refract(rdi, ne.negate(), uIor);
    const tir = step(dot(outD, outD), 0.01);
    const exitD = normalize(mix(outD, reflect(rdi, ne.negate()), tir));
    const exitCol = env(toWorld(exitD)).mul(mix(vec3(1.0, 0.86, 0.7), vec3(0.22, 0.3, 0.45), tir));

    const sec = ape.x.add(ape.y).add(ape.z).sub(max(ape.x, max(ape.y, ape.z))).sub(min(ape.x, min(ape.y, ape.z)));
    const edgeIn = AMBER.mul(smoothstep(0.86, 0.965, sec)).mul(0.1);

    const sideMask = float(1.0).sub(smoothstep(0.55, 0.9, abs(ng.y)));
    const topMask = smoothstep(0.55, 0.9, ng.y);
    const hy = p0.y.add(pe.y).mul(0.5);
    const deep = vec3(0.04, 0.085, 0.21).mul(exp(hy.add(0.1).mul(hy.add(0.1)).mul(-3.5)).mul(0.9).add(0.3));
    const interior = col.add(stars).add(T.mul(exitCol.add(edgeIn).add(deep))).toVar();

    const graze = smoothstep(0.3, 0.85, float(1.0).sub(cosI)).mul(sideMask);
    const HONEY = vec3(1.0, 0.6, 0.24);
    interior.assign(mix(interior, interior.mul(HONEY).mul(1.4).add(HONEY.mul(0.32)), graze.mul(0.8)));
    interior.mulAssign(mix(1.0, 0.32, topMask));

    const bandN = vnoise(vec3(p0.x.add(p0.z).mul(3.0), p0.y.mul(9.0), 0.0)).mul(0.3).add(0.7);
    const band = vec3(0.72, 0.84, 1.0).mul(smoothstep(-0.68, -0.9, p0.y)).mul(smoothstep(-1.0, -0.9, p0.y.add(0.07))).mul(sideMask).mul(bandN).mul(0.6);
    interior.addAssign(band);

    const bevel = float(1.0).sub(max(abs(ng.x), max(abs(ng.y), abs(ng.z))));
    const rim = AMBER.mul(smoothstep(0.03, 0.3, bevel)).mul(0.4).add(vec3(1.0, 0.85, 0.65).mul(pow(smoothstep(0.1, 0.42, bevel), 3.0)).mul(0.6));

    const outCol = mix(interior, reflCol, F).add(rim).toVar();

    if (isMirror) {
      const fade = smoothstep(1.0, -1.0, positionLocal.y);
      outCol.mulAssign(fade.mul(fade).mul(fade).mul(0.32));
    }

    return vec4(outCol, 1.0);
  })();

  return mat;
};

////////////////////////////////////////////////////////////////
//// FLOOR SHADER
////////////////////////////////////////////////////////////////

const bgColor = Fn(([uvs]) => {
  const y = uvs.y;
  const c = mix(vec3(0.03, 0.034, 0.044), vec3(0.012, 0.013, 0.017), smoothstep(0.1, 0.8, y));
  const spot = exp(length(uvs.sub(vec2(0.62, 0.18)).mul(vec2(1.0, 1.4))).mul(-3.0));
  return c.add(vec3(0.035, 0.04, 0.05).mul(spot));
});

const makeFloorMaterial = () => {
  const mat = new THREE.MeshBasicNodeMaterial({ transparent: true, depthWrite: true });
  mat.fragmentNode = Fn(() => {
    const fp = positionWorld.xz;
    const dist = length(fp);
    const bg = bgColor(screenUV);
    const near = vec3(0.008, 0.009, 0.012);
    const glow = AMBER.mul(exp(dist.mul(dist).mul(-0.8))).mul(0.07).add(vec3(0.4, 0.5, 0.8).mul(exp(dist.mul(dist).mul(-2.0))).mul(0.025));
    const far = smoothstep(1.2, 6.5, dist);
    const c = mix(near.add(glow), bg, far);
    const a = mix(0.5, 1.0, smoothstep(1.0, 3.0, dist));
    return vec4(c, a);
  })();
  return mat;
};

//// SCENE

const renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: new URLSearchParams(location.search).has('webgl') });
const QS = new URLSearchParams(location.search);
const PR_MAX = Math.min(window.devicePixelRatio, LOWQ ? 1.0 : 1.5) * (parseFloat(QS.get('scale')) || 1);
const PR_MIN = LOWQ ? 0.5 : 0.75;
let pr = PR_MAX;
renderer.setPixelRatio(pr);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = P.exposure;

const scene = new THREE.Scene();
scene.backgroundNode = bgColor(screenUV);

const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -0.15, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.49;

const fitDistance = () => {
  const a = window.innerWidth / window.innerHeight;
  return a < 1 ? 8.4 / Math.max(a, 0.42) * 0.68 : 8.4;
};
const fitCamera = (keepDir) => {
  const dir = keepDir ? camera.position.clone().sub(controls.target).normalize() : new THREE.Vector3(0, 0.36, 1).normalize();
  camera.position.copy(dir.multiplyScalar(fitDistance())).add(controls.target);
};
fitCamera();

const makeIceGeometry = () => {
  let g = new RoundedBoxGeometry(2, 2, 2, 28, 0.3);
  g.deleteAttribute('normal');
  g.deleteAttribute('uv');
  g = mergeVertices(g, 1e-4);
  const pos = g.attributes.position;
  const v = new THREE.Vector3();
  const sm = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
  const hh = (x, y, z) => { const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return s - Math.floor(s); };
  const fd = (t) => t * t * (3 - 2 * t);
  const vn = (x, y, z) => {
    const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
    const ux = fd(x - ix), uy = fd(y - iy), uz = fd(z - iz);
    const L = (a, b, t) => a + (b - a) * t;
    const c = (dx, dy, dz) => hh(ix + dx, iy + dy, iz + dz);
    return L(L(L(c(0,0,0), c(1,0,0), ux), L(c(0,1,0), c(1,1,0), ux), uy), L(L(c(0,0,1), c(1,0,1), ux), L(c(0,1,1), c(1,1,1), ux), uy), uz) * 2 - 1;
  };
  const n3 = (x, y, z) =>
    Math.sin(1.7 * x + 2.3 * y + 0.4) * Math.sin(1.3 * z - 1.9 * y + 1.1) +
    0.5 * Math.sin(3.1 * x - 2.7 * z + 2.0) * Math.sin(2.9 * y + 1.7 * x) +
    0.25 * Math.sin(5.3 * z + 4.1 * y) * Math.sin(4.7 * x - 0.6);
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const w = sm(-1.0, -0.55, v.y);
    const dir = v.clone().normalize();
    const dents = 0.045 * vn(v.x * 4.2 + 3.1, v.y * 4.2 + 7.7, v.z * 4.2 + 1.3) + 0.022 * vn(v.x * 8.0 + 11.0, v.y * 8.0 + 2.0, v.z * 8.0 + 5.0) + 0.008 * vn(v.x * 15.0, v.y * 15.0 + 9.0, v.z * 15.0);
    const d = (0.035 * vn(v.x * 1.4 + 20.0, v.y * 1.4, v.z * 1.4 + 4.0) + dents - 0.02) * (0.35 + 0.65 * w);
    v.addScaledVector(dir, d);
    const top = sm(0.45, 1.0, v.y);
    v.y += top * (0.045 * Math.sin(v.x * 2.2 + 0.8) * Math.cos(v.z * 1.6 - 0.3) - 0.03 * (1.0 - (v.x * v.x + v.z * v.z) * 0.5));
    const tw = 0.04 * (v.y + 1.0) * 0.5;
    const cx = Math.cos(tw), sx = Math.sin(tw);
    const x = v.x * cx - v.z * sx, z = v.x * sx + v.z * cx;
    const taper = 1.0 + 0.025 * (v.y + 1.0) * 0.5;
    pos.setXYZ(i, x * taper, v.y, z * taper);
  }
  g.computeVertexNormals();
  return g;
};

const b64 = (str, T) => { const bin = atob(str); const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return new T(u8.buffer); };

const makeObjGeometry = () => {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(b64(ICE.p, Float32Array), 3));
  g.setAttribute('normal', new THREE.BufferAttribute(b64(ICE.n, Float32Array), 3));
  g.setIndex(new THREE.BufferAttribute(b64(ICE.i, Uint16Array), 1));
  return g;
};

const GEO = { obj: makeObjGeometry(), procedural: makeIceGeometry() };
P.cube = QS.get('mesh') === 'proc' ? 'procedural' : 'obj';
const geo = GEO[P.cube];

const cube = new THREE.Mesh(geo, makeCubeMaterial(false));
scene.add(cube);

const mirror = new THREE.Mesh(geo, makeCubeMaterial(true));
mirror.position.y = -2.0;
mirror.scale.y = -1;
scene.add(mirror);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), makeFloorMaterial());
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.0;
ground.renderOrder = 2;
scene.add(ground);


////////////////////////////////////////////////////////////////
//// AUDIO · GLASS ORRERY
////////////////////////////////////////////////////////////////

const Audio = (() => {
  let ctx = null, out, room, roomIn, echo;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);

  const roomIR = (sec) => {
    const len = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = b.getChannelData(c);
      for (let i = 0; i < len; i++) { const t = i / len; d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 3.2) * (1 - Math.exp(-i / 400)); }
    }
    return b;
  };

  const bus = () => {
    out = ctx.createGain(); out.gain.value = 0;
    const lim = ctx.createDynamicsCompressor(); lim.threshold.value = -14; lim.ratio.value = 6; lim.attack.value = 0.004;
    out.connect(lim).connect(ctx.destination);
    room = ctx.createConvolver(); room.buffer = roomIR(4.2);
    const roomHP = ctx.createBiquadFilter(); roomHP.type = 'highpass'; roomHP.frequency.value = 220;
    const roomG = ctx.createGain(); roomG.gain.value = 0.9;
    roomIn = ctx.createGain();
    roomIn.connect(roomHP).connect(room).connect(roomG).connect(out);
    const eL = ctx.createDelay(3), eR = ctx.createDelay(3), fbL = ctx.createGain(), fbR = ctx.createGain(), mg = ctx.createChannelMerger(2), eTone = ctx.createBiquadFilter();
    eL.delayTime.value = 0.375 * 2; eR.delayTime.value = 0.375 * 3; fbL.gain.value = 0.38; fbR.gain.value = 0.38;
    eTone.type = 'bandpass'; eTone.frequency.value = 1800; eTone.Q.value = 0.6;
    echo = ctx.createGain(); echo.gain.value = 0.5;
    echo.connect(eTone); eTone.connect(eL); eTone.connect(eR);
    eL.connect(fbL).connect(eR); eR.connect(fbR).connect(eL);
    eL.connect(mg, 0, 0); eR.connect(mg, 0, 1); mg.connect(roomIn); mg.connect(out);
  };

  const send = (node, dry = 0.35, wet = 1.0, ech = 0) => {
    const d = ctx.createGain(); d.gain.value = dry; node.connect(d).connect(out);
    const w = ctx.createGain(); w.gain.value = wet; node.connect(w).connect(roomIn);
    if (ech) { const e = ctx.createGain(); e.gain.value = ech; node.connect(e).connect(echo); }
  };

  //// rubbed glass: inharmonic bowl partials with slow beating
  const BOWL = [1, 2.32, 4.25, 6.63, 9.38];
  const bowls = [];
  const makeBowl = (f, pan) => {
    const g = ctx.createGain(); g.gain.value = 0;
    const p = ctx.createStereoPanner(); p.pan.value = pan;
    g.connect(p); send(p, 0.25, 0.9);
    const parts = BOWL.map((r, k) => {
      const a = ctx.createOscillator(), b = ctx.createOscillator(), pg = ctx.createGain();
      a.frequency.value = f * r; b.frequency.value = f * r + rnd(0.15, 0.6) * (k + 1);
      pg.gain.value = 0.11 / Math.pow(k + 1, 1.5);
      a.connect(pg); b.connect(pg); pg.connect(g); a.start(); b.start();
      return { a, b };
    });
    const bowl = { g, parts, f };
    bowls.push(bowl);
    return bowl;
  };
  const retune = (bowl, f, t) => bowl.parts.forEach((p, k) => {
    p.a.frequency.setTargetAtTime(f * BOWL[k], t, 2.5);
    p.b.frequency.setTargetAtTime(f * BOWL[k] + rnd(0.15, 0.6) * (k + 1), t, 2.5);
  });
  const SETS = [[45, 52], [43, 50], [41, 48], [46, 53]];
  let set = 0;
  const swell = () => {
    const t = ctx.currentTime, S = SETS[set++ % SETS.length];
    bowls.forEach((b, i) => {
      retune(b, hz(S[i]), t);
      b.g.gain.cancelScheduledValues(t);
      b.g.gain.setTargetAtTime(rnd(0.35, 0.7), t, rnd(3, 6));
      b.g.gain.setTargetAtTime(rnd(0.08, 0.18), t + rnd(9, 14), 4);
    });
    setTimeout(swell, rnd(18, 26) * 1000);
  };

  //// orrery: tuned clockwork ticks on polyrhythmic orbits
  const ORBITS = [
    { period: 1.5, note: 81, gain: 0.5 },
    { period: 2.25, note: 76, gain: 0.55 },
    { period: 3.375, note: 72, gain: 0.6 },
    { period: 5.0625, note: 64, gain: 0.7 },
    { period: 7.59, note: 57, gain: 0.8 }
  ];
  const tick = (o, t, phase) => {
    const src = ctx.createBufferSource();
    const len = Math.floor(ctx.sampleRate * 0.006), b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    src.buffer = b;
    const f = hz(o.note);
    const r1 = ctx.createBiquadFilter(); r1.type = 'bandpass'; r1.frequency.value = f; r1.Q.value = 60;
    const r2 = ctx.createBiquadFilter(); r2.type = 'bandpass'; r2.frequency.value = f * 2.76; r2.Q.value = 45;
    const g = ctx.createGain(); g.gain.value = o.gain * 9;
    const pan = ctx.createStereoPanner(); pan.pan.value = Math.sin(phase) * 0.85;
    src.connect(r1).connect(g); src.connect(r2).connect(g);
    g.connect(pan); send(pan, 0.5, 0.6, 0.35);
    src.start(t);
  };
  let orbitT = 0;
  const orrery = () => {
    const now = ctx.currentTime, ahead = now + 0.25;
    ORBITS.forEach((o, i) => {
      if (o.next === undefined) o.next = now + 0.5 + i * 0.37;
      while (o.next < ahead) {
        if (Math.random() > 0.12) tick(o, o.next, (o.next / o.period) * Math.PI * 2 * 0.25 + i);
        o.next += o.period;
      }
    });
    setTimeout(orrery, 100);
  };

  //// ice: crackles and fizz in the cube
  const crackle = (t0, count, spread, lo, hi, gain) => {
    let t = t0;
    for (let i = 0; i < count; i++) {
      const src = ctx.createBufferSource();
      const len = Math.floor(ctx.sampleRate * rnd(0.002, 0.012)), b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
      for (let k = 0; k < len; k++) d[k] = (Math.random() * 2 - 1) * Math.exp(-k / (len * 0.3));
      src.buffer = b;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = rnd(lo, hi); bp.Q.value = rnd(4, 14);
      const g = ctx.createGain(); g.gain.value = gain * rnd(0.3, 1);
      const pan = ctx.createStereoPanner(); pan.pan.value = rnd(-0.6, 0.6);
      src.connect(bp).connect(g).connect(pan); send(pan, 0.6, 0.5);
      src.start(t);
      t += spread * Math.pow(Math.random(), 2.2);
    }
  };
  const crack = () => {
    crackle(ctx.currentTime + 0.05, Math.floor(rnd(8, 30)), rnd(0.03, 0.12), 500, 2600, 1.4);
    setTimeout(crack, rnd(7, 16) * 1000);
  };
  const fizz = () => {
    crackle(ctx.currentTime + 0.02, Math.floor(rnd(3, 8)), 0.18, 5000, 11000, 0.35);
    setTimeout(fizz, rnd(0.3, 0.9) * 1000);
  };

  //// deep: slow FM hum breathing under everything
  const hum = () => {
    const c = ctx.createOscillator(), m = ctx.createOscillator(), mg = ctx.createGain(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
    c.frequency.value = hz(33); m.frequency.value = hz(33) * 1.501; mg.gain.value = 18;
    lp.type = 'lowpass'; lp.frequency.value = 240;
    const lfo = ctx.createOscillator(), lg = ctx.createGain();
    lfo.frequency.value = 0.07; lg.gain.value = 0.05; g.gain.value = 0.07;
    lfo.connect(lg).connect(g.gain);
    m.connect(mg).connect(c.frequency); c.connect(lp).connect(g); send(g, 0.8, 0.3);
    c.start(); m.start(); lfo.start();
  };

  const start = () => {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    bus();
    makeBowl(hz(45), -0.4); makeBowl(hz(52), 0.4);
    hum();
    out.gain.setTargetAtTime(0.85, ctx.currentTime, 2.0);
    swell(); orrery(); setTimeout(crack, 3000); fizz();
  };
  return { start, resume: () => ctx && ctx.resume() };
})();

const kick = () => {
  Audio.start(); Audio.resume();
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(e => window.removeEventListener(e, kick));
};
['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(e => window.addEventListener(e, kick, { passive: true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden) Audio.resume(); });

////////////////////////////////////////////////////////////////
//// CUBE PICKER
////////////////////////////////////////////////////////////////

const CUBES = {};
const picker = document.getElementById('picker');
const setCube = (key) => {
  P.cube = key;
  cube.geometry = GEO[key];
  mirror.geometry = GEO[key];
  picker.querySelectorAll('button[data-k]').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === key ? 'true' : 'false'));
  if (window.__pane) window.__pane.refresh();
};
for (const [k, label] of Object.entries(CUBES)) {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = label; b.dataset.k = k;
  b.addEventListener('click', () => setCube(k));
  picker.appendChild(b);
}
setCube(P.cube);

////////////////////////////////////////////////////////////////
//// POST
////////////////////////////////////////////////////////////////

const pipeline = new THREE.RenderPipeline(renderer);
const scenePass = pass(scene, camera);
const sceneCol = scenePass.getTextureNode('output');
const bloomPass = bloom(sceneCol, P.bloom, 0.5, 0.85);
const vig = smoothstep(1.25, 0.35, length(screenUV.sub(0.5).mul(vec2(1.0, 1.15))));
pipeline.outputNode = sceneCol.add(bloomPass).mul(vig.mul(0.5).add(0.5));

////////////////////////////////////////////////////////////////
//// UI
////////////////////////////////////////////////////////////////

if (QS.has('dev')) try {
  const { Pane } = await import('https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js');
  const pane = new Pane({ title: BUILD, expanded: false });
  const fm = pane.addFolder({ title: 'Motion' });
  fm.addBinding(P, 'spin', { min: 0, max: 1.5 });
  fm.addBinding(P, 'galaxySpin', { min: 0, max: 1.0 });
  const fg = pane.addFolder({ title: 'Galaxy' });
  fg.addBinding(P, 'galaxy', { min: 0, max: 3 }).on('change', e => uGalaxy.value = e.value);
  fg.addBinding(P, 'core', { min: 0, max: 3 }).on('change', e => uCore.value = e.value);
  fg.addBinding(P, 'stars', { min: 0, max: 2 }).on('change', e => uStars.value = e.value);
  fg.addBinding(P, 'nebula', { min: 0, max: 3 }).on('change', e => uNebula.value = e.value);
  const fl = pane.addFolder({ title: 'Glass / Look' });
  fl.addBinding(P, 'ior', { min: 1.0, max: 2.2 }).on('change', e => uIor.value = e.value);
  fl.addBinding(P, 'cube', { options: { 'icecube.obj': 'obj', procedural: 'procedural' } }).on('change', e => setCube(e.value));
  window.__pane = pane;
  fl.addBinding(P, 'wobble', { min: 0, max: 3 }).on('change', e => uWobble.value = e.value);
  fl.addBinding(P, 'bloom', { min: 0, max: 2 }).on('change', e => bloomPass.strength.value = e.value);
  fl.addBinding(P, 'exposure', { min: 0.3, max: 2.5 }).on('change', e => renderer.toneMappingExposure = e.value);
} catch (e) {}

////////////////////////////////////////////////////////////////
//// LOOP
////////////////////////////////////////////////////////////////

const tilt = new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(0.2, 0.0, -0.06));
const spinM = new THREE.Matrix4();
const galM4 = new THREE.Matrix4();
const clock = new THREE.Timer();
let rotY = 0.6, galA = 0;

let vw = 0, vh = 0;
const syncSize = () => {
  const w = window.innerWidth, h = window.innerHeight;
  if (w === vw && h === vh) return;
  const aspectChanged = vw && Math.sign(w / h - 1) !== Math.sign(vw / vh - 1);
  vw = w; vh = h;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  fitCamera(!aspectChanged && vw !== 0);
};
syncSize();
fitCamera(false);
let ema = 16, tune = 0;
const adapt = (dt) => {
  ema += (dt * 1000 - ema) * 0.05;
  if ((tune += dt) < 1.0) return;
  tune = 0;
  let next = pr;
  if (ema > 24) next = Math.max(PR_MIN, pr - 0.1);
  else if (ema < 15 && pr < PR_MAX) next = Math.min(PR_MAX, pr + 0.05);
  if (Math.abs(next - pr) > 0.001) { pr = next; renderer.setPixelRatio(pr); renderer.setSize(vw, vh); }
};

let firstFrame = true;
renderer.setAnimationLoop((ts) => {
  clock.update(ts);
  syncSize();
  adapt(clock.getDelta());
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsed();
  uTime.value = t;
  rotY += dt * P.spin;
  galA += dt * P.galaxySpin;
  cube.rotation.y = rotY;
  mirror.rotation.y = rotY;
  spinM.makeRotationY(galA);
  galM4.multiplyMatrices(spinM, tilt.clone().invert());
  uGal.value.setFromMatrix4(galM4);
  uGalN.value.set(galM4.elements[1], galM4.elements[5], galM4.elements[9]);
  controls.update();
  pipeline.render();
  if (firstFrame) { firstFrame = false; document.getElementById('loading').classList.add('off'); }
});

</script>
